# Include inside the canonical HTTPS server block, using a copy outside the document root.
location = /api/snakkie/chat {
    client_max_body_size 12k;
    client_body_timeout 10s;
    proxy_pass http://127.0.0.1:8791;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Snakkie-Client-IP $remote_addr;
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 55s;
    proxy_ignore_client_abort off;
    proxy_next_upstream off;
    proxy_intercept_errors off;
}

location ^~ /server/snakkie/ {
    return 404;
}
