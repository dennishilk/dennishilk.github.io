name: Patch personnel language loader

on:
  push:
    branches: [agent/personnel-de]
    paths:
      - '.github/workflows/patch-personnel-language-loader.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/personnel-de
      - name: Wire personnel translation bundle
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('site-language.js')
          text = p.read_text()
          text = text.replace('const VERSION = "2026-08-09-peatland-2";', 'const VERSION = "2026-08-09-personnel-1";', 1)
          marker = '    "/site-i18n-de-peatland-polish.js?v=20260809-peatland-2",\n'
          if marker not in text:
              raise SystemExit('site-language bundle marker missing')
          text = text.replace(marker, marker + '    "/site-i18n-de-personnel.js?v=20260809-personnel-1",\n', 1)
          p.write_text(text)

          p = Path('stars.js')
          text = p.read_text()
          old = '/site-language.js?v=20260809-peatland-2'
          new = '/site-language.js?v=20260809-personnel-1'
          if old not in text:
              raise SystemExit('stars language loader marker missing')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Validate language JavaScript
        run: |
          node --check site-i18n-de-personnel.js
          node --check site-language.js
          node --check stars.js
      - name: Commit loader changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-language.js stars.js
          git commit -m 'Wire personnel archive German translation'
          git push origin HEAD:agent/personnel-de
