name: Sitemap and SEO checks

on:
  pull_request:
    paths:
      - "sitemap.xml"
      - "sitemap-de.xml"
      - "sitemap-internet-observers.xml"
      - "sitemap-technology-observers.xml"
      - "sitemap-images.xml"
      - "robots.txt"
      - "de/**"
      - "museum/**"
      - "tools/image-converter/**"
      - "tools/image-converter/**"
      - "site-i18n-de*.js"
      - "museum-de-mirror-loader.js"
      - "world-observer/**"
      - "stars.js"
      - "seo-runtime.js"
      - "wiesmoor-de-bootstrap.js"
      - "wiesmoor-language-route.js"
      - "tests/sitemaps.test.mjs"
      - "tests/seo-localization.test.mjs"
      - "tests/museum-seo.test.mjs"
      - "tests/image-converter-seo.test.mjs"
      - "tests/image-converter-seo.test.mjs"
      - ".github/workflows/sitemap-check.yml"
  push:
    branches:
      - main
    paths:
      - "sitemap.xml"
      - "sitemap-de.xml"
      - "sitemap-internet-observers.xml"
      - "sitemap-technology-observers.xml"
      - "sitemap-images.xml"
      - "robots.txt"
      - "de/**"
      - "museum/**"
      - "site-i18n-de*.js"
      - "museum-de-mirror-loader.js"
      - "world-observer/**"
      - "stars.js"
      - "seo-runtime.js"
      - "wiesmoor-de-bootstrap.js"
      - "wiesmoor-language-route.js"
      - "tests/sitemaps.test.mjs"
      - "tests/seo-localization.test.mjs"
      - "tests/museum-seo.test.mjs"
      - ".github/workflows/sitemap-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate sitemap contracts
        run: node --test tests/sitemaps.test.mjs
      - name: Validate SEO and localization contracts
        run: node --test tests/seo-localization.test.mjs
      - name: Validate Computer Museum SEO contracts
        run: node --test tests/museum-seo.test.mjs
      - name: Validate Image Converter SEO contracts
        run: node --test tests/image-converter-seo.test.mjs
      - name: Check SEO JavaScript syntax
        run: |
          node --check seo-runtime.js
          node --check wiesmoor-de-bootstrap.js
          node --check wiesmoor-language-route.js
          node --check stars.js
          node --check world-observer/technology/space-satellites-language.js
