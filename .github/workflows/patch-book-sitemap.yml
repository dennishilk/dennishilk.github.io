name: Patch book sitemap entries

on:
  push:
    branches: [agent/sitemap-book-indexing]
    paths:
      - '.github/workflows/patch-book-sitemap.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sitemap-book-indexing
      - name: Add indexable novel URLs to sitemap
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          sitemap = Path('sitemap.xml')
          text = sitemap.read_text()
          novel = Path('lost-administrator/novel/index.html').read_text()

          chapter_paths = []
          for path in re.findall(r'href="(/lost-administrator/novel/chapters/[^"]+/)"', novel):
              if path not in chapter_paths:
                  chapter_paths.append(path)

          if len(chapter_paths) != 24:
              raise SystemExit(f'expected 24 chapter URLs, found {len(chapter_paths)}')

          urls = ['/lost-administrator/novel/'] + chapter_paths
          urls = [f'https://dennishilk.com{path}' for path in urls]
          missing = [url for url in urls if f'<loc>{url}</loc>' not in text]

          marker = '  <url>\n    <loc>https://dennishilk.com/lost-administrator/</loc>\n  </url>\n'
          if marker not in text:
              raise SystemExit('Lost Administrator sitemap marker not found')

          block = ''.join(f'  <url><loc>{url}</loc></url>\n' for url in missing)
          if block:
              text = text.replace(marker, marker + block, 1)
              sitemap.write_text(text)

          ET.parse(sitemap)
          if 'https://dennishilk.com/lost-administrator/workstation/' in text:
              raise SystemExit('noindex workstation must not be in sitemap')
          print(f'Novel URLs ensured: {len(urls)}; newly added: {len(missing)}')
          PY
      - name: Commit sitemap patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml
          git commit -m 'Add Lost Administrator novel pages to sitemap'
          git push origin HEAD:agent/sitemap-book-indexing
