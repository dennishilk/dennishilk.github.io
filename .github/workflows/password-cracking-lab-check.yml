name: Password Cracking Lab
on:
  push:
    paths:
      - 'assets/password-cracking-lab/**'
      - 'museum/password-cracking-lab/**'
      - 'de/museum/password-cracking-lab/**'
      - 'blog/how-fast-can-your-computer-crack-a-password/**'
      - 'de/blog/how-fast-can-your-computer-crack-a-password/**'
      - 'scripts/*password-cracking*'
      - 'tests/password-cracking-lab.test.mjs'
      - '.github/workflows/password-cracking-lab-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check generated worker and cryptographic / integration tests
        run: |
          node scripts/build-password-cracking-worker.mjs --check
          node --test tests/password-cracking-lab.test.mjs tests/blog-rss.test.mjs tests/museum-bilingual-coverage.test.mjs tests/cryptography-labs-04-08.test.js tests/museum-seo.test.mjs tests/sitemaps.test.mjs tests/seo-localization.test.mjs
      - name: SEO audit
        run: node scripts/audit-seo.mjs
      - name: Install browser test driver
        run: npm install --no-save --no-package-lock playwright@1.62.1
      - name: Execute real browser CPU, WGSL and Hybrid acceptance
        env:
          PASSWORD_LAB_BROWSER: /usr/bin/google-chrome
        run: node scripts/test-password-cracking-browser.mjs
