name: Patch Peatland proxy basis display

on:
  push:
    branches: [agent/peatland-proxy-basis]
    paths:
      - '.github/workflows/patch-peatland-proxy-basis.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/peatland-proxy-basis
      - name: Clarify Peatland proxy basis
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('world-observer/wiesmoor-peatland.html')
          text = p.read_text()
          replacements = {
            '<p><span>Confidence</span><strong id="pressure-confidence">pending</strong></p>': '<p><span>Proxy basis</span><strong id="pressure-confidence">pending</strong></p>',
            '<p><span>Data status</span><strong id="pressure-data-status">not yet live-ingested</strong></p>': '<p><span>Data coverage</span><strong id="pressure-data-status">not yet live-ingested</strong></p>',
            '<p class="peatland-note">Regional proxy observation — not an in-situ peat water-table sensor.</p>': '<p class="peatland-note">Regional proxy observation — not an in-situ peat water-table sensor. Proxy basis shows how many live proxy groups contribute to the classification; it is not a source-quality rating.</p>',
            'set("pressure-confidence", data?.peatland_hydrological_pressure?.confidence);': 'const contributingGroups = data?.peatland_hydrological_pressure?.contributing_proxy_groups;\n    const proxyBasis = Array.isArray(contributingGroups) && contributingGroups.length ? `${contributingGroups.length} contributing proxy ${contributingGroups.length === 1 ? "group" : "groups"}` : clean(data?.peatland_hydrological_pressure?.confidence);\n    set("pressure-confidence", proxyBasis);',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing Peatland HTML marker: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text)

          p = Path('site-i18n-de-wiesmoor.js')
          text = p.read_text()
          text = text.replace('      "Confidence": "Vertrauensniveau",\n', '      "Proxy basis": "Proxy-Grundlage",\n      "Data coverage": "Datenabdeckung",\n      "Regional proxy observation — not an in-situ peat water-table sensor. Proxy basis shows how many live proxy groups contribute to the classification; it is not a source-quality rating.": "Regionale Proxy-Beobachtung — kein In-situ-Sensor für den Moorwasserstand. Die Proxy-Grundlage zeigt, wie viele Live-Proxygruppen in die Klassifikation eingehen; sie bewertet nicht die Qualität der Quelldaten.",\n      "1 contributing proxy group": "1 berücksichtigte Proxygruppe",\n      "2 contributing proxy groups": "2 berücksichtigte Proxygruppen",\n      "3 contributing proxy groups": "3 berücksichtigte Proxygruppen",\n', 1)
          p.write_text(text)

          p = Path('site-language.js')
          text = p.read_text()
          text = text.replace('const VERSION = "2026-08-09-wiesmoor-4";', 'const VERSION = "2026-08-09-peatland-1";', 1)
          text = text.replace('/site-i18n-de-wiesmoor.js?v=20260809-wiesmoor-4', '/site-i18n-de-wiesmoor.js?v=20260809-peatland-1', 1)
          p.write_text(text)

          p = Path('stars.js')
          text = p.read_text()
          import re
          text, n = re.subn(r"/site-language\.js\?v=[^']+", "/site-language.js?v=20260809-peatland-1", text, count=1)
          if n != 1:
              raise SystemExit('stars.js language loader marker not found')
          p.write_text(text)
          PY
      - name: Validate JavaScript syntax
        run: |
          node --check site-language.js
          node --check site-i18n-de-wiesmoor.js
          node --check stars.js
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world-observer/wiesmoor-peatland.html site-i18n-de-wiesmoor.js site-language.js stars.js
          git commit -m 'Clarify Peatland proxy basis display'
          git push origin HEAD:agent/peatland-proxy-basis
