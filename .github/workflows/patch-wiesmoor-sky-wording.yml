name: Patch Wiesmoor sky wording

on:
  push:
    branches: [agent/wiesmoor-observers-de]
    paths:
      - '.github/workflows/patch-wiesmoor-sky-wording.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wiesmoor-observers-de
      - name: Refine German sky wording and cache versions
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('site-i18n-de-wiesmoor.js')
          text = p.read_text()
          replacements = {
            'dunklen Beobachtungsfenstern.': 'astronomischen Dunkelphasen.',
            '"BEST DARK WINDOW": "BESTES DUNKELFENSTER"': '"BEST DARK WINDOW": "BESTE DUNKELPHASE"',
            '"Best astronomical darkness window tonight": "Bestes Fenster astronomischer Dunkelheit heute Nacht"': '"Best astronomical darkness window tonight": "Beste astronomische Dunkelphase heute Nacht"',
            '"No astronomical darkness window tonight": "Heute Nacht kein Fenster astronomischer Dunkelheit"': '"No astronomical darkness window tonight": "Heute Nacht keine astronomische Dunkelphase"',
            '"Best dark window": "Bestes Dunkelfenster"': '"Best dark window": "Beste Dunkelphase"',
            '"Civil dusk": "Ende der bürgerlichen Dämmerung"': '"Civil dusk": "Bürg. Dämmerung Ende"',
            '"Nautical dusk": "Ende der nautischen Dämmerung"': '"Nautical dusk": "Naut. Dämmerung Ende"',
            '"Astronomical dusk": "Ende der astronomischen Dämmerung"': '"Astronomical dusk": "Astr. Dämmerung Ende"',
            '"Best dark window starts": "Bestes Dunkelfenster beginnt"': '"Best dark window starts": "Dunkelphase beginnt"',
            '"Best dark window ends": "Bestes Dunkelfenster endet"': '"Best dark window ends": "Dunkelphase endet"',
            '"Astronomical dawn": "Beginn der astronomischen Dämmerung"': '"Astronomical dawn": "Astr. Dämmerung Beginn"',
            '"Nautical dawn": "Beginn der nautischen Dämmerung"': '"Nautical dawn": "Naut. Dämmerung Beginn"',
            '"Civil dawn": "Beginn der bürgerlichen Dämmerung"': '"Civil dawn": "Bürg. Dämmerung Beginn"',
            '["Best astronomical darkness window tonight.", "Bestes Fenster astronomischer Dunkelheit heute Nacht."]': '["Best astronomical darkness window tonight.", "Beste astronomische Dunkelphase heute Nacht."]',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing wording marker: {old}')
              text = text.replace(old, new, 1)

          marker = '      "Not reached tonight": "Heute Nacht nicht erreicht",\n'
          insert = '      "No Astronomical Darkness": "Keine astronomische Dunkelheit",\n      "Low": "Gering",\n'
          if insert not in text:
              if marker not in text:
                  raise SystemExit('mapping insertion marker missing')
              text = text.replace(marker, marker + insert, 1)
          p.write_text(text)

          p = Path('site-language.js')
          text = p.read_text()
          text = text.replace('const VERSION = "2026-08-09-wiesmoor-2";', 'const VERSION = "2026-08-09-wiesmoor-3";', 1)
          text = text.replace('/site-i18n-de-wiesmoor.js?v=20260809-wiesmoor-1', '/site-i18n-de-wiesmoor.js?v=20260809-wiesmoor-3', 1)
          p.write_text(text)

          p = Path('stars.js')
          text = p.read_text().replace('/site-language.js?v=20260809-observers-3', '/site-language.js?v=20260809-wiesmoor-3', 1)
          p.write_text(text)

          p = Path('world-observer/horizon-observer.html')
          text = p.read_text().replace('/site-language.js?v=20260809-wiesmoor-2', '/site-language.js?v=20260809-wiesmoor-3', 1)
          p.write_text(text)
          PY
      - name: Validate JavaScript syntax
        run: |
          node --check site-language.js
          node --check site-i18n-de-wiesmoor.js
          node --check stars.js
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-i18n-de-wiesmoor.js site-language.js stars.js world-observer/horizon-observer.html
          git commit -m 'Refine German Wiesmoor sky wording'
          git push origin HEAD:agent/wiesmoor-observers-de
