name: Patch Horizon language loader

on:
  push:
    branches: [agent/wiesmoor-observers-de]
    paths:
      - '.github/workflows/patch-horizon-language.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wiesmoor-observers-de
      - name: Insert site language loader
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('world-observer/horizon-observer.html')
          text = path.read_text()
          script = '  <script defer src="/site-language.js?v=20260809-wiesmoor-2"></script>\n'
          if script not in text:
              marker = '  <link rel="stylesheet" href="/style.css?v=49">\n'
              if marker not in text:
                  raise SystemExit('stylesheet marker not found')
              text = text.replace(marker, marker + script, 1)
              path.write_text(text)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add world-observer/horizon-observer.html
          git commit -m 'Load language controller on Horizon Observer'
          git push origin HEAD:agent/wiesmoor-observers-de
