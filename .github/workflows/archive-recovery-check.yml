name: Archive Recovery Lab checks

on:
  push:
    branches: [main]
    paths:
      - 'assets/archive-recovery-lab/**'
      - 'tests/archive-recovery*.test.mjs'
      - 'scripts/archive-recovery-fixtures.py'
      - 'scripts/build-archive-recovery-worker.mjs'
      - '.github/workflows/archive-recovery-check.yml'

permissions:
  contents: read

jobs:
  archive-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only fixture dependency
        run: python -m pip install 'cryptography==43.0.3'
      - name: Archive ZIP and format-probe tests
        run: npm run test:archive-recovery
      - name: Existing Password Cracking Lab regression
        run: npm run test:password-cracking
      - name: Museum Node regression
        run: node --test tests/museum*.test.mjs
      - name: Worker bundler reproducibility
        run: |
          npm run build:archive-recovery
          git diff --exit-code -- assets/archive-recovery-lab/worker-source.js
      - name: Site SEO audit
        run: npm run test:seo
