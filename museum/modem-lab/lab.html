  <header class="lab-header"><p class="lab-kicker">Computer Museum / Data Communications Lab</p><h1 id="labTitle">Modem &amp; Acoustic Coupler Lab</h1><p id="labIntro">Operate a historically inspired acoustic-coupler workstation: lift the handset, dial the fictional NEBUNIX access number, place the answered call into the coupler, and acquire carrier at 300 BIT/S.</p></header>

<script>
(()=>{
const $=id=>document.getElementById(id);const workbench=$('workbench');const announcer=$('announcer');const infoToggle=$('infoToggle');const eraButtons={acoustic:$('eraAcoustic'),dialup:$('eraDialup'),speed:$('eraSpeed')};let activeEra='acoustic';let cleanup=()=>{};
class TimerBag{constructor(){this.timers=[];this.token=0}newToken(){this.clear();return ++this.token}later(fn,ms,token=this.token){const t=setTimeout(()=>{if(token===this.token)fn()},ms);this.timers.push(t);return t}clear(){this.timers.forEach(clearTimeout);this.timers=[];this.token++}}
class AudioEngine{constructor(){this.ctx=null;this.master=null;this.nodes=[];this.unavailable=false}ensure(){if(this.unavailable)return Promise.resolve(false);const C=window.AudioContext||window.webkitAudioContext;if(!C){this.unavailable=true;return Promise.resolve(false)}try{if(!this.ctx){this.ctx=new C();this.master=this.ctx.createGain();this.master.gain.value=.42;const compressor=this.ctx.createDynamicsCompressor();compressor.threshold.value=-12;compressor.knee.value=18;compressor.ratio.value=3;compressor.attack.value=.01;compressor.release.value=.18;this.master.connect(compressor);compressor.connect(this.ctx.destination)}return this.ctx.state==='suspended'?this.ctx.resume().then(()=>true).catch(()=>{this.unavailable=true;return false}):Promise.resolve(true)}catch(e){this.unavailable=true;return Promise.resolve(false)}}stop(){this.nodes.forEach(n=>{try{n.stop&&n.stop()}catch(e){}try{n.disconnect&&n.disconnect()}catch(e){}});this.nodes=[]}tone(freqs,dur=.2,vol=.35,type='sine'){this.ensure().then(ok=>{if(!ok||!this.ctx)return;const now=this.ctx.currentTime;const g=this.ctx.createGain();g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(vol,now+.015);g.gain.exponentialRampToValueAtTime(.0001,now+dur);g.connect(this.master);freqs.forEach(f=>{const o=this.ctx.createOscillator();o.type=type;o.frequency.value=f;o.connect(g);o.start(now);o.stop(now+dur+.03);this.nodes.push(o)});this.nodes.push(g)})}loop(freqs,vol=.12,type='sine'){this.ensure().then(ok=>{if(!ok||!this.ctx)return;this.stop();const g=this.ctx.createGain();g.gain.value=vol;g.connect(this.master);freqs.forEach(f=>{const o=this.ctx.createOscillator();o.type=type;o.frequency.value=f;o.connect(g);o.start();this.nodes.push(o)});this.nodes.push(g)})}noise(dur=.45,vol=.1){this.ensure().then(ok=>{if(!ok||!this.ctx)return;const sr=this.ctx.sampleRate,b=this.ctx.createBuffer(1,Math.max(1,Math.floor(sr*dur)),sr),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/d.length*.8);const src=this.ctx.createBufferSource();src.buffer=b;const filt=this.ctx.createBiquadFilter();filt.type='bandpass';filt.frequency.value=1800;filt.Q.value=4;const g=this.ctx.createGain();g.gain.value=vol;src.connect(filt);filt.connect(g);g.connect(this.master);src.start();src.stop(this.ctx.currentTime+dur);this.nodes.push(src,g,filt)})}sweep(from,to,dur=.5,vol=.14){this.ensure().then(ok=>{if(!ok||!this.ctx)return;const now=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='square';o.frequency.setValueAtTime(from,now);o.frequency.exponentialRampToValueAtTime(to,now+dur);g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(.0001,now+dur);o.connect(g);g.connect(this.master);o.start(now);o.stop(now+dur+.02);this.nodes.push(o,g)})}}
const sharedAudio=new AudioEngine();

function mountAcoustic(){workbench.innerHTML=`<div class="instrument-panel" aria-labelledby="acousticTitle"><div class="link-console"><div class="link-label" id="acousticTitle">ACOUSTIC LINK</div><div class="speed-readout" id="speedReadout" aria-label="Line rate 300 bits per second">300 BIT/S</div><div class="status-row"><span class="status-lamp ready" id="stateLamp">REMOTE DATA COMMUNICATION</span><span class="status-lamp" id="carrierLamp">NO CARRIER</span></div></div><div class="workstation"><section class="device telephone" aria-labelledby="phoneTitle"><h2 id="phoneTitle">Telephone</h2><div class="phone-base"><div class="cradle"><span class="hook" id="hookLabel">ON HOOK</span><button class="handset-button" id="handset" type="button" aria-label="Lift telephone handset"><span class="handset-shape"><span class="ear" aria-hidden="true"></span><span class="mouth" aria-hidden="true"></span></span></button></div><div class="dial-display" id="dialDisplay">—</div><div class="keypad" id="keypad" aria-label="Telephone keypad"></div><p class="phone-note">NEBUNIX REMOTE COMPUTING SERVICE<br>ACCESS NUMBER <strong>555-0133</strong></p></div></section><section class="device coupler"><h2>Museum Data Coupler</h2><div class="model">MODEL AC-300</div><div class="coupler-box"><button class="coupler-drop" id="couplerDrop" type="button"><span class="placement-guide" aria-hidden="true"></span><span class="cup"><span class="cup-label">RECEIVER</span></span><span class="cup"><span class="cup-label">TRANSMITTER</span></span><span class="placed-handset" id="placedHandset"><span class="ear"></span><span class="mouth"></span></span><span class="orientation">RECEIVER ← HANDSET ORIENTATION → TRANSMITTER</span></button><div class="indicator-row"><span class="indicator"><span class="lamp-dot" id="powerDot"></span>POWER <strong id="powerText">OFF</strong></span><span class="indicator"><span class="lamp-dot" id="carrierDot"></span>CARRIER <strong id="carrierText">NO</strong></span></div><button class="action-button" id="connectCoupler" type="button">CONNECT COUPLER</button><p class="guide-copy">The handset speaker and microphone align with the rubber cups so computer data can ride through an ordinary voice call.</p></div></section></div><div class="audio-caption" id="audioCaption" aria-live="polite"></div></div><aside class="terminal-panel"><div class="terminal-title">NEBUNIX REMOTE COMPUTING SERVICE</div><div class="terminal-screen" id="terminalScreen" aria-live="polite"></div><div class="terminal-controls"><button class="begin-button" id="beginButton" type="button">BEGIN CONNECTION</button><div class="transmission-controls" id="transmissionControls"><button class="utility-button" id="historicalMode" type="button" aria-pressed="true">HISTORICAL</button><button class="utility-button" id="acceleratedMode" type="button" aria-pressed="false">ACCELERATED</button></div><button class="action-button" id="resetButton" type="button">HANG UP / RESET</button></div><div class="terminal-meta"><div class="terminal-status"><span class="data-lamp" id="rxLamp">RX IDLE</span><span id="lineModelStatus">LINE 300 BIT/S · 8N1 · ~30 CHAR/S</span></div><p class="terminal-help" id="terminalHelp">TAP TERMINAL TO TYPE. LOCAL ECHO IS IMMEDIATE; REMOTE TEXT RETURNS AT THE SELECTED TRANSMISSION SPEED.</p></div><div class="info-panel" id="infoPanel"><strong>Why the handset?</strong> The coupler uses acoustic interfaces aligned with a telephone handset speaker and microphone, allowing data tones to travel through an ordinary voice telephone connection.<br><br><strong>What is a carrier?</strong> A carrier is the signal used to establish and maintain the data link.<br><br><strong>Simulated line rate</strong><br>300 BIT/S with an educational 8N1 model: 1 start + 8 data + 1 stop = 10 line bits per character, or roughly 30 characters per second. Baud measures symbols per second and is not universally identical to bit/s.</div><p class="lab-note">Browser-only simulation with a fictional NEBUNIX re  startRemote(){remote='login';out='';render();transmit('NEBUNIX REMOTE COMPUTING SERVICE\nREMOTE ACCESS NODE 01\n\nLINE RATE: 300 BIT/S\n\nMUSEUM VISITOR ACCESS\nLOGIN AS: GUEST\n\nLOGIN: ')}function submit(v){if(!remote)return;const c=v.trim().toUpperCase();out+='> '+c+'\n';if(remote==='login'){if(c==='GUEST'){remote='menu';transmit('\nACCESS ACCEPTED\n\nWELCOME TO NEBUNIX\nREMOTE COMPUTING SERVICE\nEDUCATIONAL ACCESS SESSION\n\nNEBUNIX MAIN MENU\n\n1  SYSTEM INFORMATION\n2  COMPUTER HISTORY ARCHIVE\n3  MESSAGE TERMINAL\n4  NETWORK STATUS\n5  LINE INFORMATION\n6  LOG OFF\n\nSELECT: ')}else transmit('\nUNKNOWN USER\nTRY: GUEST\n\nLOGIN: ');return}if(c==='6'||c==='LOGOFF'||c==='LOG OFF'){carrier=false;transmit('\nSESSION CLOSED\n\nNO CARRIER\n',reset);return}transmit('\nNEBUNIX NODE 01 ONLINE. SELECT 6 TO LOG OFF.\n\nSELECT: ')}['1','2','3','4','5','6','7','8','9','0'].forEach(n=>{const b=document.createElement('button');b.className='key-button';b.type='button';b.textContent=n;b.onclick=()=>dial(n);e('keypad').appendChild(b)});function dragPos(x,y){dragVisual.style.transform='translate3d('+(x-drag.ox)+'px,'+(y-drag.oy)+'px,0) rotate(-2deg)'}function overDrop(x,y){const r=e('couplerDrop').getBoundingClientRect(),pad=36;return x>=r.left-pad&&x<=r.right+pad&&y>=r.top-pad&&y<=r.bottom+pad}function cancelDrag(){if(!drag)return;try{e('handset').releasePointerCapture(drag.id)}catch(_){}drag=null;e('handset').classList.remove('drag-source');e('couplerDrop').classList.remove('drag-target');dragVisual.style.transform='translate3d(-9999px,-9999px,0) rotate(-2deg)'}function dragStart(ev){if(!canPlace())return;const r=e('handset').getBoundingClientRect();drag={id:ev.pointerId,sx:ev.clientX,sy:ev.clientY,ox:ev.clientX-r.left,oy:ev.clientY-r.top,moved:false};dragVisual.style.width=r.width+'px';dragVisual.style.height=r.height+'px';e('handset').classList.add('drag-source');e('couplerDrop').classList.add('drag-target');e('handset').setPointerCapture(ev.pointerId);dragPos(ev.clientX,e class ATCommandParser{parse(raw){const c=raw.replace(/\s+/g,'').toUpperCase();if(c==='AT')return{type:'ok'};if(c==='ATI')return{type:'info'};if(c==='ATZ')return{type:'reset'};if(c==='ATH')return{type:'hangup'};if(c==='ATDT5550133')return{type:'dial'};return{type:'error'}}}
function mountDialup(){workbench.innerHTML=`<div class="instrument-panel"><div class="link-console"><div class="link-label">DIAL-UP MODEM LINK</div><div class="speed-readout" id="dialSpeed" aria-label="Negotiated line rate">COMMAND MODE</div><div class="status-row"><span class="status-lamp ready" id="dialStateLamp">MODEM READY</span><span class="status-lamp" id="dialCarrierLamp">NO CARRIER</span></div></div><div class="stage-list" id="stageList" aria-label="Negotiation stages"></div><div class="dialup-grid"><section class="device"><h2>External Modem</h2><div class="modem-case"><div class="modem-brand">MUSEUM DATA MODEM</div><div class="modem-model">MODEL MD-56</div><div class="modem-window"><div class="modem-led-grid" id="ledGrid"></div></div><div class="modem-speaker" aria-hidden="true"></div><p class="dialup-copy">Generic late dial-up desktop modem. LEDs are simplified but historically meaningful: TR terminal ready, OH off hook, CD carrier detected, SD/RD send/receive activity.</p></div></section><section class="device"><h2>Modem Terminal</h2><div class="modem-terminal" id="modemTerminal"><div class="modem-output" id="modemOutput" aria-live="polite"></div><label class="modem-command-line"><span class="terminal-prompt">&gt;</span><input class="modem-command-input" id="modemInput" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" aria-label="Type AT modem command"></label><div class="shortcuts" aria-label="Command shortcuts"><button class="shortcut-button" data-command="AT">AT</button><button class="shortcut-button" data-command="ATI">ATI</button><button class="shortcut-button" data-command="ATZ">ATZ</button><button class="shortcut-button" data-command="ATDT5550133">ATDT5550133</button><button class="shortcut-button" data-command="ATH">ATH</button></div></div></section></div><div class="audio-caption" id="dialCaption" aria-live="polite"></div></div><aside class="terminal-panel"><div class="terminal-title">DIAL-UP EXHIBIT NOTES</div><div class="info-panel open" id="infoPanel"><strong>What does a modem do?</strong> It modulates digital information into audio tones for telephone circuits and demodulates received tones back into data.<br><br><strong>Why the famous sound?</strong> During negotiation you hear a historical modem handshake: modems were establishing communication, exchanging capabilities, choosing signaling methods, and testing the telephone line before a usable carrier/data connection. The visible stages are an educational approximation, not one-to-one labels for every chirp.<br><br><strong>Historical audio provenance</strong> <em>Dial up modem noises.ogg</em> is sourced from <a href="https://commons.wikimedia.org/wiki/File:Dial_up_modem_noises.ogg" target="_blank" rel="noopener noreferrer">Wikimedia Commons</a>, where it is identified as public domain. This fictional modem interface and workflow are an original educational recreation.<br><br><strong>AT commands</strong> AT means attention. DT means dial using tone dialing, so ATDT5550133 tells this fictional modem to tone-dial NEBUNIX at 555-0133.<br><br><strong>Carrier and training</strong> CD lights when a usable carrier is detected. Negotiation/training let modems choose workable signaling for the line conditions.<br><br><strong>Baud vs bit/s</strong> Baud is symbols per second. Bit/s is information bits per second. Early simple modulation could make the numbers coincide; later modems encoded multiple bits per symbol, so bit/s could be much higher than baud.<br><br><strong>About 56k</strong> “56k” modems were marketed around a nominal maximum downstream rate, but actual negotiated rates depended on telephone-line conditions, network equipment, standards, regulation, and other factors. Technologies such as V.90 also had substantially lower upstream rates, so this exhibit does not imply symmetric 56 kbit/s.</div><p class="lab-note">Telephone interaction is generated Web Audio; negotiation uses a historical Wikimedia Commons recording. The simulation is historically inspired, not a bit-perfect protocol trace. Remote text uses a perceptually scaled model so 49.3 KBIT/S feels dramatically faster without scheduling every bit.</p><button class="action-button" id="dialReset" type="button">HANG UP / RESET</button></aside>`;return dialupApp();}
function dialupApp(){const bag=new TimerBag(),parser=new ATCommandParser(),reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let state='command',carrier=false,offHook=false,stage='',out='MUSEUM DATA MODEM\nMODEL MD-56\n\nREADY\n\nTYPE: AT\n',remote='command',handshake=null,handshakeFailed=false;const leds=['POWER','TR','RD','SD','CD','OH'];$('ledGrid').innerHTML=leds.map(l=>`<span class="modem-light"><span class="modem-led ${l==='OH'?'amber':''}" id="led${l}"></span>${l}</span>`).join('');const stages=['DIAL TONE','DIALING','RINGBACK','REMOTE ANSWER','NEGOTIATING','TRAINING','CARRIER DETECTED'];$('stageList').innerHTML=stages.map(s=>`<span class="stage-pill" id="stage${s.replace(/ /g,'')}">${s}</span>`).join('');function render(){leds.forEach(l=>{$('led'+l).classList.toggle('on',l==='POWER'||l==='TR'||(l==='CD'&&carrier)||(l==='OH'&&offHook))});$('dialCarrierLamp').textContent=carrier?'CARRIER DETECTED':'NO CARRIER';$('dialCarrierLamp').classList.toggle('ready',carrier);$('dialStateLamp').textContent=state==='negotiating'?'NEGOTIATING':(carrier?'ONLINE':'MODEM READY');$('dialSpeed').textContent=carrier?'49.3 KBIT/S':(state==='negotiating'?'NEGOTIATING':'COMMAND MODE');$('dialSpeed').classList.toggle('active',carrier);$('modemOutput').textContent=out;$('modemOutput').scrollTop=$('modemOutput').scrollHeight;$('dialCaption').textContent=stage;stages.forEach(s=>{$('stage'+s.replace(/ /g,'')).classList.toggle('active',stage.includes(s))});$('modemInput').disabled=false;$('modemInput').placeholder=state==='negotiating'?'TYPE ATH TO ABORT':'';announcer.textContent=stage||'Dial-up modem ready'}function append(t,rd=false){out+=t;render();if(rd)flash('RD')}function flash(which){const el=$('led'+which);el.classList.add('on');bag.later(()=>{if(which==='RD'||which==='SD')el.classList.remove('on')},180)}function stopHandshake(){if(!handshake)return;handshake.onended=null;handshake.onerror=null;handshake.pause();handshake.currentTime=0;handshake=null}function finish()
