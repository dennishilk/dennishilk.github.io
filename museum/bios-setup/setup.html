<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Computer Museum BIOS Setup Utility</title>
  <meta name="description" content="Interactive educational BIOS Setup Utility shell for the Computer Museum.">
  <style>
    :root {
      --bios-blue: #000080;
      --bios-blue-dark: #000050;
      --bios-gray: #d8d8d8;
      --bios-white: #ffffff;
      --bios-cyan: #00ffff;
      --bios-shadow: #404040;
      --bios-black: #000000;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bios-blue);
      color: var(--bios-white);
      font-family: "Lucida Console", "Courier New", monospace;
    }

    body {
      display: grid;
      place-items: center;
      padding: clamp(2px, 0.8vw, 8px);
    }

    .bios-screen {
      width: min(1480px, calc(100vw - 8px));
      height: min(940px, calc(100vh - 8px));
      min-height: min(620px, 100vh);
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto auto;
      border: 3px double var(--bios-gray);
      background: var(--bios-blue);
      box-shadow: 0 0 0 2px var(--bios-blue-dark), 0 0 36px rgba(0, 0, 0, 0.45);
      outline: 2px solid transparent;
    }

    .bios-screen:focus { outline-color: var(--bios-cyan); }

    .bios-header {
      text-align: center;
      line-height: 1.35;
      padding: 10px 12px 8px;
      border-bottom: 2px solid var(--bios-gray);
      color: var(--bios-gray);
    }

    .bios-title { color: var(--bios-white); font-weight: 700; }

    .bios-menu {
      display: flex;
      flex-wrap: wrap;
      gap: 0 12px;
      justify-content: center;
      padding: 7px 10px;
      border-bottom: 2px solid var(--bios-gray);
      color: var(--bios-cyan);
    }

    .bios-menu button,
    .bios-row {
      font: inherit;
      border: 0;
      cursor: pointer;
    }

    .bios-menu button {
      color: var(--bios-cyan);
      background: transparent;
      padding: 2px 10px;
    }

    .bios-menu button[aria-selected="true"] {
      color: var(--bios-blue);
      background: var(--bios-gray);
    }

    .bios-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(230px, 0.38fr);
      min-height: 0;
    }

    .bios-panel {
      margin: 10px;
      border: 2px solid var(--bios-gray);
      min-height: 0;
    }

    .panel-title {
      display: inline-block;
      position: relative;
      top: -0.75em;
      left: 12px;
      padding: 0 8px;
      background: var(--bios-blue);
      color: var(--bios-gray);
    }

    .bios-list { margin-top: -0.35em; padding: 0 10px 12px; }

    .bios-row {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(170px, 1fr) minmax(140px, 0.55fr);
      gap: 18px;
      padding: 5px 8px;
      color: var(--bios-white);
      background: transparent;
      text-align: left;
    }

    .bios-row[aria-selected="true"] {
      color: var(--bios-blue);
      background: var(--bios-gray);
    }

    .value { color: inherit; text-align: right; }

    .bios-help-panel { color: var(--bios-gray); line-height: 1.45; }
    .bios-help-panel strong { color: var(--bios-cyan); font-weight: 400; }

    .bios-status {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px 22px;
      padding: 8px 10px;
      border-top: 2px solid var(--bios-gray);
      background: var(--bios-blue-dark);
      color: var(--bios-white);
    }

    .bios-status kbd,
    .touch-controls kbd { color: var(--bios-cyan); font: inherit; }
    .key-command, .dialog-command { font: inherit; color: inherit; background: transparent; border: 0; padding: 4px 6px; min-height: 32px; cursor: pointer; }
    .key-command:focus-visible, .dialog-command:focus-visible, .dialog-option:focus-visible, .touch-key:focus-visible { outline: 1px solid var(--bios-cyan); }
    .touch-controls { display: none; }
    .touch-title { color: var(--bios-gray); font-size: 0.76rem; text-align: center; margin-bottom: 6px; }
    .touch-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
    .touch-key {
      min-width: 48px;
      min-height: 44px;
      padding: 7px 10px;
      border: 1px solid var(--bios-gray);
      background: var(--bios-blue);
      color: var(--bios-white);
      font: inherit;
      cursor: pointer;
      box-shadow: 2px 2px 0 var(--bios-shadow);
    }

    .dialog-backdrop {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 40, 0.45);
      padding: 20px;
    }

    .dialog {
      width: min(520px, 100%);
      border: 3px double var(--bios-gray);
      background: var(--bios-blue);
      color: var(--bios-white);
      padding: 20px 22px;
      text-align: center;
      box-shadow: 12px 12px 0 var(--bios-shadow);
    }

    .dialog h2 { margin: 0 0 14px; color: var(--bios-cyan); font-size: 1.1rem; }
    .dialog-options { display: grid; gap: 6px; justify-content: center; margin: 16px 0; }
    .dialog-option { font: inherit; border: 0; background: transparent; cursor: pointer; min-width: 180px; padding: 8px 18px; color: var(--bios-white); text-align: center; }
    .dialog-option[aria-selected="true"] { background: var(--bios-gray); color: var(--bios-blue); }
    .editor-values { color: var(--bios-white); font-size: 1.2rem; margin: 18px 0; }
    .editor-values span { display: inline-block; padding: 2px 8px; }
    .editor-values .active { background: var(--bios-gray); color: var(--bios-blue); }
    .post-screen { background: #000; color: #c0c0c0; width: 100%; height: 100%; padding: 26px; line-height: 1.55; white-space: pre-line; }
    .post-screen strong { color: #fff; font-weight: 400; }
    .fade-black { background: #000; transition: background 500ms ease; }
    .dialog p { margin: 0 0 20px; line-height: 1.45; }
    .dialog-keys { margin-top: 18px; color: var(--bios-gray); }

    @media (max-width: 760px) {
      body { padding: 0; }
      .bios-screen { width: 100%; height: 100%; min-height: 100%; border-width: 2px; }
      .bios-main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      .bios-help-panel { display: none; }
      .bios-header { font-size: 0.82rem; }
      .bios-menu { justify-content: flex-start; overflow: hidden; font-size: 0.76rem; }
      .bios-row { grid-template-columns: 1fr; gap: 0; font-size: 0.84rem; }
      .value { text-align: left; color: var(--bios-cyan); }
      .bios-status { font-size: 0.74rem; gap: 5px 8px; }
      .bios-status .key-command { display: none; }
      .touch-controls { display: block; padding: 8px 8px 10px; border-top: 2px solid var(--bios-gray); background: var(--bios-blue-dark); }
      .touch-key { flex: 1 0 56px; max-width: 96px; }
      .dialog { max-height: calc(100vh - 24px); overflow: auto; box-shadow: 6px 6px 0 var(--bios-shadow); }
    }
  </style>
</head>
<body>
  <main id="biosApp" class="bios-screen" tabindex="0" role="application" aria-label="Computer Museum BIOS Setup Utility"></main>
  <script>
    const STORAGE_KEY = 'computerMuseumBIOS';
    const RETURN_URL = '/museum/bios-setup/';

    const hardware = {
      cpu: 'Museum 80486DX2-66', memory: '8192 KB', display: 'Museum VGA Compatible', hdd: 'MuseumDisk 512 MB', floppy: '1.44 MB 3.5 in', keyboard: '101-Key Enhanced', mouse: 'PS/2 Compatible'
    };
    const sensors = { cpuTempC: 38, systemTempC: 32, cpuFan: '2600 RPM', chassisFan: 'Not Installed', voltage: '+5 V / +12 V Nominal' };
    const boolChoices = [['Enabled', true], ['Disabled', false]];
    const bootChoices = ['Virtual HDD', 'Virtual Floppy', 'Virtual CD-ROM', 'Museum Network', 'Disabled'];

    const defaults = {
      systemDate: '1996-01-01', systemTime: '12:00:00', cpuCache: true, numLock: true, quickBoot: true, bootLogo: false,
      onboardIDE: 'Enabled', primaryIDE: 'Auto', secondaryIDE: 'Auto', serialPort: 'Auto', parallelPort: 'Auto', parallelMode: 'ECP', ps2Mouse: 'Enabled', usbLegacy: 'Enabled',
      powerManagement: 'User Define', videoOffMethod: 'DPMS Support', videoOffAfter: 'Standby', suspendMode: 'Disabled', hddPowerDown: 'Disabled', wakeKeyboard: 'Disabled', wakeModem: 'Disabled',
      pnpOS: 'No', resourcesControlled: 'Auto', resetConfigData: 'Disabled', pciIRQ: 'Auto', assignIRQVGA: 'Enabled', assignIRQUSB: 'Enabled', pciLatency: '64',
      bootOrder: ['Virtual HDD', 'Virtual Floppy', 'Virtual CD-ROM'], bootOther: 'Enabled', bootDelay: '2 sec', fullScreenLogo: 'Disabled', floppySeek: 'Disabled',
      temperatureUnit: 'Celsius', fanMonitoring: 'Enabled', cpuWarningTemp: '70 °C', cpuFanWarning: 'Enabled'
    };
    const defaultConfig = () => JSON.parse(JSON.stringify(defaults));

    const helpText = {
      'System Date':'Stores the fictional museum PC calendar in browser-local CMOS data. Press Enter to change the value.', 'System Time':'Stores the simulated real-time clock before an operating system loads. Press Enter to change the value.', 'CPU':'Read-only fictional 486-class CPU for this museum PC; comparable BIOS pages identified installed processors during POST.', 'Memory':'Read-only simulated memory report. Classic firmware displayed this value to confirm installed memory.', 'Virtual HDD':'Read-only browser-local disk description; no real disk or firmware is accessed.', 'Primary Floppy':'Read-only virtual floppy drive, historically important for installs and rescue disks.', 'Display Adapter':'Read-only VGA-compatible adapter for this fictional PC.', 'Keyboard':'Read-only enhanced keyboard report, the primary way users operated BIOS setup.', 'Mouse':'Read-only PS/2 mouse report for the fictional museum PC.',
      'CPU Internal Cache':'Turns simulated CPU cache on or off. Disabling cache was a troubleshooting option but severely reduced performance.', 'Quick Boot':'Shortens startup checks after hardware is trusted, a common convenience in 1990s BIOS utilities.', 'Boot Logo':'Shows or hides a startup logo; text POST was more useful for diagnostics and education.', 'NumLock Status':'Sets numeric keypad mode at boot, a common user preference.', 'Security Option':'Read-only museum setting showing how BIOS passwords could guard setup or boot; not modern security.', 'Typematic Rate':'Read-only keyboard repeat behavior left at safe firmware defaults.',
      'Onboard IDE Controller':'Enables the simulated onboard IDE interface used by 1990s hard disks and CD-ROM drives.', 'Primary IDE Channel':'Controls the primary virtual IDE channel; Auto reflects common late-1990s detection behavior.', 'Secondary IDE Channel':'Controls the secondary virtual IDE channel, often used for CD-ROM drives.', 'Serial Port':'Selects a legacy COM address for modems, mice, terminals or lab equipment.', 'Parallel Port':'Selects a legacy LPT printer address used before USB printing became common.', 'Parallel Port Mode':'SPP is basic printer mode; EPP/ECP added faster bidirectional transfers with compatibility trade-offs.', 'PS/2 Mouse Support':'Enables firmware support for the virtual PS/2 mouse port.', 'USB Legacy Support':'Late-1990s compatibility option translating USB keyboards for older software expecting PS/2 input.', 'Sound Device':'Read-only note that many PCs used separate expansion sound cards.',
      'Power Management':'Selects APM-style power saving. User Define was common when owners tuned each timeout.', 'Video Off Method':'Chooses how firmware blanks the display; DPMS needed monitor support but saved more power.', 'Video Off After':'Chooses which low-power phase turns video off.', 'Suspend Mode':'Sets a simulated suspend timeout; older PCs varied greatly in reliability.', 'HDD Power Down':'Spins down the virtual disk after inactivity, saving power with a possible wake delay.', 'Wake on Keyboard':'Allows keyboard activity to resume the fictional PC.', 'Wake on Modem Ring':'Lets a modem ring wake the system, historically useful for fax and remote access PCs.', 'Soft-Off Method':'Read-only ATX-era instant-off behavior in this museum configuration.',
      'PNP OS Installed':'Tells firmware whether the operating system is expected to manage Plug and Play resources.', 'Resources Controlled By':'Auto lets firmware assign IRQ/DMA resources; Manual recalls older hands-on configuration.', 'Reset Configuration Data':'Requests rebuilding stored ESCD expansion-card assignments on next boot.', 'PCI IRQ Assignment':'Chooses automatic or fixed PCI interrupt routing for compatibility demonstrations.', 'Assign IRQ for VGA':'Reserves an IRQ for PCI VGA cards that required one.', 'Assign IRQ for USB':'Reserves an IRQ for USB controllers, a transitional late-1990s compatibility concern.', 'PCI Latency Timer':'Controls how long a PCI device may hold the bus; larger values could help throughput but hurt sharing.',
      'First Boot Device':'First virtual device tried for booting. Active devices are kept unique to avoid confusing boot orders.', 'Second Boot Device':'Fallback virtual boot source if the first device does not boot.', 'Third Boot Device':'Final virtual boot fallback; Disabled is allowed more than once.', 'Boot Other Device':'Allows searching devices beyond the explicit boot list.', 'Boot Delay':'Adds a short pause so visitors can read POST messages or press setup keys.', 'Full Screen Boot Logo':'Controls a simulated full-screen logo instead of POST text.', 'Floppy Seek':'Simulates checking the floppy drive at boot, once familiar but noisy and slow.',
      'CPU Temperature':'Read-only simulated CPU temperature for the fictional museum PC; technicians used comparable readings to verify cooling.', 'System Temperature':'Read-only simulated case temperature used to reason about airflow.', 'CPU Fan Speed':'Read-only simulated tachometer speed for the CPU fan.', 'Chassis Fan':'Read-only informational fan entry; this fictional PC has no chassis fan sensor.', 'Voltage Monitor':'Read-only simulated power-rail summary; stable voltages were vital for reliability.', 'Temperature Unit':'Changes displayed sensor units without altering stored Celsius sensor values.', 'Fan Monitoring':'Enables or disables simulated fan-warning supervision.', 'CPU Warning Temperature':'Sets a warning threshold displayed in Celsius, as many BIOS health pages did.', 'CPU Fan Warning':'Enables a simulated fan-failure warning.'
    };

    let biosConfig = loadConfig();
    let savedConfig = JSON.parse(JSON.stringify(biosConfig));
    const appState = { currentMenu: 0, selectedRow: 0, dirty: false, dialog: null, dialogSelection: 0, editorPart: 0, draftValue: null, draftParts: null, rebooting: false };
    const app = document.getElementById('biosApp');

    const editable = {
      'System Date': { type: 'date', key: 'systemDate' }, 'System Time': { type: 'time', key: 'systemTime' }, 'CPU Internal Cache': { type: 'choice', key: 'cpuCache', choices: boolChoices }, 'Quick Boot': { type: 'choice', key: 'quickBoot', choices: boolChoices }, 'Boot Logo': { type: 'choice', key: 'bootLogo', choices: boolChoices }, 'NumLock Status': { type: 'choice', key: 'numLock', choices: [['On', true], ['Off', false]] },
      'Onboard IDE Controller': { type: 'choice', key: 'onboardIDE', choices: values('Enabled','Disabled') }, 'Primary IDE Channel': { type: 'choice', key: 'primaryIDE', choices: values('Auto','Enabled','Disabled') }, 'Secondary IDE Channel': { type: 'choice', key: 'secondaryIDE', choices: values('Auto','Enabled','Disabled') }, 'Serial Port': { type: 'choice', key: 'serialPort', choices: values('Auto','COM1 3F8','COM2 2F8','Disabled') }, 'Parallel Port': { type: 'choice', key: 'parallelPort', choices: values('Auto','LPT1 378','LPT2 278','Disabled') }, 'Parallel Port Mode': { type: 'choice', key: 'parallelMode', choices: values('SPP','EPP','ECP') }, 'PS/2 Mouse Support': { type: 'choice', key: 'ps2Mouse', choices: values('Enabled','Disabled') }, 'USB Legacy Support': { type: 'choice', key: 'usbLegacy', choices: values('Enabled','Disabled') },
      'Power Management': { type: 'choice', key: 'powerManagement', choices: values('Disabled','Min Saving','Max Saving','User Define') }, 'Video Off Method': { type: 'choice', key: 'videoOffMethod', choices: values('Blank Screen','V/H SYNC+Blank','DPMS Support') }, 'Video Off After': { type: 'choice', key: 'videoOffAfter', choices: values('Never','Doze','Standby','Suspend') }, 'Suspend Mode': { type: 'choice', key: 'suspendMode', choices: values('Disabled','1 Min','5 Min','10 Min','20 Min','30 Min') }, 'HDD Power Down': { type: 'choice', key: 'hddPowerDown', choices: values('Disabled','1 Min','5 Min','10 Min','15 Min') }, 'Wake on Keyboard': { type: 'choice', key: 'wakeKeyboard', choices: values('Enabled','Disabled') }, 'Wake on Modem Ring': { type: 'choice', key: 'wakeModem', choices: values('Enabled','Disabled') },
      'PNP OS Installed': { type: 'choice', key: 'pnpOS', choices: values('Yes','No') }, 'Resources Controlled By': { type: 'choice', key: 'resourcesControlled', choices: values('Auto','Manual') }, 'Reset Configuration Data': { type: 'choice', key: 'resetConfigData', choices: values('Disabled','Enabled') }, 'PCI IRQ Assignment': { type: 'choice', key: 'pciIRQ', choices: values('Auto','IRQ 5','IRQ 9','IRQ 10','IRQ 11') }, 'Assign IRQ for VGA': { type: 'choice', key: 'assignIRQVGA', choices: values('Enabled','Disabled') }, 'Assign IRQ for USB': { type: 'choice', key: 'assignIRQUSB', choices: values('Enabled','Disabled') }, 'PCI Latency Timer': { type: 'choice', key: 'pciLatency', choices: values('32','64','96','128') },
      'First Boot Device': { type: 'boot', index: 0, choices: values(...bootChoices) }, 'Second Boot Device': { type: 'boot', index: 1, choices: values(...bootChoices) }, 'Third Boot Device': { type: 'boot', index: 2, choices: values(...bootChoices) }, 'Boot Other Device': { type: 'choice', key: 'bootOther', choices: values('Enabled','Disabled') }, 'Boot Delay': { type: 'choice', key: 'bootDelay', choices: values('0 sec','1 sec','2 sec','3 sec','5 sec','10 sec') }, 'Full Screen Boot Logo': { type: 'choice', key: 'fullScreenLogo', choices: values('Enabled','Disabled') }, 'Floppy Seek': { type: 'choice', key: 'floppySeek', choices: values('Enabled','Disabled') },
      'Temperature Unit': { type: 'choice', key: 'temperatureUnit', choices: values('Celsius','Fahrenheit') }, 'Fan Monitoring': { type: 'choice', key: 'fanMonitoring', choices: values('Enabled','Disabled') }, 'CPU Warning Temperature': { type: 'choice', key: 'cpuWarningTemp', choices: values('Disabled','50 °C','60 °C','70 °C','80 °C') }, 'CPU Fan Warning': { type: 'choice', key: 'cpuFanWarning', choices: values('Enabled','Disabled') }
    };
    function values(...items) { return items.map(v => [v, v]); }
    function temp(c) { return biosConfig.temperatureUnit === 'Fahrenheit' ? `${Math.round(c * 9 / 5 + 32)} °F` : `${c} °C`; }
    function rows() { return [
      { id:'standard', label:'Standard CMOS Features', rows:[['System Date',biosConfig.systemDate],['System Time',biosConfig.systemTime],['CPU',hardware.cpu],['Memory',hardware.memory],['Virtual HDD',hardware.hdd],['Primary Floppy',hardware.floppy],['Display Adapter',hardware.display],['Keyboard',hardware.keyboard],['Mouse',hardware.mouse]]},
      { id:'advanced', label:'Advanced BIOS Features', rows:[['CPU Internal Cache',onoff(biosConfig.cpuCache)],['Quick Boot',onoff(biosConfig.quickBoot)],['Boot Logo',onoff(biosConfig.bootLogo)],['NumLock Status',biosConfig.numLock?'On':'Off'],['Security Option','Setup'],['Typematic Rate','Default']]},
      { id:'peripherals', label:'Integrated Peripherals', rows:[['Onboard IDE Controller',biosConfig.onboardIDE],['Primary IDE Channel',biosConfig.primaryIDE],['Secondary IDE Channel',biosConfig.secondaryIDE],['Serial Port',biosConfig.serialPort],['Parallel Port',biosConfig.parallelPort],['Parallel Port Mode',biosConfig.parallelMode],['PS/2 Mouse Support',biosConfig.ps2Mouse],['USB Legacy Support',biosConfig.usbLegacy],['Sound Device','Not Installed']]},
      { id:'power', label:'Power Management', rows:[['Power Management',biosConfig.powerManagement],['Video Off Method',biosConfig.videoOffMethod],['Video Off After',biosConfig.videoOffAfter],['Suspend Mode',biosConfig.suspendMode],['HDD Power Down',biosConfig.hddPowerDown],['Wake on Keyboard',biosConfig.wakeKeyboard],['Wake on Modem Ring',biosConfig.wakeModem],['Soft-Off Method','Instant-Off']]},
      { id:'pnp', label:'PnP / PCI Configuration', rows:[['PNP OS Installed',biosConfig.pnpOS],['Resources Controlled By',biosConfig.resourcesControlled],['Reset Configuration Data',biosConfig.resetConfigData],['PCI IRQ Assignment',biosConfig.pciIRQ],['Assign IRQ for VGA',biosConfig.assignIRQVGA],['Assign IRQ for USB',biosConfig.assignIRQUSB],['PCI Latency Timer',biosConfig.pciLatency]]},
      { id:'boot', label:'Boot Configuration', rows:[['First Boot Device',biosConfig.bootOrder[0]],['Second Boot Device',biosConfig.bootOrder[1]],['Third Boot Device',biosConfig.bootOrder[2]],['Boot Other Device',biosConfig.bootOther],['Boot Delay',biosConfig.bootDelay],['Full Screen Boot Logo',biosConfig.fullScreenLogo],['Floppy Seek',biosConfig.floppySeek]]},
      { id:'monitor', label:'Hardware Monitor', rows:[['CPU Temperature',temp(sensors.cpuTempC)],['System Temperature',temp(sensors.systemTempC)],['CPU Fan Speed',sensors.cpuFan],['Chassis Fan',sensors.chassisFan],['Voltage Monitor',sensors.voltage],['Temperature Unit',biosConfig.temperatureUnit],['Fan Monitoring',biosConfig.fanMonitoring],['CPU Warning Temperature',biosConfig.cpuWarningTemp],['CPU Fan Warning',biosConfig.cpuFanWarning]]}
    ]; }
    function onoff(v){return v?'Enabled':'Disabled'}
    function loadConfig(){let cfg=defaultConfig();try{const saved=localStorage.getItem(STORAGE_KEY); if(saved) cfg={...cfg,...JSON.parse(saved)};}catch(e){console.warn('Unable to load virtual CMOS configuration.',e)} return validateConfig(cfg)}
    function validateConfig(cfg){const d=defaultConfig(); const allowed={onboardIDE:['Enabled','Disabled'],primaryIDE:['Auto','Enabled','Disabled'],secondaryIDE:['Auto','Enabled','Disabled'],serialPort:['Auto','COM1 3F8','COM2 2F8','Disabled'],parallelPort:['Auto','LPT1 378','LPT2 278','Disabled'],parallelMode:['SPP','EPP','ECP'],ps2Mouse:['Enabled','Disabled'],usbLegacy:['Enabled','Disabled'],powerManagement:['Disabled','Min Saving','Max Saving','User Define'],videoOffMethod:['Blank Screen','V/H SYNC+Blank','DPMS Support'],videoOffAfter:['Never','Doze','Standby','Suspend'],suspendMode:['Disabled','1 Min','5 Min','10 Min','20 Min','30 Min'],hddPowerDown:['Disabled','1 Min','5 Min','10 Min','15 Min'],wakeKeyboard:['Enabled','Disabled'],wakeModem:['Enabled','Disabled'],pnpOS:['Yes','No'],resourcesControlled:['Auto','Manual'],resetConfigData:['Disabled','Enabled'],pciIRQ:['Auto','IRQ 5','IRQ 9','IRQ 10','IRQ 11'],assignIRQVGA:['Enabled','Disabled'],assignIRQUSB:['Enabled','Disabled'],pciLatency:['32','64','96','128'],bootOther:['Enabled','Disabled'],bootDelay:['0 sec','1 sec','2 sec','3 sec','5 sec','10 sec'],fullScreenLogo:['Enabled','Disabled'],floppySeek:['Enabled','Disabled'],temperatureUnit:['Celsius','Fahrenheit'],fanMonitoring:['Enabled','Disabled'],cpuWarningTemp:['Disabled','50 °C','60 °C','70 °C','80 °C'],cpuFanWarning:['Enabled','Disabled']}; Object.keys(allowed).forEach(k=>{if(!allowed[k].includes(cfg[k])) cfg[k]=d[k];}); ['cpuCache','numLock','quickBoot','bootLogo'].forEach(k=>{if(typeof cfg[k] !== 'boolean') cfg[k]=d[k];}); cfg.bootOrder=Array.isArray(cfg.bootOrder)?cfg.bootOrder.slice(0,3):d.bootOrder.slice(); while(cfg.bootOrder.length<3) cfg.bootOrder.push(d.bootOrder[cfg.bootOrder.length]); cfg.bootOrder=cfg.bootOrder.map((v,i)=>bootChoices.includes(v)?v:d.bootOrder[i]); return normalizeBootOrder(cfg);}
    function normalizeBootOrder(cfg=biosConfig){const seen=new Set(); cfg.bootOrder=cfg.bootOrder.map((v,i)=>{if(v==='Disabled')return v; if(seen.has(v)) return bootChoices.find(x=>x!=='Disabled'&&!seen.has(x)) || 'Disabled'; seen.add(v); return v;}); return cfg;}
    function saveConfig(){normalizeBootOrder(); localStorage.setItem(STORAGE_KEY,JSON.stringify(biosConfig)); savedConfig=JSON.parse(JSON.stringify(biosConfig)); appState.dirty=false; render();}
    function markDirty(){appState.dirty=JSON.stringify(biosConfig)!==JSON.stringify(savedConfig)}
    function menus(){return rows()} function clampRow(){appState.selectedRow=Math.max(0,Math.min(appState.selectedRow,menus()[appState.currentMenu].rows.length-1))} function setMenu(i){appState.currentMenu=(i+menus().length)%menus().length; appState.selectedRow=0; render()} function setRow(i){const r=menus()[appState.currentMenu].rows; appState.selectedRow=(i+r.length)%r.length; render()} function currentItem(){return menus()[appState.currentMenu].rows[appState.selectedRow][0]}
    function openExitDialog(){appState.dialog='exit';appState.dialogSelection=1;render()} function openSaveDialog(){appState.dialog='save';appState.dialogSelection=0;render()} function exitSetup(){window.location.href=RETURN_URL}
    function beginReboot(){appState.rebooting=true;appState.dialog=null;app.classList.add('fade-black');renderPost(['Saving CMOS...','Updating CMOS checksum...','Done.']);setTimeout(()=>renderPost([]),750);setTimeout(showPost,1050)}
    function showPost(){const postLines=[`<strong>Computer Museum BIOS</strong>`,'','Memory Test...','4096 KB OK',`${hardware.memory} OK`,`CPU detected  ${hardware.cpu}`,`Primary Master detected  ${hardware.hdd}`,'Primary Slave  None',`Floppy Drive  ${hardware.floppy}`,`Keyboard detected  ${hardware.keyboard}`,'','Press DEL to enter Setup','','Booting Virtual System...'];postLines.forEach((_,i)=>setTimeout(()=>renderPost(postLines.slice(0,i+1)),i*145));setTimeout(exitSetup,2600)} function renderPost(lines){app.innerHTML=`<section class="post-screen">${Array.isArray(lines)?lines.join('<br>'):lines}</section>`}
    function openEditor(){const item=currentItem(),ed=editable[item]; if(!ed) return; appState.dialog='editor'; appState.editorPart=0; appState.draftValue=ed.type==='boot'?biosConfig.bootOrder[ed.index]:biosConfig[ed.key]; appState.draftParts=null; if(ed.type==='date'||ed.type==='time') appState.draftParts=biosConfig[ed.key].split(ed.type==='date'?'-':':').map(Number); appState.dialogSelection=ed.choices?Math.max(0,ed.choices.findIndex(c=>c[1]===appState.draftValue)):0; render()}
    function adjustEditor(delta){const ed=editable[currentItem()]; if(!ed)return; if(ed.choices){appState.dialogSelection=(appState.dialogSelection+delta+ed.choices.length)%ed.choices.length; appState.draftValue=ed.choices[appState.dialogSelection][1];} else {const max=ed.type==='date'?[2099,12,31]:[23,59,59], min=ed.type==='date'?[1980,1,1]:[0,0,0]; let p=appState.draftParts; p[appState.editorPart]+=delta; if(p[appState.editorPart]>max[appState.editorPart])p[appState.editorPart]=min[appState.editorPart]; if(p[appState.editorPart]<min[appState.editorPart])p[appState.editorPart]=max[appState.editorPart];} render()}
    function acceptEditor(){const item=currentItem(),ed=editable[item]; if(!ed)return; let next=appState.draftValue; if(ed.type==='date'||ed.type==='time') next=appState.draftParts.map((n,i)=>String(n).padStart(i===0&&ed.type==='date'?4:2,'0')).join(ed.type==='date'?'-':':'); if(ed.type==='boot'){setBootDevice(ed.index,next)} else biosConfig[ed.key]=next; appState.dialog=null; markDirty(); render()}
    function setBootDevice(index,value){const old=biosConfig.bootOrder[index]; if(value!=='Disabled'){const dup=biosConfig.bootOrder.findIndex((v,i)=>i!==index&&v===value); if(dup>=0) biosConfig.bootOrder[dup]=old==='Disabled'?bootChoices.find(v=>v!=='Disabled'&&!biosConfig.bootOrder.includes(v))||'Disabled':old;} biosConfig.bootOrder[index]=value; normalizeBootOrder();}
    function directCycle(delta){const item=currentItem(),ed=editable[item]; if(!ed||ed.type==='date'||ed.type==='time')return; const cur=ed.type==='boot'?biosConfig.bootOrder[ed.index]:biosConfig[ed.key]; const i=Math.max(0,ed.choices.findIndex(c=>c[1]===cur)); const val=ed.choices[(i+delta+ed.choices.length)%ed.choices.length][1]; if(ed.type==='boot')setBootDevice(ed.index,val); else biosConfig[ed.key]=val; markDirty(); render();}
    function cancelDialog(){appState.dialog=null; render()}
    function chooseDialog(i){appState.dialogSelection=i; if(appState.dialog==='editor'){appState.draftValue=editable[currentItem()].choices[i][1]; render();}}
    function dialogAccept(){if(appState.dialog==='save'){if(appState.dialogSelection===0){saveConfig();beginReboot();}else cancelDialog()} else if(appState.dialog==='exit'){if(appState.dialogSelection===0){biosConfig=JSON.parse(JSON.stringify(savedConfig)); appState.dirty=false; exitSetup();}else cancelDialog()} else acceptEditor()}
    function dialogHtml(){if(!appState.dialog)return''; if(appState.dialog==='exit'||appState.dialog==='save'){const title=appState.dialog==='exit'?'Exit Setup?':'Save configuration?'; const msg=appState.dialog==='exit'?(appState.dirty?'Discard unsaved configuration changes?':'Return to Computer Museum BIOS page?'):'Save browser-local virtual CMOS and reboot the exhibit?'; return `<div class="dialog-backdrop"><section class="dialog" role="dialog" aria-modal="true"><h2>${title}</h2><p>${msg}</p><div class="dialog-options"><button type="button" class="dialog-option" data-dialog-choice="0" aria-selected="${appState.dialogSelection===0}">Yes</button><button type="button" class="dialog-option" data-dialog-choice="1" aria-selected="${appState.dialogSelection===1}">No</button></div><p class="dialog-keys"><button class="dialog-command" data-action="enter">Enter Accept</button> <button class="dialog-command" data-action="esc">Esc Cancel</button></p></section></div>`} const item=currentItem(),ed=editable[item]; let body=''; if(ed.choices) body=`<div class="dialog-options">${ed.choices.map((c,i)=>`<button type="button" class="dialog-option" data-dialog-choice="${i}" aria-selected="${appState.dialogSelection===i}">${c[0]}</button>`).join('')}</div>`; else {const sep=ed.type==='date'?' / ':' : '; body=`<div class="editor-values">${appState.draftParts.map((v,i)=>`<span class="${appState.editorPart===i?'active':''}">${ed.type==='date'&&i===0?String(v).slice(2):String(v).padStart(2,'0')}</span>`).join(sep)}</div>`} return `<div class="dialog-backdrop"><section class="dialog" role="dialog" aria-modal="true"><h2>${item}</h2>${body}<p class="dialog-keys"><button class="dialog-command" data-action="left">← Previous Field</button> <button class="dialog-command" data-action="right">→ Next Field</button><br><button class="dialog-command" data-action="pgup">PgUp Previous Value</button> <button class="dialog-command" data-action="pgdn">PgDn Next Value</button><br><button class="dialog-command" data-action="enter">Enter Accept</button> <button class="dialog-command" data-action="esc">Esc Cancel</button></p></section></div>`}
    function render(){if(appState.rebooting)return;clampRow();const menu=menus()[appState.currentMenu],item=menu.rows[appState.selectedRow][0];app.innerHTML=`<header class="bios-header"><div class="bios-title">Computer Museum BIOS Setup Utility</div><div>Version 1.0</div><div>Browser-local educational simulation</div></header><nav class="bios-menu" role="tablist" aria-label="BIOS setup menus">${menus().map((m,i)=>`<button type="button" role="tab" aria-selected="${i===appState.currentMenu}" data-menu="${i}">${m.label}</button>`).join('')}</nav><section class="bios-main"><div class="bios-panel" role="listbox" aria-label="${menu.label} settings"><span class="panel-title">${menu.label}</span><div class="bios-list">${menu.rows.map((row,i)=>`<button type="button" class="bios-row ${editable[row[0]]?'editable':'read-only'}" role="option" aria-selected="${i===appState.selectedRow}" data-row="${i}" aria-label="${row[0]} ${editable[row[0]]?'editable':'read only'} ${row[1]}"><span>${row[0]}</span><span class="value">${row[1]}</span></button>`).join('')}</div></div><aside class="bios-panel bios-help-panel" aria-label="Context help"><span class="panel-title">Item Help</span><div class="bios-list"><strong>${item}</strong><br><br>${helpText[item]}</div></aside></section><footer class="bios-status">${[['up','↑↓','Select Item'],['left','←→','Change Menu'],['enter','Enter','Edit'],['esc','Esc','Exit'],['f10','F10','Save & Exit']].map(k=>`<button type="button" class="key-command" data-action="${k[0]}" aria-label="${k[2]}"><kbd>${k[1]}</kbd> ${k[2]}</button>`).join('')}${appState.dirty?'<span>Changes Not Saved</span>':'<span>Configuration Saved</span>'}</footer><section class="touch-controls" aria-label="Touch Controls"><div class="touch-title">Touch Controls</div><div class="touch-grid">${[['up','↑','Select previous item'],['down','↓','Select next item'],['left','←','Previous menu'],['right','→','Next menu'],['enter','Enter','Edit selected item'],['esc','Esc','Exit setup'],['f10','F10','Save and exit'],['pgup','PgUp','Previous value'],['pgdn','PgDn','Next value'],['home','Home','First row'],['end','End','Last row']].map(k=>`<button type="button" class="touch-key" data-action="${k[0]}" aria-label="${k[2]}"><kbd>${k[1]}</kbd></button>`).join('')}</div></section>${dialogHtml()}`;bindPointerHandlers();app.focus({preventScroll:true})}
    function perform(action){if(appState.dialog){if(action==='esc')return cancelDialog(); if(action==='enter')return dialogAccept(); if(action==='left'){appState.editorPart=Math.max(0,appState.editorPart-1);return render()} if(action==='right'){appState.editorPart=Math.min(2,appState.editorPart+1);return render()} if(action==='pgup'||action==='up')return adjustEditor(1); if(action==='pgdn'||action==='down')return adjustEditor(-1); return} if(action==='up')setRow(appState.selectedRow-1); else if(action==='down')setRow(appState.selectedRow+1); else if(action==='left')setMenu(appState.currentMenu-1); else if(action==='right')setMenu(appState.currentMenu+1); else if(action==='home')setRow(0); else if(action==='end')setRow(menus()[appState.currentMenu].rows.length-1); else if(action==='enter')openEditor(); else if(action==='esc')openExitDialog(); else if(action==='f10')openSaveDialog(); else if(action==='pgup')directCycle(-1); else if(action==='pgdn')directCycle(1)}
    function bindPointerHandlers(){document.querySelectorAll('[data-menu]').forEach(b=>b.addEventListener('click',()=>setMenu(Number(b.dataset.menu))));document.querySelectorAll('[data-row]').forEach(b=>b.addEventListener('click',()=>{appState.selectedRow=Number(b.dataset.row); editable[currentItem()]?openEditor():render()}));document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();perform(b.dataset.action)}));document.querySelectorAll('[data-dialog-choice]').forEach(b=>b.addEventListener('click',()=>chooseDialog(Number(b.dataset.dialogChoice))))}
    document.addEventListener('keydown',e=>{const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Enter:'enter',Escape:'esc',Home:'home',End:'end',PageUp:'pgup',PageDown:'pgdn',F10:'f10'};let a=map[e.key]; if(!a&&e.key.toLowerCase()==='y'){appState.dialogSelection=0;a='enter'} if(!a&&e.key.toLowerCase()==='n')a='esc'; if(!a&&e.key==='Tab')a=e.shiftKey?'up':'down'; if(!a)return; e.preventDefault(); perform(a)});
    render();
</script>
</body>
