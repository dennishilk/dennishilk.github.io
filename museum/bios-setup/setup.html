<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Computer Museum BIOS Setup Utility</title>
  <meta name="description" content="Interactive educational BIOS Setup Utility shell for the Computer Museum.">
  <style>
    :root {
      --bios-blue: #000080;
      --bios-blue-dark: #000050;
      --bios-gray: #d8d8d8;
      --bios-white: #ffffff;
      --bios-cyan: #00ffff;
      --bios-shadow: #404040;
      --bios-black: #000000;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bios-blue);
      color: var(--bios-white);
      font-family: "Lucida Console", "Courier New", monospace;
    }

    body {
      display: grid;
      place-items: center;
      padding: clamp(8px, 2vw, 18px);
    }

    .bios-screen {
      width: min(1180px, 100%);
      height: min(760px, 100%);
      min-height: 520px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      border: 3px double var(--bios-gray);
      background: var(--bios-blue);
      box-shadow: 0 0 0 2px var(--bios-blue-dark), 0 0 36px rgba(0, 0, 0, 0.45);
      outline: 2px solid transparent;
    }

    .bios-screen:focus { outline-color: var(--bios-cyan); }

    .bios-header {
      text-align: center;
      line-height: 1.35;
      padding: 14px 12px 10px;
      border-bottom: 2px solid var(--bios-gray);
      color: var(--bios-gray);
    }

    .bios-title { color: var(--bios-white); font-weight: 700; }

    .bios-menu {
      display: flex;
      flex-wrap: wrap;
      gap: 0 6px;
      justify-content: center;
      padding: 8px;
      border-bottom: 2px solid var(--bios-gray);
      color: var(--bios-cyan);
    }

    .bios-menu button,
    .bios-row,
    .dialog-actions button {
      font: inherit;
      border: 0;
      cursor: pointer;
    }

    .bios-menu button {
      color: var(--bios-cyan);
      background: transparent;
      padding: 2px 8px;
    }

    .bios-menu button[aria-selected="true"] {
      color: var(--bios-blue);
      background: var(--bios-gray);
    }

    .bios-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(230px, 0.38fr);
      min-height: 0;
    }

    .bios-panel {
      margin: 12px;
      border: 2px solid var(--bios-gray);
      min-height: 0;
    }

    .panel-title {
      display: inline-block;
      position: relative;
      top: -0.75em;
      left: 12px;
      padding: 0 8px;
      background: var(--bios-blue);
      color: var(--bios-gray);
    }

    .bios-list { margin-top: -0.35em; padding: 0 10px 12px; }

    .bios-row {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(150px, 1fr) minmax(120px, 0.55fr);
      gap: 18px;
      padding: 4px 8px;
      color: var(--bios-white);
      background: transparent;
      text-align: left;
    }

    .bios-row[aria-selected="true"] {
      color: var(--bios-blue);
      background: var(--bios-gray);
    }

    .value { color: inherit; text-align: right; }

    .bios-help-panel { color: var(--bios-gray); line-height: 1.45; }
    .bios-help-panel strong { color: var(--bios-cyan); font-weight: 400; }

    .bios-status {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 24px;
      padding: 8px 10px;
      border-top: 2px solid var(--bios-gray);
      background: var(--bios-blue-dark);
      color: var(--bios-white);
    }

    .bios-status kbd { color: var(--bios-cyan); font: inherit; }

    .dialog-backdrop {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 40, 0.45);
      padding: 20px;
    }

    .dialog {
      width: min(520px, 100%);
      border: 3px double var(--bios-gray);
      background: var(--bios-blue);
      color: var(--bios-white);
      padding: 22px;
      text-align: center;
      box-shadow: 12px 12px 0 var(--bios-shadow);
    }

    .dialog h2 { margin: 0 0 14px; color: var(--bios-cyan); font-size: 1.1rem; }
    .dialog p { margin: 0 0 22px; }
    .dialog-actions { display: flex; justify-content: center; gap: 18px; }
    .dialog-actions button { min-width: 90px; padding: 5px 16px; background: var(--bios-gray); color: var(--bios-blue); }
    .dialog-actions button:focus { outline: 2px solid var(--bios-cyan); outline-offset: 2px; }

    @media (max-width: 760px) {
      body { padding: 0; }
      .bios-screen { width: 100%; height: 100%; min-height: 100%; border-width: 2px; }
      .bios-main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      .bios-help-panel { display: none; }
      .bios-header { font-size: 0.82rem; }
      .bios-menu { justify-content: flex-start; overflow: hidden; font-size: 0.76rem; }
      .bios-row { grid-template-columns: 1fr; gap: 0; font-size: 0.84rem; }
      .value { text-align: left; color: var(--bios-cyan); }
      .bios-status { font-size: 0.74rem; gap: 5px 12px; }
    }
  </style>
</head>
<body>
  <main id="biosApp" class="bios-screen" tabindex="0" role="application" aria-label="Computer Museum BIOS Setup Utility"></main>
  <script>
    const STORAGE_KEY = 'computerMuseumBIOS';
    const RETURN_URL = '/museum/bios-setup/';

    const menuDefinitions = [
      { id: 'standard', label: 'Standard CMOS Features', rows: [
        ['System Date', '2026-07-15'], ['System Time', '12:00:00'], ['Virtual Memory', '640 KB Base / 64 MB Extended'], ['Virtual HDD', 'MuseumDisk 512 MB'], ['Floppy Drive', '1.44 MB 3½'], ['Display Adapter', 'VGA Compatible'], ['Keyboard', '101-Key Enhanced'], ['Mouse Support', 'Enabled']
      ]},
      { id: 'advanced', label: 'Advanced BIOS Features', rows: [['CPU Internal Cache', 'Enabled'], ['Quick Boot', 'Enabled'], ['Boot Logo', 'Disabled'], ['NumLock Status', 'On'], ['Security Option', 'Setup'], ['Typematic Rate', 'Default']] },
      { id: 'peripherals', label: 'Integrated Peripherals', rows: [['Serial Port A', 'Virtual COM1'], ['Parallel Port', 'Virtual LPT1'], ['IDE Controller', 'Enabled'], ['USB Legacy Mode', 'Educational Placeholder'], ['Sound Device', 'Not Installed']] },
      { id: 'power', label: 'Power Management', rows: [['Power Management', 'User Define'], ['Suspend Mode', 'Disabled'], ['HDD Power Down', 'Disabled'], ['Wake on Keyboard', 'Disabled'], ['Soft-Off Method', 'Instant-Off']] },
      { id: 'pnp', label: 'PnP / PCI Configuration', rows: [['PNP OS Installed', 'No'], ['Reset Configuration Data', 'Disabled'], ['IRQ Resources', 'Auto'], ['PCI VGA Palette Snoop', 'Disabled']] },
      { id: 'boot', label: 'Boot Configuration', rows: [['First Boot Device', 'Virtual HDD'], ['Second Boot Device', 'Virtual Floppy'], ['Third Boot Device', 'Museum Network'], ['Boot Other Device', 'Enabled'], ['Boot Delay', '0 seconds']] },
      { id: 'monitor', label: 'Hardware Monitor', rows: [['CPU Temperature', '36 °C'], ['System Temperature', '31 °C'], ['CPU Fan Speed', '2400 RPM'], ['Chassis Fan', 'Not Installed'], ['Voltage Monitor', 'Nominal']] }
    ];

    const defaultConfig = () => ({
      systemDate: '2026-07-15', systemTime: '12:00:00', bootOrder: ['Virtual HDD', 'Virtual Floppy', 'Museum Network'], cpuCache: true, numLock: true, quickBoot: true, bootLogo: false, virtualMemory: '64 MB', virtualDisk: 'MuseumDisk 512 MB', fanMonitor: true, temperatureUnit: 'Celsius', language: 'English'
    });

    let biosConfig = loadConfig();
    const appState = { currentMenu: 0, selectedRow: 0, editing: false, dirty: false, showDialog: false };
    const app = document.getElementById('biosApp');

    function loadConfig() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return { ...defaultConfig(), ...JSON.parse(saved) };
      } catch (error) {
        console.warn('Unable to load virtual CMOS configuration, restoring defaults.', error);
      }
      const defaults = defaultConfig();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(defaults));
      return defaults;
    }

    function saveConfig() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(biosConfig));
      appState.dirty = false;
    }

    function clampRow() {
      const max = menuDefinitions[appState.currentMenu].rows.length - 1;
      appState.selectedRow = Math.max(0, Math.min(appState.selectedRow, max));
    }

    function setMenu(index) {
      appState.currentMenu = (index + menuDefinitions.length) % menuDefinitions.length;
      appState.selectedRow = 0;
      render();
    }

    function setRow(index) {
      const rows = menuDefinitions[appState.currentMenu].rows;
      appState.selectedRow = (index + rows.length) % rows.length;
      render();
    }

    function openExitDialog() { appState.showDialog = true; render(); }
    function closeExitDialog() { appState.showDialog = false; render(); }
    function exitSetup() { window.location.href = RETURN_URL; }

    function render() {
      clampRow();
      const menu = menuDefinitions[appState.currentMenu];
      app.innerHTML = `
        <header class="bios-header">
          <div class="bios-title">Computer Museum BIOS Setup Utility</div>
          <div>Educational BIOS Environment</div>
          <div>Version 1.0</div>
          <div>Copyright (C) Dennis Hilk</div>
        </header>
        <nav class="bios-menu" role="tablist" aria-label="BIOS setup menus">
          ${menuDefinitions.map((item, index) => `<button type="button" role="tab" aria-selected="${index === appState.currentMenu}" data-menu="${index}">${item.label}</button>`).join('')}
        </nav>
        <section class="bios-main">
          <div class="bios-panel" role="listbox" aria-label="${menu.label} settings">
            <span class="panel-title">${menu.label}</span>
            <div class="bios-list">
              ${menu.rows.map((row, index) => `<button type="button" class="bios-row" role="option" aria-selected="${index === appState.selectedRow}" data-row="${index}"><span>${row[0]}</span><span class="value">${row[1]}</span></button>`).join('')}
            </div>
          </div>
          <aside class="bios-panel bios-help-panel" aria-label="Context help">
            <span class="panel-title">Item Help</span>
            <div class="bios-list"><strong>${menu.rows[appState.selectedRow][0]}</strong><br><br>This placeholder entry belongs to the virtual CMOS setup framework. Later museum phases can attach editors, validation, hardware profiles and help text here.</div>
          </aside>
        </section>
        <footer class="bios-status" aria-label="Keyboard help">
          <span><kbd>↑↓</kbd> Select Item</span><span><kbd>←→</kbd> Change Menu</span><span><kbd>Enter</kbd> Open</span><span><kbd>Esc</kbd> Exit</span><span><kbd>F10</kbd> Save</span>
        </footer>
        ${appState.showDialog ? `<div class="dialog-backdrop" role="presentation"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="exitTitle"><h2 id="exitTitle">Exit Setup?</h2><p>Return to Computer Museum BIOS page?</p><div class="dialog-actions"><button type="button" data-dialog="yes">Yes</button><button type="button" data-dialog="no">No</button></div></section></div>` : ''}`;
      bindPointerHandlers();
      app.focus({ preventScroll: true });
      if (appState.showDialog) document.querySelector('[data-dialog="yes"]').focus({ preventScroll: true });
    }

    function bindPointerHandlers() {
      document.querySelectorAll('[data-menu]').forEach(button => button.addEventListener('click', () => setMenu(Number(button.dataset.menu))));
      document.querySelectorAll('[data-row]').forEach(button => button.addEventListener('click', () => setRow(Number(button.dataset.row))));
      document.querySelector('[data-dialog="yes"]')?.addEventListener('click', exitSetup);
      document.querySelector('[data-dialog="no"]')?.addEventListener('click', closeExitDialog);
    }

    document.addEventListener('keydown', event => {
      const handledKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', 'Escape', 'Home', 'End', 'PageUp', 'PageDown', 'Tab', 'F10', 'y', 'Y', 'n', 'N'];
      if (!handledKeys.includes(event.key)) return;
      event.preventDefault();

      if (appState.showDialog) {
        if (event.key === 'Escape' || event.key.toLowerCase() === 'n' || (event.key === 'Enter' && document.activeElement?.dataset.dialog === 'no')) closeExitDialog();
        else if (event.key === 'Enter' || event.key.toLowerCase() === 'y') exitSetup();
        else if (event.key === 'Tab' || event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
          const next = document.activeElement?.dataset.dialog === 'yes' ? 'no' : 'yes';
          document.querySelector(`[data-dialog="${next}"]`).focus({ preventScroll: true });
        }
        return;
      }

      if (event.key === 'ArrowUp' || (event.key === 'Tab' && event.shiftKey)) setRow(appState.selectedRow - 1);
      else if (event.key === 'ArrowDown' || event.key === 'Tab') setRow(appState.selectedRow + 1);
      else if (event.key === 'ArrowLeft' || event.key === 'PageUp') setMenu(appState.currentMenu - 1);
      else if (event.key === 'ArrowRight' || event.key === 'PageDown') setMenu(appState.currentMenu + 1);
      else if (event.key === 'Home') setRow(0);
      else if (event.key === 'End') setRow(menuDefinitions[appState.currentMenu].rows.length - 1);
      else if (event.key === 'Escape') openExitDialog();
      else if (event.key === 'F10') { saveConfig(); render(); }
      else if (event.key === 'Enter') { appState.editing = false; render(); }
    });

    render();
  </script>
</body>
</html>
