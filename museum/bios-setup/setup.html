<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Computer Museum BIOS Setup Utility</title>
  <meta name="description" content="Interactive educational BIOS Setup Utility shell for the Computer Museum.">
  <style>
    :root {
      --bios-blue: #000080;
      --bios-blue-dark: #000050;
      --bios-gray: #d8d8d8;
      --bios-white: #ffffff;
      --bios-cyan: #00ffff;
      --bios-shadow: #404040;
      --bios-black: #000000;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bios-blue);
      color: var(--bios-white);
      font-family: "Lucida Console", "Courier New", monospace;
    }

    body {
      display: grid;
      place-items: center;
      padding: clamp(2px, 0.8vw, 8px);
    }

    .bios-screen {
      width: min(1480px, calc(100vw - 8px));
      height: min(940px, calc(100vh - 8px));
      min-height: min(620px, 100vh);
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      border: 3px double var(--bios-gray);
      background: var(--bios-blue);
      box-shadow: 0 0 0 2px var(--bios-blue-dark), 0 0 36px rgba(0, 0, 0, 0.45);
      outline: 2px solid transparent;
    }

    .bios-screen:focus { outline-color: var(--bios-cyan); }

    .bios-header {
      text-align: center;
      line-height: 1.35;
      padding: 10px 12px 8px;
      border-bottom: 2px solid var(--bios-gray);
      color: var(--bios-gray);
    }

    .bios-title { color: var(--bios-white); font-weight: 700; }

    .bios-menu {
      display: flex;
      flex-wrap: wrap;
      gap: 0 12px;
      justify-content: center;
      padding: 7px 10px;
      border-bottom: 2px solid var(--bios-gray);
      color: var(--bios-cyan);
    }

    .bios-menu button,
    .bios-row {
      font: inherit;
      border: 0;
      cursor: pointer;
    }

    .bios-menu button {
      color: var(--bios-cyan);
      background: transparent;
      padding: 2px 10px;
    }

    .bios-menu button[aria-selected="true"] {
      color: var(--bios-blue);
      background: var(--bios-gray);
    }

    .bios-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(230px, 0.38fr);
      min-height: 0;
    }

    .bios-panel {
      margin: 10px;
      border: 2px solid var(--bios-gray);
      min-height: 0;
    }

    .panel-title {
      display: inline-block;
      position: relative;
      top: -0.75em;
      left: 12px;
      padding: 0 8px;
      background: var(--bios-blue);
      color: var(--bios-gray);
    }

    .bios-list { margin-top: -0.35em; padding: 0 10px 12px; }

    .bios-row {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(170px, 1fr) minmax(140px, 0.55fr);
      gap: 18px;
      padding: 5px 8px;
      color: var(--bios-white);
      background: transparent;
      text-align: left;
    }

    .bios-row[aria-selected="true"] {
      color: var(--bios-blue);
      background: var(--bios-gray);
    }

    .value { color: inherit; text-align: right; }

    .bios-help-panel { color: var(--bios-gray); line-height: 1.45; }
    .bios-help-panel strong { color: var(--bios-cyan); font-weight: 400; }

    .bios-status {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 24px;
      padding: 8px 10px;
      border-top: 2px solid var(--bios-gray);
      background: var(--bios-blue-dark);
      color: var(--bios-white);
    }

    .bios-status kbd { color: var(--bios-cyan); font: inherit; }

    .dialog-backdrop {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 40, 0.45);
      padding: 20px;
    }

    .dialog {
      width: min(520px, 100%);
      border: 3px double var(--bios-gray);
      background: var(--bios-blue);
      color: var(--bios-white);
      padding: 20px 22px;
      text-align: center;
      box-shadow: 12px 12px 0 var(--bios-shadow);
    }

    .dialog h2 { margin: 0 0 14px; color: var(--bios-cyan); font-size: 1.1rem; }
    .dialog-options { display: grid; gap: 6px; justify-content: center; margin: 16px 0; }
    .dialog-option { min-width: 180px; padding: 5px 18px; color: var(--bios-white); text-align: center; }
    .dialog-option[aria-selected="true"] { background: var(--bios-gray); color: var(--bios-blue); }
    .editor-values { color: var(--bios-white); font-size: 1.2rem; margin: 18px 0; }
    .editor-values span { display: inline-block; padding: 2px 8px; }
    .editor-values .active { background: var(--bios-gray); color: var(--bios-blue); }
    .post-screen { background: #000; color: #c0c0c0; width: 100%; height: 100%; padding: 26px; line-height: 1.55; white-space: pre-line; }
    .post-screen strong { color: #fff; font-weight: 400; }
    .fade-black { background: #000; transition: background 500ms ease; }
    .dialog p { margin: 0 0 20px; line-height: 1.45; }
    .dialog-keys { margin-top: 18px; color: var(--bios-gray); }

    @media (max-width: 760px) {
      body { padding: 0; }
      .bios-screen { width: 100%; height: 100%; min-height: 100%; border-width: 2px; }
      .bios-main { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
      .bios-help-panel { display: none; }
      .bios-header { font-size: 0.82rem; }
      .bios-menu { justify-content: flex-start; overflow: hidden; font-size: 0.76rem; }
      .bios-row { grid-template-columns: 1fr; gap: 0; font-size: 0.84rem; }
      .value { text-align: left; color: var(--bios-cyan); }
      .bios-status { font-size: 0.74rem; gap: 5px 12px; }
    }
  </style>
</head>
<body>
  <main id="biosApp" class="bios-screen" tabindex="0" role="application" aria-label="Computer Museum BIOS Setup Utility"></main>
  <script>
    const STORAGE_KEY = 'computerMuseumBIOS';
    const RETURN_URL = '/museum/bios-setup/';

    const hardware = {
      cpu: 'Museum 80486DX2-66', memory: '8192 KB', display: 'Museum VGA Compatible', hdd: 'MuseumDisk 512 MB', floppy: '1.44 MB 3.5 in', keyboard: '101-Key Enhanced', mouse: 'PS/2 Compatible'
    };

    const helpText = {
      'System Date': 'Stores the calendar date once kept by a small battery-backed CMOS clock. Setup utilities let owners correct the date after battery replacement.',
      'System Time': 'Stores the real-time clock value used before the operating system loads. Accurate time helped file timestamps and scheduled tasks.',
      'CPU': 'A fictional Computer Museum processor representing the 486 era, when clock-doubled CPUs made desktop PCs feel dramatically faster.',
      'Memory': 'Shows conventional and extended memory reported by setup. Memory tests were a familiar part of starting a PC in the 1980s and 1990s.',
      'Virtual HDD': 'This educational simulation stores a virtual hard disk configuration entirely inside your browser, not on real hardware.',
      'Primary Floppy': 'During the 1980s and 1990s floppy drives were commonly used to install operating systems and transfer software.',
      'Display Adapter': 'VGA compatibility became a common baseline for DOS and early graphical software, replacing many older display standards.',
      'Keyboard': 'The 101-key enhanced keyboard layout added dedicated cursor and function-key areas that became standard on PCs.',
      'Mouse': 'PS/2 mouse ports were common on PCs before USB became the usual way to connect pointing devices.',
      'CPU Internal Cache': 'Enables or disables the processor internal cache. Disabling cache was sometimes useful when troubleshooting unstable hardware but greatly reduced performance.',
      'Quick Boot': 'Skips or shortens some startup checks. Many BIOS utilities offered this after users trusted their hardware.',
      'Boot Logo': 'Controls whether a startup logo hides technical POST messages. Mid-1990s PCs increasingly used logos, but text POST remained useful for learning and troubleshooting.',
      'NumLock Status': 'Selects whether the numeric keypad starts in number-entry mode, a small but common preference in classic setup screens.',
      'Security Option': 'Selected whether a BIOS password protected Setup only or every boot. Offices and classrooms used this to discourage casual changes, though it was not strong modern security.',
      'Typematic Rate': 'Controlled how quickly held keys repeated. DOS programs and early setup utilities often relied on firmware defaults before operating systems took over keyboard behavior.',
      'Serial Port A': 'COM ports connected modems, mice, terminals and lab equipment before USB simplified peripheral connections.',
      'Parallel Port': 'LPT ports were widely used for printers and sometimes scanners, external drives and copy-protection dongles.',
      'IDE Controller': 'Enabled the onboard IDE disk interface used by many 1990s hard drives and CD-ROM drives. Integrating the controller reduced expansion-card complexity.',
      'USB Legacy Mode': 'Later BIOS software could translate USB keyboards for older operating systems that expected PS/2-style input.',
      'Sound Device': 'Many early PCs had no built-in advanced sound; expansion cards made games and multimedia more expressive.',
      'Power Management': 'APM-era settings let firmware dim displays, slow devices, or suspend parts of the PC to save electricity before modern ACPI became common.',
      'Suspend Mode': 'Attempted to place the PC in a low-power state while preserving work. In the mid-1990s this depended heavily on compatible hardware, drivers, and operating systems.',
      'HDD Power Down': 'Spinning down hard disks saved power and noise, though repeated spin-up cycles could be inconvenient.',
      'Wake on Keyboard': 'Some systems could resume from low-power states using keyboard activity rather than the front power button.',
      'Soft-Off Method': 'ATX-era PCs allowed software-controlled power-off, unlike earlier machines with purely mechanical switches.',
      'PNP OS Installed': 'Plug and Play shifted resource assignment between firmware and operating system during a transitional PC era.',
      'Reset Configuration Data': 'Clearing ESCD data forced the BIOS to rebuild resource assignments for expansion cards.',
      'IRQ Resources': 'IRQ lines signaled hardware events. Avoiding conflicts was once an important PC configuration skill.',
      'PCI VGA Palette Snoop': 'A compatibility option for unusual video and MPEG hardware that needed to observe VGA palette writes.',
      'First Boot Device': 'Determines the first device the computer tries when starting an operating system.',
      'Second Boot Device': 'Provides a fallback boot source if the first device is not bootable.',
      'Third Boot Device': 'A final fallback in the boot order, useful for removable or network-style startup experiments.',
      'Boot Other Device': 'Allows the firmware to continue searching beyond the listed devices.',
      'Boot Delay': 'Adds a short pause before booting so users can read POST messages or press setup keys.',
      'CPU Temperature': 'Hardware monitor pages became common as faster processors made heat and cooling more important.',
      'System Temperature': 'Case temperature gives a broad view of airflow inside the computer enclosure.',
      'CPU Fan Speed': 'Fan tachometer readings helped diagnose cooling failures before they damaged components.',
      'Chassis Fan': 'Many older systems had few monitored fans; later PCs exposed more health information in BIOS.',
      'Voltage Monitor': 'Summarizes simulated +5 V, +12 V, and low-voltage rails. BIOS health pages taught users that stable power was as important as temperature and fan readings.',
      'Temperature Unit': 'Changes the display unit for the simulated sensor readings. Hardware monitor screens often offered this preference as PC health pages became more common.'
    };

    const defaultConfig = () => ({
      systemDate: '1996-07-15', systemTime: '12:30:00', cpuCache: true, numLock: true, quickBoot: true, bootLogo: false, temperatureUnit: 'Celsius', bootOrder: ['Virtual HDD', 'Virtual Floppy', 'Museum Network']
    });

    let biosConfig = loadConfig();
    const appState = { currentMenu: 0, selectedRow: 0, dirty: false, dialog: null, dialogSelection: 0, editorPart: 0, rebooting: false, postStep: 0 };
    const app = document.getElementById('biosApp');

    const editable = {
      'System Date': { type: 'date', key: 'systemDate' }, 'System Time': { type: 'time', key: 'systemTime' }, 'CPU Internal Cache': { type: 'choice', key: 'cpuCache', choices: [['Enabled', true], ['Disabled', false]] },
      'Quick Boot': { type: 'choice', key: 'quickBoot', choices: [['Enabled', true], ['Disabled', false]] }, 'Boot Logo': { type: 'choice', key: 'bootLogo', choices: [['Enabled', true], ['Disabled', false]] },
      'NumLock Status': { type: 'choice', key: 'numLock', choices: [['On', true], ['Off', false]] }, 'Temperature Unit': { type: 'choice', key: 'temperatureUnit', choices: [['Celsius', 'Celsius'], ['Fahrenheit', 'Fahrenheit']] }
    };

    function rows() { return [
      { id: 'standard', label: 'Standard CMOS Features', rows: [['System Date', biosConfig.systemDate], ['System Time', biosConfig.systemTime], ['CPU', hardware.cpu], ['Memory', hardware.memory], ['Virtual HDD', hardware.hdd], ['Primary Floppy', hardware.floppy], ['Display Adapter', hardware.display], ['Keyboard', hardware.keyboard], ['Mouse', hardware.mouse]] },
      { id: 'advanced', label: 'Advanced BIOS Features', rows: [['CPU Internal Cache', biosConfig.cpuCache ? 'Enabled' : 'Disabled'], ['Quick Boot', biosConfig.quickBoot ? 'Enabled' : 'Disabled'], ['Boot Logo', biosConfig.bootLogo ? 'Enabled' : 'Disabled'], ['NumLock Status', biosConfig.numLock ? 'On' : 'Off'], ['Security Option', 'Setup'], ['Typematic Rate', 'Default']] },
      { id: 'peripherals', label: 'Integrated Peripherals', rows: [['Serial Port A', 'Virtual COM1'], ['Parallel Port', 'Virtual LPT1'], ['IDE Controller', 'Enabled'], ['USB Legacy Mode', 'Enabled'], ['Sound Device', 'Not Installed']] },
      { id: 'power', label: 'Power Management', rows: [['Power Management', 'User Define'], ['Suspend Mode', 'Disabled'], ['HDD Power Down', 'Disabled'], ['Wake on Keyboard', 'Disabled'], ['Soft-Off Method', 'Instant-Off']] },
      { id: 'pnp', label: 'PnP / PCI Configuration', rows: [['PNP OS Installed', 'No'], ['Reset Configuration Data', 'Disabled'], ['IRQ Resources', 'Auto'], ['PCI VGA Palette Snoop', 'Disabled']] },
      { id: 'boot', label: 'Boot Configuration', rows: [['First Boot Device', biosConfig.bootOrder[0]], ['Second Boot Device', biosConfig.bootOrder[1]], ['Third Boot Device', biosConfig.bootOrder[2]], ['Boot Other Device', 'Enabled'], ['Boot Delay', '2 seconds']] },
      { id: 'monitor', label: 'Hardware Monitor', rows: [['CPU Temperature', biosConfig.temperatureUnit === 'Celsius' ? '38 °C' : '100 °F'], ['System Temperature', biosConfig.temperatureUnit === 'Celsius' ? '32 °C' : '90 °F'], ['CPU Fan Speed', '2600 RPM'], ['Chassis Fan', 'Not Installed'], ['Voltage Monitor', '+5 V / +12 V Nominal'], ['Temperature Unit', biosConfig.temperatureUnit]] }
    ]; }

    function loadConfig() { try { const saved = localStorage.getItem(STORAGE_KEY); if (saved) return { ...defaultConfig(), ...JSON.parse(saved) }; } catch (error) { console.warn('Unable to load virtual CMOS configuration.', error); } return defaultConfig(); }
    function saveConfig() { localStorage.setItem(STORAGE_KEY, JSON.stringify(biosConfig)); appState.dirty = false; }
    function menus() { return rows(); }
    function clampRow() { appState.selectedRow = Math.max(0, Math.min(appState.selectedRow, menus()[appState.currentMenu].rows.length - 1)); }
    function setMenu(index) { appState.currentMenu = (index + menus().length) % menus().length; appState.selectedRow = 0; render(); }
    function setRow(index) { const r = menus()[appState.currentMenu].rows; appState.selectedRow = (index + r.length) % r.length; render(); }
    function currentItem() { return menus()[appState.currentMenu].rows[appState.selectedRow][0]; }
    function openExitDialog() { appState.dialog = 'exit'; appState.dialogSelection = 1; render(); }
    function openSaveDialog() { appState.dialog = 'save'; appState.dialogSelection = 0; render(); }
    function exitSetup() { window.location.href = RETURN_URL; }
    function beginReboot() {
      appState.rebooting = true; appState.dialog = null; app.classList.add('fade-black');
      renderPost(['Saving CMOS...', 'Updating CMOS checksum...', 'Done.']);
      setTimeout(() => renderPost([]), 750);
      setTimeout(showPost, 1050);
    }
    function showPost() {
      const postLines = [`<strong>Computer Museum BIOS</strong>`, '', 'Memory Test...', '4096 KB OK', `${hardware.memory} OK`, `CPU detected  ${hardware.cpu}`, `Primary Master detected  ${hardware.hdd}`, 'Primary Slave  None', `Floppy Drive  ${hardware.floppy}`, `Keyboard detected  ${hardware.keyboard}`, '', 'Press DEL to enter Setup', '', 'Booting Virtual System...'];
      postLines.forEach((_, index) => setTimeout(() => renderPost(postLines.slice(0, index + 1)), index * 145));
      setTimeout(exitSetup, 2600);
    }
    function renderPost(lines) { app.innerHTML = `<section class="post-screen">${Array.isArray(lines) ? lines.join('<br>') : lines}</section>`; }

    function openEditor() {
      const item = currentItem(); if (!editable[item]) return;
      const ed = editable[item];
      appState.dialog = 'editor';
      appState.dialogSelection = ed.type === 'choice' ? Math.max(0, ed.choices.findIndex(choice => choice[1] === biosConfig[ed.key])) : 0;
      appState.editorPart = 0; render();
    }
    function adjustEditor(delta) { const item = currentItem(), ed = editable[item]; if (!ed) return; if (ed.type === 'choice') appState.dialogSelection = (appState.dialogSelection + delta + ed.choices.length) % ed.choices.length; else {
        const parts = biosConfig[ed.key].split(ed.type === 'date' ? '-' : ':').map(Number); const max = ed.type === 'date' ? [2099,12,31] : [23,59,59]; const min = ed.type === 'date' ? [1980,1,1] : [0,0,0]; parts[appState.editorPart] += delta; if (parts[appState.editorPart] > max[appState.editorPart]) parts[appState.editorPart] = min[appState.editorPart]; if (parts[appState.editorPart] < min[appState.editorPart]) parts[appState.editorPart] = max[appState.editorPart]; biosConfig[ed.key] = parts.map((n,i)=>String(n).padStart(i===0&&ed.type==='date'?4:2,'0')).join(ed.type === 'date' ? '-' : ':'); appState.dirty = true; }
      render(); }
    function acceptEditor() { const item = currentItem(), ed = editable[item]; if (ed?.type === 'choice') { biosConfig[ed.key] = ed.choices[appState.dialogSelection][1]; appState.dirty = true; } appState.dialog = null; render(); }

    function dialogHtml() { if (!appState.dialog) return ''; if (appState.dialog === 'exit') return `<div class="dialog-backdrop"><section class="dialog" role="dialog" aria-modal="true"><h2>Exit Setup?</h2><p>${appState.dirty ? 'Discard unsaved configuration changes?' : 'Return to Computer Museum BIOS page?'}</p><div class="dialog-options"><div class="dialog-option" aria-selected="${appState.dialogSelection===0}">Yes</div><div class="dialog-option" aria-selected="${appState.dialogSelection===1}">No</div></div><p class="dialog-keys">Enter Accept&nbsp;&nbsp; Esc Cancel</p></section></div>`;
      if (appState.dialog === 'save') return `<div class="dialog-backdrop"><section class="dialog" role="dialog" aria-modal="true"><h2>Save configuration?</h2><div class="dialog-options"><div class="dialog-option" aria-selected="${appState.dialogSelection===0}">Yes</div><div class="dialog-option" aria-selected="${appState.dialogSelection===1}">No</div></div><p class="dialog-keys">Enter Accept&nbsp;&nbsp; Esc Cancel</p></section></div>`;
      const item=currentItem(), ed=editable[item]; let body=''; if (ed.type==='choice') body=`<div class="dialog-options">${ed.choices.map((c,i)=>`<div class="dialog-option" aria-selected="${appState.dialogSelection===i}">${c[0]}</div>`).join('')}</div>`; else { const sep=ed.type==='date'?' / ':' : '; const vals=biosConfig[ed.key].split(ed.type==='date'?'-':':').map((v,i)=>`<span class="${appState.editorPart===i?'active':''}">${ed.type==='date'&&i===0?v.slice(2):v}</span>`); body=`<div class="editor-values">${vals.join(sep)}</div>`; }
      return `<div class="dialog-backdrop"><section class="dialog" role="dialog" aria-modal="true"><h2>${item}</h2>${body}<p class="dialog-keys">PgUp / PgDn Change Value<br>← → Select Field<br>Enter Accept<br>Esc Cancel</p></section></div>`; }

    function render() { if (appState.rebooting) return; clampRow(); const menu = menus()[appState.currentMenu]; const item = menu.rows[appState.selectedRow][0]; app.innerHTML = `
        <header class="bios-header"><div class="bios-title">Computer Museum BIOS Setup Utility</div><div>Version 1.0</div><div>Copyright (C) Dennis Hilk</div></header>
        <nav class="bios-menu" role="tablist" aria-label="BIOS setup menus">${menus().map((m,i)=>`<button type="button" role="tab" aria-selected="${i===appState.currentMenu}" data-menu="${i}">${m.label}</button>`).join('')}</nav>
        <section class="bios-main"><div class="bios-panel" role="listbox" aria-label="${menu.label} settings"><span class="panel-title">${menu.label}</span><div class="bios-list">${menu.rows.map((row,i)=>`<button type="button" class="bios-row" role="option" aria-selected="${i===appState.selectedRow}" data-row="${i}"><span>${row[0]}</span><span class="value">${row[1]}</span></button>`).join('')}</div></div>
        <aside class="bios-panel bios-help-panel" aria-label="Context help"><span class="panel-title">Item Help</span><div class="bios-list"><strong>${item}</strong><br><br>${helpText[item] || 'This setting is included to show how classic BIOS screens grouped related hardware choices for education.'}</div></aside></section>
        <footer class="bios-status"><span><kbd>↑↓</kbd> Select Item</span><span><kbd>←→</kbd> Change Menu</span><span><kbd>Enter</kbd> Edit</span><span><kbd>Esc</kbd> Exit</span><span><kbd>F10</kbd> Save & Exit</span>${appState.dirty?'<span>Changes Not Saved</span>':''}</footer>${dialogHtml()}`;
      bindPointerHandlers(); app.focus({ preventScroll: true }); }
    function bindPointerHandlers() { document.querySelectorAll('[data-menu]').forEach(b=>b.addEventListener('click',()=>setMenu(Number(b.dataset.menu)))); document.querySelectorAll('[data-row]').forEach(b=>b.addEventListener('click',()=>{ setRow(Number(b.dataset.row)); openEditor(); })); }

    document.addEventListener('keydown', event => { const keys=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter','Escape','Home','End','PageUp','PageDown','Tab','F10','y','Y','n','N']; if(!keys.includes(event.key)) return; event.preventDefault();
      if (appState.dialog === 'editor') { if(event.key==='Escape'){appState.dialog=null; render();} else if(event.key==='Enter') acceptEditor(); else if(event.key==='ArrowLeft') {appState.editorPart=Math.max(0,appState.editorPart-1); render();} else if(event.key==='ArrowRight') {appState.editorPart=Math.min(2,appState.editorPart+1); render();} else if(event.key==='PageUp'||event.key==='ArrowUp') adjustEditor(1); else if(event.key==='PageDown'||event.key==='ArrowDown') adjustEditor(-1); return; }
      if (appState.dialog === 'exit' || appState.dialog === 'save') {
        if(event.key==='Escape'||event.key.toLowerCase()==='n'){appState.dialog=null; render();}
        else if(event.key==='ArrowLeft'||event.key==='ArrowRight'||event.key==='Tab') {appState.dialogSelection=1-appState.dialogSelection; render();}
        else if(event.key.toLowerCase()==='y') appState.dialogSelection=0;
        if(event.key==='Enter'||event.key.toLowerCase()==='y'){ if(appState.dialogSelection===0){ if(appState.dialog==='save'){ saveConfig(); beginReboot(); } else exitSetup(); } else { appState.dialog=null; render(); } }
        return;
      }
      if(event.key==='ArrowUp'||(event.key==='Tab'&&event.shiftKey)) setRow(appState.selectedRow-1); else if(event.key==='ArrowDown'||event.key==='Tab') setRow(appState.selectedRow+1); else if(event.key==='ArrowLeft'||event.key==='PageUp') setMenu(appState.currentMenu-1); else if(event.key==='ArrowRight'||event.key==='PageDown') setMenu(appState.currentMenu+1); else if(event.key==='Home') setRow(0); else if(event.key==='End') setRow(menus()[appState.currentMenu].rows.length-1); else if(event.key==='Escape') openExitDialog(); else if(event.key==='F10') openSaveDialog(); else if(event.key==='Enter') openEditor(); });

    render();
  </script>
</body>
</html>
