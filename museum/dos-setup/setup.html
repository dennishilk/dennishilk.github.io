<style>
:root{--bg:#02040a;--panel:#080808;--line:#b8b8b8;--dim:#777;--white:#f5f5f5;--cyan:#45ffff;--yellow:#ffff66;--bar:#b8b8b8;--black:#000;--warn:#ff8080;--green:#70ff70}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;color:var(--white);font-family:"Lucida Console","Courier New",monospace}body{display:grid;place-items:center;padding:clamp(4px,1vw,14px)}button{font:inherit}.dos-screen{width:min(980px,calc(100vw - 10px));height:min(720px,calc(100vh - 10px));min-height:min(560px,100vh);display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;background:radial-gradient(circle at 50% 0,#06122a 0,#02040a 42%,#000 100%);border:4px double var(--line);box-shadow:0 0 0 2px #222,0 0 38px rgba(0,0,0,.85);outline:2px solid transparent}.dos-screen:focus{outline-color:var(--cyan)}.dos-header{text-align:center;line-height:1.35;padding:14px 12px 10px;border-bottom:1px solid var(--line)}.dos-title{color:var(--yellow);font-weight:700;font-size:clamp(1rem,2vw,1.35rem)}.dos-subtitle{color:var(--line)}.progress{padding:7px 14px;border-bottom:1px solid var(--line);color:var(--cyan);display:flex;justify-content:space-between;gap:12px}.dos-window{margin:18px;border:3px double var(--line);background:#050505;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr)}.window-title{justify-self:center;position:relative;top:-.85em;background:#050505;color:var(--yellow);padding:0 12px}.content{margin-top:-.35em;padding:0 28px 24px;overflow:auto;line-height:1.45}.lead{white-space:pre-line}.explain{color:var(--line);margin:12px 0 18px;white-space:pre-line}.options{display:grid;gap:2px;margin:12px 0}.option,.action{border:0;background:transparent;color:var(--white);text-align:left;padding:4px 10px;cursor:pointer;min-height:30px}.option[aria-selected=true],.action[aria-selected=true]{background:var(--bar);color:#000}.option .mark{display:inline-block;width:2ch;color:var(--cyan)}.option[aria-selected=true] .mark,.action[aria-selected=true] .mark{color:#000}.config-box,.test-box,.summary-grid,.save-log{border:1px solid var(--line);padding:12px 14px;margin:12px 0;background:#000}.row{display:flex;justify-content:space-between;gap:14px;border-bottom:1px dotted #333;padding:2px 0}.row:last-child{border-bottom:0}.label{color:var(--cyan)}.value{color:var(--white);text-align:right}.play-button{display:inline-block;margin:12px 0;padding:5px 16px;border:1px solid var(--line);background:#111;color:var(--yellow)}.message{color:var(--green);min-height:1.4em}.error{color:var(--warn)}.axis{display:grid;grid-template-columns:150px 1fr 52px;align-items:center;gap:10px;margin:6px 0}.meter{height:18px;border:1px solid var(--line);background:#000;position:relative}.meter span{position:absolute;left:50%;top:0;height:100%;width:4px;background:var(--cyan);transform:translateX(-50%)}.button-led{display:inline-block;width:1.2em;height:1.2em;border:1px solid var(--line);background:#111;margin-right:8px;vertical-align:middle}.button-led.on{background:var(--green)}.summary-grid{display:grid;grid-template-columns:150px 1fr;gap:10px 18px}.summary-grid h3{grid-column:1/-1;color:var(--yellow);margin:8px 0 0;font-size:1rem}.dos-status{border-top:1px solid var(--line);padding:8px 10px;color:var(--white);text-align:center}.dos-status kbd{color:var(--cyan);font:inherit}.touch-controls{display:none;border-top:1px solid var(--line);background:#070707;padding:8px}.touch-title{text-align:center;color:var(--cyan);font-size:.78rem;margin-bottom:6px}.touch-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}.touch-key{min-width:58px;min-height:42px;border:1px solid var(--line);background:#000;color:#fff;box-shadow:2px 2px 0 #444;cursor:pointer}.saving-line{color:var(--line)}.saving-line.done{color:var(--green)}@media(max-width:760px){body{padding:0}.dos-screen{width:100%;height:100%;min-height:100%;border-width:2px}.dos-header{font-size:.82rem;padding:10px 8px}.progress{font-size:.74rem}.dos-window{margin:9px}.content{padding:0 14px 16px;font-size:.84rem}.summary-grid{grid-template-columns:1fr}.row{display:block}.value{text-align:left;color:var(--cyan)}.dos-status{font-size:.74rem}.touch-controls{display:block}.touch-key{flex:1 0 62px;max-width:112px}.axis{grid-template-columns:1fr}.play-button{width:100%}}
</style></head><body><main id="dosApp" class="dos-screen" tabindex="0" role="application" aria-label="Computer Museum DOS Setup Utility"></main><script>
const STORAGE_KEY='computerMuseumDOSSetup',OLD_KEY='computerMuseumDOSSetup.v1',RETURN_URL='/museum/dos-setup/';
const choices={digitalAudio:['Sound Blaster 16','Sound Blaster Pro','Sound Blaster','Gravis Ultrasound','PC Speaker','No Digital Audio'],port:['210h','220h','230h','240h','250h','260h'],irq:['2','5','7','10'],dma:['0','1','3','5'],music:['General MIDI','Roland MT-32 Compatible','AdLib / FM Synth','Sound Blaster FM','Gravis Ultrasound','PC Speaker','No Music'],input:['Keyboard Only','Two-Button Joystick','Four-Button Joystick','Gamepad','Mouse and Keyboard'],display:['VGA 320×200','VGA 640×480','SVGA 800×600','VESA Compatible','Text Mode','Automatic'],memoryMode:['Automatic','Prefer XMS','Prefer EMS','Conventional Only'],difficulty:['Easy','Normal','Hard'],subtitles:['Enabled','Disabled'],demoPlayback:['Enabled','Disabled'],language:['English','German'],mouseSensitivity:['Low','Medium','High']};
const defaults={digitalAudio:'Sound Blaster 16',port:'220h',irq:'5',dma:'1',music:'AdLib / FM Synth',input:'Keyboard Only',display:'VGA 640×480',memoryMode:'Automatic',difficulty:'Normal',subtitles:'Enabled',demoPlayback:'Enabled',language:'English',mouseSensitivity:'Medium'};
let state={currentStep:'welcome',workingConfig:loadConfig(),savedConfig:null,testStatus:{audio:'not-run',music:'not-run'},audioTestState:'idle',musicTestState:'idle',message:'',dirty:false,selectedIndex:0,history:[],saveLines:[],joy:{x:0,y:0,buttons:[false,false,false,false]},gamepadActive:false};state.savedConfig=JSON.parse(JSON.stringify(state.workingConfig));
let activeAudio=[];
const app=document.getElementById('dosApp');
function normalize(raw){let c={...defaults,...(raw||{})};const legacy={AdLib:'AdLib / FM Synth','Roland MT-32':'Roland MT-32 Compatible','Sound Blaster':'Sound Blaster FM',SVGA:'SVGA 800×600',VGA:'VGA 640×480',VESA:'VESA Compatible',Deutsch:'German'};if(legacy[c.music])c.music=legacy[c.music];if(legacy[c.display])c.display=legacy[c.display];if(legacy[c.language])c.language=legacy[c.language];if(c.joystick==='Enabled')c.input=c.joystickType==='2 Button'?'Two-Button Joystick':'Four-Button Joystick';Object.keys(choices).forEach(k=>{if(!choices[k].includes(c[k]))c[k]=defaults[k]});return c}
function loadConfig(){let raw=null;try{raw=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')||JSON.parse(localStorage.getItem(OLD_KEY)||'null')}catch(e){console.warn('Unable to load DOS setup configuration.',e)}return normalize(raw)}
function saveConfig(){localStorage.setItem(STORAGE_KEY,JSON.stringify({version:2,savedAt:new Date().toISOString(),audioTestStatus:state.testStatus.audio,musicTestStatus:state.testStatus.music,...state.workingConfig}));state.savedConfig=JSON.parse(JSON.stringify(state.workingConfig));state.dirty=false}
function needsSB(){return ['Sound Blaster 16','Sound Blaster Pro','Sound Blaster'].includes(state.workingConfig.digitalAudio)}function hasAudio(){return state.workingConfig.digitalAudio!=='No Digital Audio'}function hasMusic(){return state.workingConfig.music!=='No Music'}function needsJoy(){return ['Two-Button Joystick','Four-Button Joystick','Gamepad'].includes(state.workingConfig.input)}
const steps=[{id:'welcome',title:'Welcome',kind:'welcome'},{id:'audioDevice',title:'Select Digital Audio Device',kind:'choice',key:'digitalAudio',text:'DOS games often configured sampled sound effects separately from music. Choose a virtual device for original museum sound tests.'},{id:'audioPort',title:'Sound Port',kind:'choice',key:'port',when:needsSB,text:'The I/O address let software find a Sound Blaster-compatible card. 220h was a familiar default; wrong values often meant silence.'},{id:'audioIrq',title:'Sound IRQ',kind:'choice',key:'irq',when:needsSB,text:'The interrupt request allowed a sound card to notify the processor when audio data was ready. Incorrect IRQ settings could cause conflicts.'},{id:'audioDma',title:'Sound DMA',kind:'choice',key:'dma',when:needsSB,text:'DMA channels moved sampled audio without constant processor attention. DOS setup programs commonly asked for this number.'},{id:'audioTest',title:'Test Digital Audio',kind:'audioTest',when:hasAudio},{id:'audioConfirm',title:'Digital Audio Confirmation',kind:'confirm',mode:'audio',when:hasAudio},{id:'musicDevice',title:'Select Music Device',kind:'choice',key:'music',text:'Many DOS games configured sound effects and music independently. Music might use FM synthesis, MIDI, a speaker, or be disabled.'},{id:'musicTest',title:'Test Music',kind:'musicTest',when:hasMusic},{id:'musicConfirm',title:'Music Confirmation',kind:'confirm',mode:'music',when:hasMusic},{id:'input',title:'Select Input Device',kind:'choice',key:'input',text:'Choose the virtual controls for this educational software. Real gamepad access is optional; keyboard and touch simulation always work.'},{id:'joystickTest',title:'Joystick Test',kind:'joystickTest',when:needsJoy},{id:'display',title:'Display Mode',kind:'choice',key:'display',text:'These choices mirror believable DOS-era display targets. The browser will not be forced into fullscreen without a direct action.'},{id:'memory',title:'Memory Information',kind:'memory',key:'memoryMode'},{id:'game',title:'Game Options',kind:'game'},{id:'summary',title:'Configuration Summary',kind:'summary'},{id:'save',title:'Save Configuration',kind:'save'},{id:'complete',title:'Setup Complete',kind:'complete'}];
function step(id=state.currentStep){return steps.find(s=>s.id===id)}function visibleSteps(){return steps.filter(s=>!s.when||s.when())}function progress(){let v=visibleSteps().filter(s=>!['save','complete'].includes(s.id)),i=v.findIndex(s=>s.id===state.currentStep);return i<0?'':'Step '+(i+1)+' of '+v.length}
function goto(id,push=true){leaveTestIfNeeded(id);if(push&&state.currentStep!==id)state.history.push(state.currentStep);state.currentStep=id;state.selectedIndex=0;state.message='';render()}function next(){let v=visibleSteps(),i=v.findIndex(s=>s.id===state.currentStep);if(i<v.length-1)goto(v[i+1].id)}function back(){let last;while(state.history.length){last=state.history.pop();if(visibleSteps().some(s=>s.id===last))break;last=null}if(last)goto(last,false);else if(state.currentStep==='welcome')location.href=RETURN_URL;else goto('welcome',false)}function mark(){state.dirty=JSON.stringify(state.workingConfig)!==JSON.stringify(state.savedConfig)}
function stopActiveAudio(){activeAudio.forEach(n=>{try{n.stop()}catch(e){}});activeAudio=[]}
function resetAudioTest(){state.audioTestState='idle';state.testStatus.audio='not-run'}
function resetMusicTest(){state.musicTestState='idle';state.testStatus.music='not-run'}
function setConfig(key,value){if(state.workingConfig[key]===value)return;state.workingConfig[key]=value;if(['digitalAudio','port','irq','dma'].includes(key))resetAudioTest();if(key==='music')resetMusicTest();mark()}
function leaveTestIfNeeded(id){if((state.currentStep==='audioTest'&&id!=='audioTest')||(state.currentStep==='musicTest'&&id!=='musicTest'))stopActiveAudio()}
function optionList(){let s=step();if(s.kind==='confirm')return s.mode==='audio'?['Yes, the sound worked','No, change the settings','Replay the test sound','Disable digital audio']:['Yes, the music worked','No, choose another device','Replay the music','Disable music'];if(s.kind==='summary')return ['Save Configuration','Go Back','Exit Without Saving'];if(s.kind==='complete')return ['Return to Exhibit','Run Setup Again'];return choices[s.key]||[]}
function accept(){let s=step(),opts=optionList();if(s.kind==='welcome')return next();if(s.kind==='choice'){setConfig(s.key,opts[state.selectedIndex]);return next()}if(s.kind==='audioTest'){if(state.audioTestState==='completed')return goto('audioConfirm');return playDigitalAudio()}if(s.kind==='musicTest'){if(state.musicTestState==='completed')return goto('musicConfirm');return playMusic()}if(s.kind==='joystickTest')return next();if(s.kind==='memory'){setConfig('memoryMode',choices.memoryMode[state.selectedIndex]);return next()}if(s.kind==='game')return next();if(s.kind==='confirm'){let pick=opts[state.selectedIndex];if(s.mode==='audio'){if(pick.startsWith('Yes')){state.testStatus.audio='confirmed';next()}else if(pick.startsWith('No')){resetAudioTest();goto(needsSB()?'audioPort':'audioDevice')}else if(pick.startsWith('Replay')){resetAudioTest();goto('audioTest')}else{setConfig('digitalAudio','No Digital Audio');goto('musicDevice')}}else{if(pick.startsWith('Yes')){state.testStatus.music='confirmed';next()}else if(pick.startsWith('No')){resetMusicTest();goto('musicDevice')}else if(pick.startsWith('Replay')){resetMusicTest();goto('musicTest')}else{setConfig('music','No Music');goto('input')}}return}if(s.kind==='summary'){if(state.selectedIndex===0)goto('save');else if(state.selectedIndex===1)back();else location.href=RETURN_URL;return}if(s.kind==='complete'){if(state.selectedIndex===0)location.href=RETURN_URL;else{state.history=[];goto('welcome',false)}}}
function changeSelection(d){let opts=optionList();if(!opts.length)return;state.selectedIndex=(state.selectedIndex+d+opts.length)%opts.length;render()}function firstLast(i){let opts=optionList();if(opts.length){state.selectedIndex=i?opts.length-1:0;render()}}function f10(){goto(state.dirty?'summary':'complete')}
function audioContext(){let C=window.AudioContext||window.webkitAudioContext;if(!C)throw new Error('Audio test could not be started in this browser.');return new C()}async function readyContext(){let ctx=audioContext();if(ctx.state==='suspended')await ctx.resume();return ctx}async function playDigitalAudio(){if(state.audioTestState==='playing')return;try{stopActiveAudio();state.audioTestState='playing';state.message='Playing original museum PCM-style test sound...';render();let ctx=await readyContext(),dur=.7,buf=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++){let t=i/ctx.sampleRate,env=Math.max(0,1-t/dur);d[i]=(Math.sin(2*Math.PI*(180+420*t)*t)*.35+(Math.random()*2-1)*.18)*env}let src=ctx.createBufferSource(),gain=ctx.createGain();activeAudio=[src];gain.gain.value=.35;src.buffer=buf;src.connect(gain).connect(ctx.destination);src.onended=()=>{activeAudio=activeAudio.filter(n=>n!==src);if(state.currentStep==='audioTest'){state.audioTestState='completed';state.testStatus.audio='played';state.message='Original museum PCM-style test sound played.';render()}};src.start()}catch(e){activeAudio=[];state.audioTestState='failed';state.testStatus.audio='failed';state.message='Audio test could not be started in this browser.';render()}}
async function playMusic(){if(state.musicTestState==='playing')return;try{stopActiveAudio();state.musicTestState='playing';state.message='Playing original museum melody...';render();let ctx=await readyContext(),now=ctx.currentTime,notes=[261.63,329.63,392,523.25,392,329.63,293.66,349.23],type=state.workingConfig.music.includes('PC Speaker')?'square':state.workingConfig.music.includes('AdLib')||state.workingConfig.music.includes('FM')?'triangle':'sine';notes.forEach((n,i)=>{let o=ctx.createOscillator(),g=ctx.createGain();activeAudio.push(o);o.type=type;o.frequency.value=n;g.gain.setValueAtTime(0,now+i*.16);g.gain.linearRampToValueAtTime(.18,now+i*.16+.02);g.gain.exponentialRampToValueAtTime(.001,now+i*.16+.15);o.connect(g).connect(ctx.destination);o.start(now+i*.16);o.stop(now+i*.16+.17);if(state.workingConfig.music.includes('Gravis')||state.workingConfig.music.includes('General')){let o2=ctx.createOscillator(),g2=ctx.createGain();activeAudio.push(o2);o2.type='sine';o2.frequency.value=n*1.5;g2.gain.value=.05;o2.connect(g2).connect(ctx.destination);o2.start(now+i*.16);o2.stop(now+i*.16+.14)}});setTimeout(()=>{if(state.currentStep==='musicTest'){activeAudio=[];state.musicTestState='completed';state.testStatus.music='played';state.message='Original museum melody played with a device-inspired timbre.';render()}},notes.length*.16*1000+220)}catch(e){activeAudio=[];state.musicTestState='failed';state.testStatus.music='failed';state.message='Audio test could not be started in this browser.';render()}}
function moveJoy(dx,dy){state.joy.x=Math.max(-1,Math.min(1,state.joy.x+dx));state.joy.y=Math.max(-1,Math.min(1,state.joy.y+dy));render()}function pressJoy(n){state.joy.buttons[n]=!state.joy.buttons[n];render()}function pollGamepad(){if(state.currentStep!=='joystickTest')return;let pads=navigator.getGamepads?navigator.getGamepads():[];let p=[...pads].find(Boolean);if(p){state.joy.x=+(p.axes[0]||0).toFixed(2);state.joy.y=+(p.axes[1]||0).toFixed(2);state.joy.buttons=state.joy.buttons.map((_,i)=>!!(p.buttons[i]&&p.buttons[i].pressed));state.gamepadActive=true;render()}requestAnimationFrame(pollGamepad)}
function rows(obj){return Object.entries(obj).map(([k,v])=>`<div class="row"><span class="label">${k}</span><span class="value">${v}</span></div>`).join('')}function optionHtml(opts){return `<div class="options">${opts.map((o,i)=>`<button class="option" data-choice="${i}" aria-selected="${i===state.selectedIndex}"><span class="mark">${i===state.selectedIndex?'›':''}</span>${o}</button>`).join('')}</div>`}
function content(){let s=step(),c=state.workingConfig;if(s.kind==='welcome')return `<p class="lead">Computer Museum DOS Setup Utility\n\nThis program will help configure the virtual audio,\nmusic, display and input devices used by this\neducational DOS software environment.\n\nNo real hardware will be accessed.\n\nPress Enter to continue.\nPress Esc to exit.</p>`;if(s.kind==='choice')return `<p class="explain">${s.text||''}</p>${optionHtml(optionList())}`;if(s.kind==='audioTest'){let label=state.audioTestState==='completed'?'Continue':state.audioTestState==='failed'?'Retry':'Play Test Sound';let help=state.audioTestState==='completed'?'Press Enter to answer the test question. Press R to replay.':state.audioTestState==='failed'?'Press Enter to retry, C to continue without confirming, or Esc to change settings.':'Press Enter to generate a short original browser sound. Audio starts only after this user action.';return `<div class="test-box">${rows({Device:c.digitalAudio,Port:needsSB()?c.port:'Not required',IRQ:needsSB()?c.irq:'Not required',DMA:needsSB()?c.dma:'Not required'})}</div><div class="play-button">[ ${label} ]</div><p class="explain">${help}</p><p class="message ${state.testStatus.audio==='failed'?'error':''}">${state.message}</p>`}if(s.kind==='musicTest'){let label=state.musicTestState==='completed'?'Continue':state.musicTestState==='failed'?'Retry':'Play Test Music';let help=state.musicTestState==='completed'?'Press Enter to answer the music question. Press R to replay.':state.musicTestState==='failed'?'Press Enter to retry, C to continue without confirming, or Esc to choose another device.':'Press Enter to play a short original museum melody. The waveform changes slightly by selected device.';return `<div class="test-box">${rows({'Music Device':c.music})}</div><div class="play-button">[ ${label} ]</div><p class="explain">${help}</p><p class="message ${state.testStatus.music==='failed'?'error':''}">${state.message}</p>`};if(s.kind==='confirm')return optionHtml(optionList());if(s.kind==='joystickTest')return `<p class="explain">Move the control and press its buttons. A real browser gamepad may be read after interaction, but simulated keyboard/touch testing is always available.</p><div class="config-box"><div class="axis"><span>Horizontal Axis</span><div class="meter"><span style="left:${50+state.joy.x*45}%"></span></div><span>${state.joy.x.toFixed(1)}</span></div><div class="axis"><span>Vertical Axis</span><div class="meter"><span style="left:${50+state.joy.y*45}%"></span></div><span>${state.joy.y.toFixed(1)}</span></div>${state.joy.buttons.map((b,i)=>`<p><span class="button-led ${b?'on':''}"></span>Button ${i+1}</p>`).join('')}</div><p class="message">${state.gamepadActive?'Browser gamepad input detected.':'Use arrow keys/touch arrows and PageUp/PageDown/Home/End to simulate buttons.'}</p>`;if(s.kind==='memory')return `<p class="explain">DOS applications often checked memory managers before launch. These values are educational and virtual.</p><div class="config-box">${rows({'Conventional Memory':'640 KB','Extended Memory':'8192 KB','XMS Driver':'Available','EMS Driver':'Available'})}</div><h3>Memory Mode</h3>${optionHtml(choices.memoryMode)}`;if(s.kind==='game')return `<p class="explain">Final fictional settings for the museum-created software environment.</p>${['difficulty','subtitles','demoPlayback','language','mouseSensitivity'].map((k,i)=>`<div class="row"><span class="label">${k.replace(/([A-Z])/g,' $1')}</span><span class="value">${c[k]}</span></div><div class="options">${choices[k].map(v=>`<button class="option" data-game="${k}" data-value="${v}" aria-selected="${c[k]===v}"><span class="mark">${c[k]===v?'›':''}</span>${v}</button>`).join('')}</div>`).join('')}`;if(s.kind==='summary')return `<div class="summary-grid"><h3>Digital Audio</h3><div>${c.digitalAudio}</div><div>${hasAudio()&&needsSB()?`${c.port} / IRQ ${c.irq} / DMA ${c.dma}`:hasAudio()?'No port, IRQ or DMA required':'Disabled'}<br>Test: ${state.testStatus.audio}</div><h3>Music</h3><div>${c.music}</div><div>Test: ${state.testStatus.music}</div><h3>Input</h3><div>${c.input}</div><div></div><h3>Display</h3><div>${c.display}</div><div></div><h3>Memory</h3><div>${c.memoryMode} / XMS Available</div><div></div><h3>Game Options</h3><div>Difficulty: ${c.difficulty}<br>Subtitles: ${c.subtitles}<br>Demo Playback: ${c.demoPlayback}<br>Language: ${c.language}<br>Mouse Sensitivity: ${c.mouseSensitivity}</div></div>${optionHtml(optionList())}`;if(s.kind==='save')return `<div class="save-log">${state.saveLines.map((l,i)=>`<p class="saving-line ${i<state.saveLines.length-1?'done':''}">${l}</p>`).join('')}</div>`;if(s.kind==='complete')return `<p class="lead">Setup Complete\n\nYour virtual DOS software configuration has been saved.\n\nTo change these settings later, run SETUP again.\n\nC:\\MUSEUM\\GAME&gt;SETUP.EXE completed successfully.</p>${optionHtml(optionList())}`;return''}
function footer(){let s=step();if(s.kind==='audioTest'){if(state.audioTestState==='completed')return '<kbd>Enter</kbd> Continue   <kbd>R</kbd> Replay   <kbd>Esc</kbd> Change Settings';if(state.audioTestState==='failed')return '<kbd>Enter</kbd> Retry   <kbd>C</kbd> Continue without confirming   <kbd>Esc</kbd> Back';return '<kbd>Enter</kbd> Play Test   <kbd>Esc</kbd> Change Settings'}if(s.kind==='musicTest'){if(state.musicTestState==='completed')return '<kbd>Enter</kbd> Continue   <kbd>R</kbd> Replay   <kbd>Esc</kbd> Back';if(state.musicTestState==='failed')return '<kbd>Enter</kbd> Retry   <kbd>C</kbd> Continue without confirming   <kbd>Esc</kbd> Back';return '<kbd>Enter</kbd> Play Test   <kbd>Esc</kbd> Back'}if(s.kind==='confirm')return '<kbd>↑↓</kbd> Select   <kbd>Enter</kbd> Accept   <kbd>Esc</kbd> Back';if(s.kind==='save')return '<kbd>Enter</kbd> Save   <kbd>Esc</kbd> Back';if(s.kind==='summary')return '<kbd>↑↓</kbd> Select   <kbd>Enter</kbd> Accept   <kbd>Esc</kbd> Back';if(s.kind==='complete')return '<kbd>↑↓</kbd> Select   <kbd>Enter</kbd> Accept';if(s.kind==='joystickTest')return '<kbd>↑↓←→</kbd> Move   <kbd>PgUp/PgDn/Home/End</kbd> Buttons   <kbd>Enter</kbd> Continue   <kbd>Esc</kbd> Back';if(s.kind==='welcome')return '<kbd>Enter</kbd> Continue   <kbd>Esc</kbd> Exit';return '<kbd>↑↓</kbd> Select   <kbd>Enter</kbd> Continue   <kbd>Esc</kbd> Back'}
function touchActions(){let s=step();if(s.kind==='audioTest')return state.audioTestState==='completed'?[['enter','Continue'],['replay','Replay'],['esc','Back']]:state.audioTestState==='failed'?[['enter','Retry'],['continue','Continue'],['esc','Back']]:[['enter','Play Test'],['esc','Back']];if(s.kind==='musicTest')return state.musicTestState==='completed'?[['enter','Continue'],['replay','Replay'],['esc','Back']]:state.musicTestState==='failed'?[['enter','Retry'],['continue','Continue'],['esc','Back']]:[['enter','Play Music'],['esc','Back']];if(s.kind==='joystickTest')return [['up','↑'],['down','↓'],['left','←'],['right','→'],['pgup','Button 1'],['pgdn','Button 2'],['enter','Continue'],['esc','Back']];if(s.kind==='welcome')return [['enter','Enter'],['esc','Esc']];if(s.kind==='summary')return [['enter','Save'],['esc','Go Back'],['exit','Exit']];if(s.kind==='complete')return [['enter','Return'],['runagain','Run Again']];if(s.kind==='confirm')return [['up','↑'],['down','↓'],['enter','Accept'],['esc','Back']];if(['audioPort','audioIrq','audioDma'].includes(s.id))return [['up','↑'],['down','↓'],['pgup','PgUp'],['pgdn','PgDn'],['enter','Enter'],['esc','Back']];return [['up','↑'],['down','↓'],['enter','Enter'],['esc','Back']]}
function render(){let s=step();app.innerHTML=`<header class="dos-header"><div class="dos-title">Computer Museum DOS Setup Utility</div><div class="dos-subtitle">Version 1.0 - Educational Software Configuration</div><div>No emulator, VM, real hardware access or file writes</div></header><div class="progress"><span>${progress()}</span><span>${state.dirty?'Configuration changed':'Browser-local configuration'}</span></div><section class="dos-window"><span class="window-title">${s.title}</span><div class="content">${content()}</div></section><footer class="dos-status">${footer()}</footer><section class="touch-controls"><div class="touch-title">Touch Controls</div><div class="touch-grid">${touchActions().map(a=>`<button class="touch-key" data-action="${a[0]}">${a[1]}</button>`).join('')}</div></section>`;bind();app.focus({preventScroll:true})}
function bind(){document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{state.selectedIndex=+b.dataset.choice;render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=e=>{e.preventDefault();perform(b.dataset.action)});document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{setConfig(b.dataset.game,b.dataset.value);render()})}
function perform(a){let s=step();if(s.kind==='save')return;if(a==='up'){if(s.kind==='joystickTest')moveJoy(0,-.2);else changeSelection(-1)}else if(a==='down'){if(s.kind==='joystickTest')moveJoy(0,.2);else changeSelection(1)}else if(a==='left'){if(s.kind==='joystickTest')moveJoy(-.2,0);else changeSelection(-1)}else if(a==='right'){if(s.kind==='joystickTest')moveJoy(.2,0);else changeSelection(1)}else if(a==='home'){if(s.kind==='joystickTest')pressJoy(2);else firstLast(0)}else if(a==='end'){if(s.kind==='joystickTest')pressJoy(3);else firstLast(1)}else if(a==='pgup'){if(s.kind==='joystickTest')pressJoy(0);else changeSelection(-1)}else if(a==='pgdn'){if(s.kind==='joystickTest')pressJoy(1);else changeSelection(1)}else if(a==='enter')accept();else if(a==='replay'){if(s.kind==='audioTest'){resetAudioTest();playDigitalAudio()}else if(s.kind==='musicTest'){resetMusicTest();playMusic()}}else if(a==='continue'){if(s.kind==='audioTest')goto('audioConfirm');else if(s.kind==='musicTest')goto('musicConfirm')}else if(a==='esc')back();else if(a==='exit')location.href=RETURN_URL;else if(a==='runagain'){state.history=[];goto('welcome',false)}else if(a==='f10')f10()}
document.addEventListener('keydown',e=>{const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Enter:'enter',Escape:'esc',Home:'home',End:'end',PageUp:'pgup',PageDown:'pgdn',F10:'f10',r:'replay',R:'replay',c:'continue',C:'continue'};let a=map[e.key];if(!a)return;e.preventDefault();perform(a)});window.addEventListener('gamepadconnected',()=>{state.gamepadActive=true;pollGamepad()});function startSave(){state.saveLines=['Writing SETUP.CFG...'];render();setTimeout(()=>{state.saveLines.push('Writing SOUND.CFG...');render()},450);setTimeout(()=>{saveConfig();state.saveLines.push('Configuration saved successfully.');render()},900);setTimeout(()=>goto('complete'),1400)}const oldGoto=goto;goto=function(id,push=true){oldGoto(id,push);if(id==='save')startSave()};render();
</script></body></html>
