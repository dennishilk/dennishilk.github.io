<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computer Museum DOS Setup Utility</title>
<meta name="description" content="Interactive educational DOS game-style setup utility for the Computer Museum.">
<style>
:root{--bg:#000;--panel:#101010;--gray:#c0c0c0;--white:#fff;--cyan:#00ffff;--yellow:#ffff55;--blue:#0000aa;--shadow:#404040}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050505;color:var(--gray);font-family:"Lucida Console","Courier New",monospace}body{display:grid;place-items:center;padding:clamp(2px,.8vw,8px)}.dos-screen{width:min(1480px,calc(100vw - 8px));height:min(940px,calc(100vh - 8px));min-height:min(620px,100vh);display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;border:3px double var(--gray);background:var(--bg);box-shadow:0 0 0 2px #181818,0 0 36px rgba(0,0,0,.65);outline:2px solid transparent}.dos-screen:focus{outline-color:var(--cyan)}.dos-header{text-align:center;line-height:1.35;padding:10px 12px 8px;border-bottom:2px solid var(--gray)}.dos-title{color:var(--yellow);font-weight:700}.dos-menu{display:flex;flex-wrap:wrap;gap:0 8px;justify-content:center;padding:7px 10px;border-bottom:2px solid var(--gray);color:var(--cyan)}button{font:inherit}.dos-menu button,.dos-row{border:0;cursor:pointer}.dos-menu button{color:var(--cyan);background:transparent;padding:2px 10px}.dos-menu button[aria-selected=true],.dos-row[aria-selected=true],.dialog-option[aria-selected=true],.editor-values .active{color:#000;background:var(--gray)}.dos-main{display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,.38fr);min-height:0}.dos-panel{margin:10px;border:2px solid var(--gray);min-height:0;background:#050505}.panel-title{display:inline-block;position:relative;top:-.75em;left:12px;padding:0 8px;background:#000;color:var(--yellow)}.dos-list{margin-top:-.35em;padding:0 10px 12px}.dos-row{width:100%;display:grid;grid-template-columns:minmax(170px,1fr) minmax(150px,.55fr);gap:18px;padding:5px 8px;color:var(--white);background:transparent;text-align:left}.value{text-align:right;color:inherit}.dos-help-panel{color:var(--gray);line-height:1.45}.dos-help-panel strong{color:var(--cyan);font-weight:400}.dos-status,.touch-controls{border-top:2px solid var(--gray);background:#111}.dos-status{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 18px;padding:8px 10px;color:var(--white)}kbd{color:var(--cyan);font:inherit}.key-command,.dialog-command{font:inherit;color:inherit;background:transparent;border:0;padding:4px 6px;min-height:32px;cursor:pointer}.touch-controls{display:none}.touch-title{font-size:.76rem;text-align:center;margin:6px}.touch-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}.touch-key{min-width:48px;min-height:44px;padding:7px 10px;border:1px solid var(--gray);background:#000;color:#fff;box-shadow:2px 2px 0 var(--shadow);cursor:pointer}.dialog-backdrop{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);padding:20px}.dialog{width:min(540px,100%);border:3px double var(--gray);background:#000;color:#fff;padding:20px 22px;text-align:center;box-shadow:12px 12px 0 var(--shadow)}.dialog h2{margin:0 0 14px;color:var(--yellow);font-size:1.1rem}.dialog-options{display:grid;gap:6px;justify-content:center;margin:16px 0}.dialog-option{font:inherit;border:0;background:transparent;cursor:pointer;min-width:210px;padding:8px 18px;color:#fff}.editor-values{font-size:1.2rem;margin:18px 0}.editor-values span{display:inline-block;padding:2px 8px}.dialog p{line-height:1.45}.dialog-keys{margin-top:18px;color:var(--gray)}.launch-screen{background:#000;color:#c0c0c0;width:100%;height:100%;padding:26px;line-height:1.55;white-space:pre-line}.launch-screen strong{color:#ffff55;font-weight:400}@media(max-width:760px){body{padding:0}.dos-screen{width:100%;height:100%;min-height:100%;border-width:2px}.dos-main{grid-template-columns:1fr}.dos-help-panel{display:none}.dos-header{font-size:.82rem}.dos-menu{justify-content:flex-start;overflow:hidden;font-size:.76rem}.dos-row{grid-template-columns:1fr;gap:0;font-size:.84rem}.value{text-align:left;color:var(--cyan)}.dos-status{font-size:.74rem;gap:5px 8px}.dos-status .key-command{display:none}.touch-controls{display:block;padding:8px 8px 10px}.touch-key{flex:1 0 56px;max-width:96px}.dialog{max-height:calc(100vh - 24px);overflow:auto;box-shadow:6px 6px 0 var(--shadow)}}
</style></head><body><main id="dosApp" class="dos-screen" tabindex="0" role="application" aria-label="Computer Museum DOS Setup Utility"></main><script>
const STORAGE_KEY='computerMuseumDOSSetup.v1',RETURN_URL='/museum/dos-setup/';
const values=(...a)=>a.map(v=>[v,v]); const bool=values('Enabled','Disabled');
const defaults={digitalAudio:'Sound Blaster 16',music:'General MIDI',port:'220h',irq:'5',dma:'1',midiPort:'330h',joystick:'Enabled',joystickType:'4 Button',mouse:'Enabled',display:'SVGA',screenMode:'Fullscreen',vesa:'Enabled',conventionalMemory:'640 KB',extendedMemory:'8192 KB',ems:'Enabled',xms:'Enabled',difficulty:'Normal',subtitles:'Enabled',demoPlayback:'Enabled',violence:'Animated',language:'English'};
const allowed={digitalAudio:['Sound Blaster 16','Sound Blaster Pro','AdLib','Gravis Ultrasound','PC Speaker','No Digital Audio'],music:['General MIDI','Roland MT-32','Sound Blaster','AdLib','PC Speaker','No Music'],port:['220h','240h','260h','280h'],irq:['2','5','7','10'],dma:['0','1','3','5'],midiPort:['300h','330h','Disabled'],joystick:['Enabled','Disabled'],joystickType:['2 Button','4 Button','Flightstick'],mouse:['Enabled','Disabled'],display:['VGA','SVGA','VESA'],screenMode:['Fullscreen','Windowed'],vesa:['Enabled','Disabled'],conventionalMemory:['560 KB','600 KB','640 KB'],extendedMemory:['4096 KB','8192 KB','16384 KB'],ems:['Enabled','Disabled'],xms:['Enabled','Disabled'],difficulty:['Easy','Normal','Hard','Museum Guide'],subtitles:['Enabled','Disabled'],demoPlayback:['Enabled','Disabled'],violence:['Off','Animated','Full'],language:['English','Deutsch','Français','Español']};
let cfg=load(),saved=JSON.parse(JSON.stringify(cfg)); const st={menu:0,row:0,dirty:false,dialog:null,sel:0,launching:false}; const app=document.getElementById('dosApp');
function load(){let c={...defaults};try{const s=localStorage.getItem(STORAGE_KEY);if(s)c={...c,...JSON.parse(s)}}catch(e){console.warn('Unable to load DOS setup configuration.',e)}Object.keys(allowed).forEach(k=>{if(!allowed[k].includes(c[k]))c[k]=defaults[k]});return c}
const edit={};Object.keys(allowed).forEach(k=>edit[k]={type:'choice',key:k,choices:values(...allowed[k])});
function menus(){return[{id:'audio',label:'Digital Audio',rows:[['Digital Audio','digitalAudio'],['Port','port'],['IRQ','irq'],['DMA','dma'],['Test Digital Audio','testAudio']]},{id:'music',label:'Music',rows:[['Music Device','music'],['MIDI Port','midiPort'],['Test Music','testMusic'],['Test MIDI','testMidi']]},{id:'input',label:'Input Devices',rows:[['Joystick','joystick'],['Joystick Type','joystickType'],['Mouse','mouse'],['Test Joystick','testJoystick']]},{id:'display',label:'Display',rows:[['Display Driver','display'],['Screen Mode','screenMode'],['VESA Support','vesa']]},{id:'memory',label:'Memory',rows:[['Conventional Memory','conventionalMemory'],['Extended Memory','extendedMemory'],['EMS','ems'],['XMS','xms']]},{id:'game',label:'Game Options',rows:[['Difficulty','difficulty'],['Subtitles','subtitles'],['Demo Playback','demoPlayback'],['Violence','violence'],['Language','language']]},{id:'save',label:'Save Configuration',rows:[['Save Configuration','save'],['Exit','exit']]}]}
const help={digitalAudio:'Choose the virtual digital sound device a DOS game might use for effects.',music:'Choose a music synthesizer target such as General MIDI, MT-32 or FM sound.',port:'I/O base address for Sound Blaster-compatible cards. 220h was a familiar default.',irq:'Interrupt request line used by the virtual sound card.',dma:'DMA channel for sampled audio transfer.',midiPort:'MPU-401 style MIDI port used by external synthesizers.',joystick:'Enables the browser-local joystick option.',joystickType:'Selects a simple period-inspired joystick profile.',mouse:'Enables mouse support for software that offered it.',display:'Chooses a period display driver family.',screenMode:'Stores a software fullscreen/windowed preference in localStorage.',vesa:'Enables VESA-style high-resolution compatibility mode.',conventionalMemory:'Shows the conventional memory target below 1 MB.',extendedMemory:'Sets fictional extended memory available to the configured software.',ems:'Enables Expanded Memory Specification support.',xms:'Enables Extended Memory Specification support.',difficulty:'Stores the museum game difficulty preference.',subtitles:'Toggles subtitles for future museum-created demonstrations.',demoPlayback:'Controls attract-mode demo playback.',violence:'Stores a content display preference often seen in 1990s setup menus.',language:'Selects the interface language preference.',save:'Write this configuration to browser localStorage only.',exit:'Return to the DOS Setup Utility information page.',testAudio:'Future test: this will play original museum-created digital audio.',testMusic:'Future test: this will play original museum-created music.',testMidi:'Future test: this will exercise the virtual MIDI selection.',testJoystick:'Future test: this will read browser-local input only.'};
function keyFor(label){const map={'Digital Audio':'digitalAudio','Music Device':'music','Port':'port','IRQ':'irq','DMA':'dma','MIDI Port':'midiPort','Joystick':'joystick','Joystick Type':'joystickType','Mouse':'mouse','Display Driver':'display','Screen Mode':'screenMode','VESA Support':'vesa','Conventional Memory':'conventionalMemory','Extended Memory':'extendedMemory','EMS':'ems','XMS':'xms','Difficulty':'difficulty','Subtitles':'subtitles','Demo Playback':'demoPlayback','Violence':'violence','Language':'language','Save Configuration':'save','Exit':'exit','Test Digital Audio':'testAudio','Test Music':'testMusic','Test MIDI':'testMidi','Test Joystick':'testJoystick'};return map[label]}
function current(){return menus()[st.menu].rows[st.row]} function val(row){return cfg[row[1]]||'Press Enter'} function mark(){st.dirty=JSON.stringify(cfg)!==JSON.stringify(saved)} function setMenu(i){st.menu=(i+menus().length)%menus().length;st.row=0;render()} function setRow(i){let r=menus()[st.menu].rows;st.row=(i+r.length)%r.length;render()}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(cfg));saved=JSON.parse(JSON.stringify(cfg));st.dirty=false;render()} function exit(){location.href=RETURN_URL}
function openEditor(){let r=current(),k=r[1]; if(k==='save')return openDialog('save'); if(k==='exit')return openDialog('exit'); if(k.startsWith('test'))return openDialog(k); let e=edit[k]; if(!e)return; st.dialog='editor'; st.sel=Math.max(0,e.choices.findIndex(c=>c[1]===cfg[k])); render()} function openDialog(d){st.dialog=d;st.sel=d==='exit'?1:0;render()} function cancel(){st.dialog=null;render()} function accept(){if(st.dialog==='editor'){let k=current()[1],e=edit[k];cfg[k]=e.choices[st.sel][1];st.dialog=null;mark();render()}else if(st.dialog==='save'){if(st.sel===0){save();launch()}else cancel()}else if(st.dialog==='exit'){if(st.sel===0){cfg=JSON.parse(JSON.stringify(saved));exit()}else cancel()}else cancel()} function launch(){st.launching=true;renderLaunch(['Writing SETUP.CFG to browser localStorage...','Verifying virtual configuration...','Done.']);setTimeout(()=>renderLaunch(['<strong>Computer Museum DOS Setup Utility</strong>','','Configuration saved for this browser visitor.','','No real DOS files were written.','No hardware settings were changed.','','Returning to exhibit page...']),600);setTimeout(exit,2200)}
function cycle(d){let k=current()[1],e=edit[k]; if(!e)return; let i=e.choices.findIndex(c=>c[1]===cfg[k]); cfg[k]=e.choices[(i+d+e.choices.length)%e.choices.length][1];mark();render()} function dialogHtml(){if(!st.dialog)return''; if(st.dialog==='editor'){let k=current()[1],e=edit[k];return `<div class="dialog-backdrop"><section class="dialog" role="dialog" aria-modal="true"><h2>${current()[0]}</h2><div class="dialog-options">${e.choices.map((c,i)=>`<button class="dialog-option" data-dialog-choice="${i}" aria-selected="${st.sel===i}">${c[0]}</button>`).join('')}</div><p class="dialog-keys"><button class="dialog-command" data-action="pgup">PgUp Previous</button> <button class="dialog-command" data-action="pgdn">PgDn Next</button><br><button class="dialog-command" data-action="enter">Enter Accept</button> <button class="dialog-command" data-action="esc">Esc Cancel</button></p></section></div>`} let title=st.dialog==='save'?'Save Configuration?':st.dialog==='exit'?'Exit Setup?':'Test Action'; let msg=st.dialog.startsWith('test')?'This Phase 1 placeholder is wired to the selected setting and reserved for original museum-created browser sound/input tests in a later phase.':st.dialog==='save'?'Save this browser-local DOS software configuration?':'Discard unsaved changes and return to the exhibit page?'; return `<div class="dialog-backdrop"><section class="dialog" role="dialog" aria-modal="true"><h2>${title}</h2><p>${msg}</p><div class="dialog-options"><button class="dialog-option" data-dialog-choice="0" aria-selected="${st.sel===0}">Yes</button><button class="dialog-option" data-dialog-choice="1" aria-selected="${st.sel===1}">No</button></div><p class="dialog-keys"><button class="dialog-command" data-action="enter">Enter Accept</button> <button class="dialog-command" data-action="esc">Esc Cancel</button></p></section></div>`}
function render(){if(st.launching)return;let m=menus()[st.menu],r=current(),k=keyFor(r[0]);app.innerHTML=`<header class="dos-header"><div class="dos-title">Computer Museum DOS Setup Utility</div><div>Version 1.0 - Browser-local educational recreation</div><div>No DOS, emulator, game executable or original installer is running</div></header><nav class="dos-menu" role="tablist">${menus().map((x,i)=>`<button role="tab" aria-selected="${i===st.menu}" data-menu="${i}">${x.label}</button>`).join('')}</nav><section class="dos-main"><div class="dos-panel" role="listbox"><span class="panel-title">${m.label}</span><div class="dos-list">${m.rows.map((x,i)=>`<button class="dos-row" role="option" aria-selected="${i===st.row}" data-row="${i}"><span>${x[0]}</span><span class="value">${val(x)}</span></button>`).join('')}</div></div><aside class="dos-panel dos-help-panel"><span class="panel-title">Help</span><div class="dos-list"><strong>${r[0]}</strong><br><br>${help[k]}</div></aside></section><footer class="dos-status">${[['up','↑↓','Select'],['left','←→','Menu'],['enter','Enter','Edit/Run'],['esc','Esc','Exit'],['f10','F10','Save']].map(x=>`<button class="key-command" data-action="${x[0]}"><kbd>${x[1]}</kbd> ${x[2]}</button>`).join('')}<span>${st.dirty?'Changes Not Saved':'Configuration Saved'}</span></footer><section class="touch-controls"><div class="touch-title">Touch Controls</div><div class="touch-grid">${[['up','↑'],['down','↓'],['left','←'],['right','→'],['enter','Enter'],['esc','Esc'],['f10','F10'],['pgup','PgUp'],['pgdn','PgDn'],['home','Home'],['end','End']].map(x=>`<button class="touch-key" data-action="${x[0]}"><kbd>${x[1]}</kbd></button>`).join('')}</div></section>${dialogHtml()}`;bind();app.focus({preventScroll:true})}
function renderLaunch(lines){app.innerHTML=`<section class="launch-screen">${lines.join('<br>')}</section>`} function perform(a){if(st.dialog){if(a==='esc')return cancel(); if(a==='enter')return accept(); if(a==='up'||a==='pgup') {st.sel=(st.sel-1+document.querySelectorAll('[data-dialog-choice]').length)%document.querySelectorAll('[data-dialog-choice]').length;return render()} if(a==='down'||a==='pgdn'){st.sel=(st.sel+1)%document.querySelectorAll('[data-dialog-choice]').length;return render()} return} if(a==='up')setRow(st.row-1);else if(a==='down')setRow(st.row+1);else if(a==='left')setMenu(st.menu-1);else if(a==='right')setMenu(st.menu+1);else if(a==='home')setRow(0);else if(a==='end')setRow(menus()[st.menu].rows.length-1);else if(a==='enter')openEditor();else if(a==='esc')openDialog('exit');else if(a==='f10')openDialog('save');else if(a==='pgup')cycle(-1);else if(a==='pgdn')cycle(1)}
function bind(){document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>setMenu(+b.dataset.menu));document.querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>{st.row=+b.dataset.row;openEditor()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=e=>{e.preventDefault();perform(b.dataset.action)});document.querySelectorAll('[data-dialog-choice]').forEach(b=>b.onclick=()=>{st.sel=+b.dataset.dialogChoice; if(st.dialog==='editor')render()})}document.addEventListener('keydown',e=>{const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Enter:'enter',Escape:'esc',Home:'home',End:'end',PageUp:'pgup',PageDown:'pgdn',F10:'f10'};let a=map[e.key];if(!a)return;e.preventDefault();perform(a)});render();
</script></body></html>
