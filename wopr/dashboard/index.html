<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>WOPR Dashboard – Incoming Transmissions</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="stylesheet" href="/wopr/wopr.css?v=2" />
  <script defer src="/wopr/dashboard/transmissions.js?v=1"></script>
</head>
<body>
  <main class="wopr-shell">
    <section class="wopr-terminal">
      <div class="wopr-statusbar">
        <span>WOPR<br />War Operation Plan Response</span>
        <span class="status-online">STRATEGIC COMPUTING SYSTEM</span>
        <span>AUTHORIZED TERMINAL ACCESS</span>
      </div>
      <div class="wopr-screen">
        <a class="wopr-back-link" href="/museum/wopr/">← RETURN TO COMPUTER MUSEUM</a>

        <header class="wopr-header">
          <p class="kicker">SECURE SESSION</p>
          <h1>WOPR OBSERVER WORKSHOP</h1>
          <p class="classification">AUTHENTICATED OPERATIONS · PUBLICATION QUEUE</p>
        </header>

        <section class="staging-preview transmissions-ops" aria-labelledby="incoming-title">
          <div class="ops-card">
            <div>
              <h2 id="incoming-title">INCOMING TRANSMISSIONS</h2>
              <p><strong id="pending-count">0</strong> PENDING</p>
            </div>
            <button type="button" class="secondary-button" id="review-button">REVIEW</button>
          </div>
          <p id="review-status" class="auth-message">AWAITING QUEUE STATUS.</p>

          <div id="review-panel" class="review-panel" hidden>
            <h2>REVIEW QUEUE</h2>
            <div id="pending-list" class="pending-list" aria-live="polite"></div>
          </div>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
