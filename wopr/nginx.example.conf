# Example only. Copy to worldnode and adapt paths/upstreams there.
# No secrets belong in this repository.

# Optional anonymous counters/rate limiting. Keep logs minimal and never log request bodies.
limit_req_zone $binary_remote_addr zone=wopr_login:10m rate=6r/m;

server {
    server_name dennishilk.com www.dennishilk.com;
    root /srv/www/dennishilk.github.io;

    # Public WOPR terminal login and static assets. Visitors may see this page.
    location = /wopr/ { add_header X-Robots-Tag "noindex, nofollow, noarchive" always; try_files /wopr/index.html =404; }
    location = /wopr/index.html { add_header X-Robots-Tag "noindex, nofollow, noarchive" always; try_files $uri =404; }
    location = /wopr/wopr.css { try_files $uri =404; }
    location = /wopr/wopr.js { try_files $uri =404; }

    # Login endpoint implemented by server/wopr-auth/server.js.
    # Backend requirements:
    # - reads credentials and session secret only from /etc/wopr/wopr-auth.env
    # - verifies credentials without logging password values
    # - on success, sets Secure; HttpOnly; SameSite=Strict session cookie
    # - on failure, returns 401 and increments only anonymous in-memory counters
    location = /wopr/auth/login {
        limit_req zone=wopr_login burst=4 nodelay;
        proxy_pass http://127.0.0.1:8787/wopr/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering on;
    }

    # Optional logout endpoint. Clears the session cookie.
    location = /wopr/auth/logout {
        proxy_pass http://127.0.0.1:8787/wopr/auth/logout;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Optional aggregate-only event endpoint. It ignores credential values.
    location = /wopr/auth/event {
        proxy_pass http://127.0.0.1:8787/wopr/auth/event;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Internal auth check. The backend returns 204 for a valid session and 401 otherwise.
    location = /_wopr_session_check {
        internal;
        proxy_pass http://127.0.0.1:8787/wopr/auth/session;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    # All remaining /wopr/ paths are private, including /wopr/dashboard/ and future modules.
    location ^~ /wopr/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        auth_request /_wopr_session_check;
        error_page 401 403 =302 /wopr/;
        try_files $uri $uri/ =404;
    }
}
