<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nebunix Background Preview</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        height: 100%;
        font-family: Arial, sans-serif;
        color: #fff;
        display:flex;
        align-items:center;
        justify-content:center;
    }

    /* Layer 1: Galactic Nebula Gradient */
    #nebula {
        position: fixed;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle at 60% 40%, #004e92, transparent 60%),
                    radial-gradient(circle at 30% 70%, #00c6ff55, transparent 70%),
                    radial-gradient(circle at 80% 80%, #00356b55, transparent 60%);
        filter: blur(35px);
        animation: nebulaMove 25s ease-in-out infinite alternate;
        z-index: -3;
    }

    @keyframes nebulaMove {
        0% { transform: translate(0px,0px) scale(1); }
        100% { transform: translate(-60px,40px) scale(1.1); }
    }

    /* Layer 2: NixOS fractal mesh (SVG overlay) */
    #fractal {
        position: fixed;
        width: 100vw;
        height: 100vh;
        background-image: url('data:image/svg+xml;utf8,\
        <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" opacity="0.23">\
            <defs>\
                <pattern id="hex" width="80" height="69" patternUnits="userSpaceOnUse">\
                    <polygon points="40,0 80,20 80,49 40,69 0,49 0,20" \
                    stroke="%2300b4ff55" fill="none" stroke-width="1" />\
                </pattern>\
            </defs>\
            <rect width="100%" height="100%" fill="url(%23hex)" />\
        </svg>');
        animation: fractalFloat 40s linear infinite;
        z-index: -2;
    }

    @keyframes fractalFloat {
        0% { transform: translate(0,0); }
        100% { transform: translate(150px,200px); }
    }

    /* Layer 3: Starfield (tiny, subtle) */
    #stars {
        position: fixed;
        width: 100%;
        height: 100%;
        background: transparent;
        z-index: -1;
    }

    /* Demo Content */
    .title-box {
        text-align:center;
        background: rgba(0,0,0,0.45);
        padding: 25px 40px;
        border-radius: 14px;
        backdrop-filter: blur(6px);
        border: 1px solid #00b4ff55;
        box-shadow: 0 0 25px #00b4ff44;
    }
    .title-box h1 {
        color: #00c6ff;
        margin-bottom: 10px;
        font-size: 2rem;
    }
</style>
</head>
<body>

<div id="nebula"></div>
<div id="fractal"></div>
<canvas id="stars"></canvas>

<div class="title-box">
    <h1>Nebunix OS Background Preview</h1>
    <p>Galactic Nebula + NixOS Fractal Mesh</p>
</div>

<script>
/* Subtle starfield */
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

let stars = [];
for (let i=0; i<130; i++){
    stars.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        r: Math.random()*1.3,
        s: Math.random()*0.6 + 0.2
    });
}

function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "#00c6ff";

    stars.forEach(star=>{
        ctx.globalAlpha = Math.random();
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI*2);
        ctx.fill();

        star.y += star.s;
        if(star.y > canvas.height) {
            star.y = 0;
            star.x = Math.random()*canvas.width;
        }
    });

    requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
