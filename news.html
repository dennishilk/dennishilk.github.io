<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ⭐ Canonical URL -->
  <link rel="canonical" href="https://dennishilk.com/news.html">

  <!-- ⭐ SEO Title -->
  <title>Linux News – Latest Updates by Dennis Hilk | Phoronix + OMG!Ubuntu Feed</title>

  <!-- ⭐ Meta Description (SEO Boost) -->
  <meta name="description" content="Latest Linux news automatically fetched from Phoronix and OMG!Ubuntu. Updated daily. Curated by Linux developer Dennis Hilk – creator of NixOS Toolkit, Nebunix OS and Project Maxwell.">

  <!-- ⭐ SEO Keywords -->
  <meta name="keywords" content="Linux News, Phoronix, OMGUbuntu, Kernel, Open Source, Ubuntu, Arch, NixOS, Debian, XFCE, Updates, Dennis Hilk, Nebunix, Linux Developer">

  <!-- OpenGraph (Discord / Reddit / Facebook) -->
  <meta property="og:title" content="Linux News – Daily Updates by Dennis Hilk">
  <meta property="og:description" content="Live Linux news feed from Phoronix and OMG!Ubuntu. Curated by open-source developer Dennis Hilk.">
  <meta property="og:image" content="https://dennishilk.com/avatar.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://dennishilk.com/news.html">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Linux News – Curated by Dennis Hilk">
  <meta name="twitter:description" content="Daily Linux news from Phoronix & OMG!Ubuntu – via Nebunix News Terminal.">
  <meta name="twitter:image" content="https://dennishilk.com/avatar.png">

  <!-- 🧠 JSON-LD Structured Data (Google) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "name": "Linux News – Latest Updates",
    "description": "Latest Linux updates automatically fetched from Phoronix and OMG!Ubuntu.",
    "url": "https://dennishilk.github.io/news.html",
    "creator": {
      "@type": "Person",
      "name": "Dennis Hilk",
      "url": "https://dennishilk.github.io",
      "image": "https://dennishilk.github.io/avatar.png"
    }
  }
  </script>

  <!-- 🐧 Favicon & Styles -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css?v=23">

  <script defer src="stars.js"></script>
  <script src="https://kit.fontawesome.com/a4e1d5c0d4.js" crossorigin="anonymous"></script>
</head>

<body>
  <canvas id="stars"></canvas>

  <div class="content">
    <!-- ── Header ───────────────────────────── -->
    <header>
      <img src="avatar.png" alt="Dennis Hilk Avatar" class="avatar">
      <h1><span class="prompt">root@nebunix:~$</span> Linux News<span class="cursor">|</span></h1>
      <p>Latest Linux updates automatically fetched from Phoronix & OMG!Ubuntu</p>

      <div class="buttons">
        <a href="/">Home</a>
        <a href="/world-observer.html">World Observer</a>
        <a href="/museum/">Computer Museum</a>
        <a href="/news.html"><i class="fas fa-newspaper"></i> News</a>
      </div>
    </header>

    <!-- ── News Section ─────────────────────── -->
    <section class="projects">
      <h2>Fresh from the Penguin World 🐧</h2>
      <div id="loading-line">
        <span class="prompt">user@linux:~$</span> Fetching latest Linux News<span class="cursor">|</span>
      </div>
      <div id="news-list" class="cards news-feed"></div>
    </section>

    <!-- ── Footer ───────────────────────────── -->
    <footer>
      <div class="nebby-terminal-line">
        <img src="nebby.png" alt="Nebby – the Space Penguin Mascot" class="nebby" />
        <span class="coffee-text">&gt; tail -f /var/news/linux<span class="cursor">|</span></span>
      </div>
      <p>© 2025 Dennis Hilk —
        <a href="/impressum.html">Impressum</a> und
        <a href="/datenschutzerklaerung.html">Datenschutz</a>
      </p>
    </footer>
  </div>

  <script>
    async function loadNews() {
      const feeds = [
        "https://www.phoronix.com/rss.php",
        "https://www.omgubuntu.co.uk/feed"
      ];
      const list = document.getElementById("news-list");
      const loading = document.getElementById("loading-line");

      for (const url of feeds) {
        try {
          const response = await fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(url));
          const data = await response.json();

          data.items.slice(0, 5).forEach(item => {
            const date = new Date(item.pubDate);
            const formattedDate = date.toLocaleDateString("en-GB", {
              day: "2-digit",
              month: "short",
              year: "numeric"
            });

            const card = document.createElement("a");
            card.href = item.link;
            card.target = "_blank";
            card.className = "card";

            card.innerHTML = `
              <i class="fa-solid fa-terminal fa-2x"></i>
              <h3>${item.title}</h3>
              <p>${item.description ? item.description.replace(/<[^>]*>/g, '').substring(0, 160) + '…' : ''}</p>
              <div class="news-meta">
                <span class="source-badge">${new URL(item.link).hostname.replace('www.','')}</span>
                <span class="news-date">${formattedDate}</span>
              </div>
            `;
            list.appendChild(card);
          });
        } catch (e) {
          console.error("Feed Error", e);
        }
      }

      loading.style.display = "none";
    }

    loadNews();
  </script>
</body>
</html>
