<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linux News – Dennis Hilk</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css?v=17">
  <script defer src="stars.js"></script>
  <script src="https://kit.fontawesome.com/a4e1d5c0d4.js" crossorigin="anonymous"></script>
</head>

<body>
  <canvas id="stars"></canvas>

  <div class="content">
    <!-- ── Header ───────────────────────────── -->
    <header>
      <img src="avatar.png" alt="Dennis Hilk Avatar" class="avatar">
      <h1><span class="prompt">root@nebunix:~$</span> Linux News<span class="cursor">|</span></h1>
      <p>Latest Linux updates automatically fetched from Phoronix & OMG!Ubuntu</p>
      <div class="buttons">
        <a href="index.html"><i class="fas fa-arrow-left"></i> Back</a>
      </div>
    </header>

    <!-- ── News Section ─────────────────────── -->
    <section class="projects">
      <h2>Fresh from the Penguin World 🐧</h2>
      <div id="loading-line">
        <span class="prompt">user@linux:~$</span> Fetching latest Linux News<span class="cursor">|</span>
      </div>
      <div id="news-list" class="cards news-feed"></div>
    </section>

    <!-- ── Footer ───────────────────────────── -->
    <footer>
      <div class="nebby-terminal-line">
        <img src="nebby.png" alt="Nebby the Space Penguin Mascot" class="nebby" />
        <span class="coffee-text">&gt; tail -f /var/news/linux<span class="cursor">|</span></span>
      </div>
      <p>© 2025 Dennis Hilk —
        <a href="/impressum.html">Impressum</a> und
        <a href="/datenschutzerklaerung.html">Datenschutz</a>
      </p>
      <div id="visitor-counter">Visitors since 2025: <span id="count">...</span></div>
    </footer>
  </div>

  <script>
    async function loadNews() {
      // Nur Phoronix & OMG!Ubuntu
      const feeds = [
        "https://www.phoronix.com/rss.php",
        "https://www.omgubuntu.co.uk/feed"
      ];
      const list = document.getElementById("news-list");
      const loading = document.getElementById("loading-line");

      for (const url of feeds) {
        try {
          const res = await fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(url));
          const data = await res.json();

          data.items.slice(0, 3).forEach(item => {
            const card = document.createElement("a");
            card.href = item.link;
            card.target = "_blank";
            card.className = "card news-card";

            // Bildquelle bestimmen oder Tux-Fallback
            const imgSrc = item.enclosure && item.enclosure.link
              ? item.enclosure.link
              : "https://upload.wikimedia.org/wikipedia/commons/3/35/Tux.svg";

            card.innerHTML = `
              <img src="${imgSrc}" alt="News Image">
              <h3>${item.title}</h3>
              <p>${item.description ? item.description.replace(/<[^>]*>/g, '').substring(0, 140) + '…' : ''}</p>
              <span class="source-badge">${new URL(item.link).hostname.replace('www.','')}</span>
            `;
            list.appendChild(card);
          });
        } catch (err) {
          console.error("Feed Error:", err);
        }
      }
      loading.style.display = "none";
    }
    loadNews();

    // Lokaler Retro-Counter (wie Startseite)
    function updateCounter() {
      const el = document.getElementById("count");
      let count = localStorage.getItem("visitorCount");
      if (!count) count = Math.floor(Math.random() * 900) + 100;
      count++;
      localStorage.setItem("visitorCount", count);
      el.textContent = count.toString().padStart(6, '0');
    }
    updateCounter();
  </script>
</body>
</html>
