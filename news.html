<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linux News – Dennis Hilk</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css?v=20">
  <script defer src="stars.js"></script>
  <script src="https://kit.fontawesome.com/a4e1d5c0d4.js" crossorigin="anonymous"></script>
</head>

<body>
  <canvas id="stars"></canvas>

  <div class="content">
    <header>
      <img src="avatar.png" alt="Dennis Hilk Avatar" class="avatar">
      <h1><span class="prompt">root@nebunix:~$</span> Linux News<span class="cursor">|</span></h1>
      <p>Latest Linux updates automatically fetched from Phoronix & OMG!Ubuntu</p>
      <div class="buttons">
        <a href="index.html"><i class="fas fa-arrow-left"></i> Back</a>
      </div>
    </header>

    <section class="projects">
      <h2>Fresh from the Penguin World 🐧</h2>
      <div id="loading-line">
        <span class="prompt">user@linux:~$</span> Fetching latest Linux News<span class="cursor">|</span>
      </div>
      <div id="news-list" class="cards news-feed"></div>
    </section>

    <footer>
      <div class="nebby-terminal-line">
        <img src="nebby.png" alt="Nebby – the Space Penguin Mascot" class="nebby" />
        <span class="coffee-text">&gt; tail -f /var/news/linux<span class="cursor">|</span></span>
      </div>
      <p>© 2025 Dennis Hilk —
        <a href="/impressum.html">Impressum</a> und
        <a href="/datenschutzerklaerung.html">Datenschutz</a>
      </p>
    </footer>
  </div>

  <!-- ── Terminal Popup ───────────────────────────── -->
  <div id="terminal-popup" class="terminal-hidden">
    <div class="terminal-window">
      <div class="terminal-header">
        <span class="red"></span><span class="yellow"></span><span class="green"></span>
        <span class="term-title">/var/news/article.txt</span>
        <button id="close-term">❌</button>
      </div>
      <div id="terminal-content" class="terminal-content">
        <p>Loading article...</p>
      </div>
    </div>
  </div>

  <script>
    async function loadNews() {
      const feeds = [
        "https://www.phoronix.com/rss.php",
        "https://www.omgubuntu.co.uk/feed"
      ];
      const list = document.getElementById("news-list");
      const loading = document.getElementById("loading-line");

      for (const url of feeds) {
        try {
          const res = await fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(url));
          const data = await res.json();

          data.items.slice(0, 4).forEach(item => {
            const card = document.createElement("div");
            card.className = "card news-card";
            card.innerHTML = `
              <h3>${item.title}</h3>
              <p>${item.description ? item.description.replace(/<[^>]*>/g, '').substring(0, 160) + '…' : ''}</p>
              <span class="source-badge">${new URL(item.link).hostname.replace('www.','')}</span>
            `;
            card.addEventListener("click", () => openTerminal(item.title, item.link));
            list.appendChild(card);
          });
        } catch (err) {
          console.error("Feed Error:", err);
        }
      }
      loading.style.display = "none";
    }

    // ── Terminal Popup Logic ─────────────────────────
    const popup = document.getElementById("terminal-popup");
    const content = document.getElementById("terminal-content");
    const closeBtn = document.getElementById("close-term");

    async function typePrompt(text, element, delay = 70) {
      element.innerHTML = "";
      for (let i = 0; i < text.length; i++) {
        element.innerHTML += text[i];
        await new Promise(r => setTimeout(r, delay));
      }
    }

    async function openTerminal(title, link) {
      popup.classList.remove("terminal-hidden");
      content.innerHTML = `<p class="prompt" id="typePrompt"></p>`;

      const promptEl = document.getElementById("typePrompt");
      await typePrompt("user@nebunix:~$ cat article.txt_", promptEl, 60);

      setTimeout(() => {
        content.innerHTML += `
          <p><span class="accent">${title}</span></p>
          <p><a href="${link}" target="_blank" class="term-link">[ Read full article on source → ]</a></p>
        `;
      }, 400);
    }

    closeBtn.addEventListener("click", () => popup.classList.add("terminal-hidden"));

    loadNews();
  </script>
</body>
</html>
