<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540"><rect width="1200" height="540" fill="#111b14"/><text x="45" y="55" font-size="30" fill="#e4e5d7" font-family="Arial, sans-serif">HOW TO READ THE RECONSTRUCTION</text><rect x="45" y="95" width="1110" height="98" rx="5" fill="#26352a" stroke="#bdd3b0"/><text x="70" y="160" font-size="45" fill="#bdd3b0" font-family="Arial, sans-serif">D</text><text x="160" y="135" font-size="28" fill="#bdd3b0" font-family="Arial, sans-serif">Documented</text><text x="160" y="171" font-size="22" fill="#e4e5d7" font-family="Arial, sans-serif">A source supports an event or statement.</text><rect x="45" y="215" width="1110" height="98" rx="5" fill="#26352a" stroke="#e5c68d"/><text x="70" y="280" font-size="45" fill="#e5c68d" font-family="Arial, sans-serif">R</text><text x="160" y="255" font-size="28" fill="#e5c68d" font-family="Arial, sans-serif">Reconstructed</text><text x="160" y="291" font-size="22" fill="#e4e5d7" font-family="Arial, sans-serif">An inferred state or interpreted arrangement.</text><rect x="45" y="335" width="1110" height="98" rx="5" fill="#26352a" stroke="#abd1cf"/><text x="70" y="400" font-size="45" fill="#abd1cf" font-family="Arial, sans-serif">S</text><text x="160" y="375" font-size="28" fill="#abd1cf" font-family="Arial, sans-serif">Schematic</text><text x="160" y="411" font-size="22" fill="#e4e5d7" font-family="Arial, sans-serif">An explanation, not recovered telemetry.</text><text x="45" y="500" font-size="22" fill="#c6d0ba" font-family="Arial, sans-serif">A documented time does not turn its accompanying drawing into a measurement.</text></svg>