<svg xmlns="http://www.w3.org/2000/svg" width="620" height="960" viewBox="0 0 620 960" role="img" aria-labelledby="title desc"><title id="title">Schematic: regular server replaced by GSSAPI; unguarded purge risks shared configuration.</title><desc id="desc">Schematic: regular server replaced by GSSAPI; unguarded purge risks shared configuration.</desc><rect width="620" height="960" rx="18" fill="#0b1017"/><g font-family="DejaVu Sans,sans-serif"><text x="30" y="43" font-size="23" fill="#76d2fa" font-family="DejaVu Sans Mono,monospace">UBUNTU 26.10 / OPENSSH</text><text x="30" y="91" font-size="34" fill="#e9eef5">The package transition</text><text x="30" y="131" font-size="25" fill="#a9b7c8">Example: regular → GSSAPI</text><rect x="26" y="165" width="568" height="170" rx="16" fill="#121b26" stroke="#29394b" stroke-width="2"/><text x="48" y="207" font-size="24" fill="#76d2fa" font-family="DejaVu Sans Mono,monospace">01 / BEFORE</text><rect x="50" y="237" width="62" height="47" rx="16" fill="#101823" stroke="#93dfc1" stroke-width="2"/><text x="62" y="271" font-size="30" fill="#93dfc1" font-family="DejaVu Sans Mono,monospace">ii</text><text x="132" y="271" font-size="30" fill="#e9eef5" font-family="DejaVu Sans Mono,monospace">openssh-server</text><path d="M310 352v44m-12-14 12 14 12-14" stroke="#76d2fa" stroke-width="3" fill="none"/><rect x="26" y="418" width="568" height="240" rx="16" fill="#121b26" stroke="#29394b" stroke-width="2"/><text x="48" y="461" font-size="24" fill="#76d2fa" font-family="DejaVu Sans Mono,monospace">02 / AFTER SWITCH</text><rect x="50" y="491" width="62" height="47" rx="16" fill="#101823" stroke="#f2b36d" stroke-width="2"/><text x="62" y="525" font-size="30" fill="#f2b36d" font-family="DejaVu Sans Mono,monospace">rc</text><text x="132" y="525" font-size="29" fill="#e9eef5" font-family="DejaVu Sans Mono,monospace">openssh-server</text><rect x="50" y="558" width="62" height="47" rx="16" fill="#101823" stroke="#93dfc1" stroke-width="2"/><text x="62" y="592" font-size="30" fill="#93dfc1" font-family="DejaVu Sans Mono,monospace">ii</text><text x="132" y="592" font-size="28" fill="#e9eef5" font-family="DejaVu Sans Mono,monospace">openssh-server-gssapi</text><text x="30" y="706" font-size="33" fill="#a9b7c8">rc is expected.</text><rect x="26" y="739" width="568" height="163" rx="16" fill="#211c18" stroke="#73543c" stroke-width="2"/><text x="48" y="782" font-size="24" fill="#f2b36d" font-family="DejaVu Sans Mono,monospace">03 / UNSAFE PURGE</text><text x="48" y="828" font-size="30" fill="#e9eef5">Without the guard:</text><text x="48" y="871" font-size="28" fill="#e9eef5">config + host keys at risk</text><text x="30" y="942" font-size="22" fill="#a9b7c8" font-family="DejaVu Sans Mono,monospace">SCHEMATIC · NOT LIVE STATUS</text></g></svg>
