<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1030" viewBox="0 0 620 1030" role="img" aria-labelledby="title desc"><title id="title">Vom Befund zur geprüften Korrektur</title><desc id="desc">Nummerierte Forschungsstufen, keine proportionalen Mengenströme. Jede Zahl hat eine eigene Einheit. Kandidatenpatches benötigen menschliche Prüfung und Upstream-Meldung.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#b8adf5" stroke-width="1.5"/></marker></defs><rect width="620" height="1030" rx="18" fill="#0b1017"/><g font-family="DejaVu Sans,sans-serif"><text x="28" y="49" font-size="23" fill="#b8adf5">LINUX-KERNEL / KI</text><text x="28" y="101" font-size="33" fill="#e9eef5">Die Einheiten zählen.</text><text x="28" y="145" font-size="33" fill="#e9eef5">Die Belege prüfen.</text><rect x="28" y="191" width="564" height="112" rx="13" fill="#121b26" stroke="#29394b" stroke-width="2"/><text x="46" y="223" font-size="23" fill="#e9eef5">01 / Prüfziele</text><text x="46" y="272" font-size="35" fill="#b8adf5">5.034</text><text x="209" y="270" font-size="19" fill="#a9b7c8">Ausgewählte Codebereiche</text><rect x="28" y="319" width="564" height="112" rx="13" fill="#121b26" stroke="#29394b" stroke-width="2"/><text x="46" y="351" font-size="23" fill="#e9eef5">02 / Verdachtsmeldungen</text><text x="46" y="400" font-size="35" fill="#b8adf5">2.308</text><text x="209" y="398" font-size="19" fill="#a9b7c8">Nach erster Bereinigung</text><rect x="28" y="447" width="564" height="112" rx="13" fill="#121b26" stroke="#29394b" stroke-width="2"/><text x="46" y="479" font-size="23" fill="#e9eef5">03 / Reproduzierte Befunde</text><text x="46" y="528" font-size="35" fill="#b8adf5">1.724</text><text x="209" y="526" font-size="19" fill="#a9b7c8">Isolierte dynamische Prüfung</text><rect x="28" y="575" width="564" height="112" rx="13" fill="#121b26" stroke="#29394b" stroke-width="2"/><text x="46" y="607" font-size="23" fill="#e9eef5">04 / LPE-Exploit-Artefakte</text><text x="46" y="656" font-size="35" fill="#b8adf5">1.169</text><text x="209" y="654" font-size="19" fill="#a9b7c8">Sicherheitsauswirkung gezeigt</text><rect x="28" y="703" width="564" height="112" rx="13" fill="#121b26" stroke="#b8adf5" stroke-width="2"/><text x="46" y="735" font-size="23" fill="#e9eef5">05 / Bereinigte LPE-Gruppen</text><text x="46" y="784" font-size="35" fill="#b8adf5">948</text><text x="209" y="782" font-size="19" fill="#a9b7c8">Varianten + getrennte Patches</text><rect x="28" y="831" width="564" height="112" rx="13" fill="#121b26" stroke="#29394b" stroke-width="2"/><text x="46" y="863" font-size="23" fill="#e9eef5">06 / Menschliche Bewertung</text><text x="46" y="912" font-size="35" fill="#b8adf5">Prüfung</text><text x="219" y="910" font-size="19" fill="#a9b7c8">Menschlich</text><text x="28" y="992" font-size="23" fill="#a9b7c8">Verschiedene Einheiten · kein Mengenfluss</text></g></svg>
