<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1030" viewBox="0 0 620 1030" role="img" aria-labelledby="title desc"><title id="title">From finding to reviewed fix</title><desc id="desc">Numbered research stages, not proportional flows. Each count has its own unit. Human review and upstream reporting follow candidate patch generation.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#b8adf5" stroke-width="1.5"/></marker></defs><rect width="620" height="1030" rx="18" fill="#0b1017"/><g font-family="DejaVu Sans,sans-serif"><text x="28" y="49" font-size="23" fill="#b8adf5">LINUX KERNEL / AI</text><text x="28" y="101" font-size="33" fill="#e9eef5">Count the units.</text><text x="28" y="145" font-size="33" fill="#e9eef5">Review the evidence.</text><rect x="28" y="191" width="564" height="112" rx="13" fill="#121b26" stroke="#29394b" stroke-width="2"/><text x="46" y="223" font-size="23" fill="#e9eef5">01 / Audit targets</text><text x="46" y="272" font-size="35" fill="#b8adf5">5,034</text><text x="209" y="270" font-size="19" fill="#a9b7c8">Selected code areas</text><rect x="28" y="319" width="564" height="112" rx="13" fill="#121b26" stroke="#29394b" stroke-width="2"/><text x="46" y="351" font-size="23" fill="#e9eef5">02 / Candidate findings</text><text x="46" y="400" font-size="35" fill="#b8adf5">2,308</text><text x="209" y="398" font-size="19" fill="#a9b7c8">After initial deduplication</text><rect x="28" y="447" width="564" height="112" rx="13" fill="#121b26" stroke="#29394b" stroke-width="2"/><text x="46" y="479" font-size="23" fill="#e9eef5">03 / Reproduced findings</text><text x="46" y="528" font-size="35" fill="#b8adf5">1,724</text><text x="209" y="526" font-size="19" fill="#a9b7c8">Isolated dynamic validation</text><rect x="28" y="575" width="564" height="112" rx="13" fill="#121b26" stroke="#29394b" stroke-width="2"/><text x="46" y="607" font-size="23" fill="#e9eef5">04 / LPE exploit artifacts</text><text x="46" y="656" font-size="35" fill="#b8adf5">1,169</text><text x="209" y="654" font-size="19" fill="#a9b7c8">Security impact demonstrated</text><rect x="28" y="703" width="564" height="112" rx="13" fill="#121b26" stroke="#b8adf5" stroke-width="2"/><text x="46" y="735" font-size="23" fill="#e9eef5">05 / Distinct LPE groups</text><text x="46" y="784" font-size="35" fill="#b8adf5">948</text><text x="209" y="782" font-size="19" fill="#a9b7c8">Variants + distinct patches</text><rect x="28" y="831" width="564" height="112" rx="13" fill="#121b26" stroke="#29394b" stroke-width="2"/><text x="46" y="863" font-size="23" fill="#e9eef5">06 / Human assessment</text><text x="46" y="912" font-size="35" fill="#b8adf5">Review</text><text x="219" y="910" font-size="19" fill="#a9b7c8">Human review</text><text x="28" y="992" font-size="23" fill="#a9b7c8">Different units · not a flow chart</text></g></svg>
