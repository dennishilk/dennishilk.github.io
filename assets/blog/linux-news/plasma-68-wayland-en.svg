<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Two paths. One Wayland desktop.</title><desc id="desc">Native Wayland apps connect directly to KWin. X11 apps use the XWayland X server, which connects to KWin as a Wayland client. KWin presents both on the displays.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#8bcdf3" stroke-width="1.5"/></marker></defs><rect width="1200" height="700" rx="18" fill="#0b1017"/><g font-family="DejaVu Sans,sans-serif"><text x="44" y="54" font-size="19" fill="#8bcdf3">DENNIS HILK / LINUX</text><text x="44" y="119" font-size="43" fill="#e9eef5">Two paths. One Wayland desktop.</text><text x="44" y="167" font-size="24" fill="#a9b7c8">Plasma 6.8 · XWayland</text><rect x="44" y="235" width="360" height="125" rx="13" fill="#121b26" stroke="#8bcdf3" stroke-width="2"/><text x="68" y="284" font-size="29" fill="#e9eef5">Native Wayland app</text><text x="68" y="327" font-size="23" fill="#8bcdf3">Wayland</text><rect x="44" y="443" width="308" height="125" rx="13" fill="#121b26" stroke="#29394b" stroke-width="2"/><text x="68" y="494" font-size="29" fill="#e9eef5">X11 application</text><text x="68" y="535" font-size="23" fill="#8bcdf3">X11</text><rect x="412" y="443" width="290" height="125" rx="13" fill="#121b26" stroke="#8bcdf3" stroke-width="2"/><text x="438" y="494" font-size="32" fill="#e9eef5">XWayland</text><text x="438" y="535" font-size="19" fill="#a9b7c8">X server / Wayland client</text><rect x="794" y="285" width="362" height="187" rx="13" fill="#121b26" stroke="#8bcdf3" stroke-width="2"/><text x="820" y="339" font-size="42" fill="#8bcdf3">KWin</text><text x="820" y="383" font-size="27" fill="#e9eef5">Wayland compositor</text><text x="820" y="431" font-size="21" fill="#a9b7c8">Input + window management</text><path d="M414 296H758V331H782" fill="none" stroke="#8bcdf3" stroke-width="3" marker-end="url(#arrow)"/><path d="M362 505h38" fill="none" stroke="#8bcdf3" stroke-width="3" marker-end="url(#arrow)"/><path d="M712 505h42V421h28" fill="none" stroke="#8bcdf3" stroke-width="3" marker-end="url(#arrow)"/><path d="M975 482v44" fill="none" stroke="#8bcdf3" stroke-width="3" marker-end="url(#arrow)"/><rect x="794" y="540" width="362" height="83" rx="13" fill="#121b26" stroke="#29394b" stroke-width="2"/><text x="820" y="591" font-size="24" fill="#e9eef5">Graphics stack → displays</text><text x="44" y="658" font-size="25" fill="#a9b7c8">XWayland support continues. The Plasma X11 login session retires.</text><text x="44" y="687" font-size="16" fill="#a9b7c8">ORIGINAL SCHEMATIC / DENNISHILK.COM</text></g></svg>
