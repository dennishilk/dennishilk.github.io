<svg xmlns="http://www.w3.org/2000/svg" width="620" height="1030" viewBox="0 0 620 1030" role="img" aria-labelledby="title desc"><title id="title">Zwei Wege. Ein Wayland-Desktop.</title><desc id="desc">Native Wayland-Apps verbinden sich direkt mit KWin. X11-Apps nutzen den XWayland-X-Server als Wayland-Client von KWin. KWin stellt beide auf den Bildschirmen dar.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#8bcdf3" stroke-width="1.5"/></marker></defs><rect width="620" height="1030" rx="18" fill="#0b1017"/><g font-family="DejaVu Sans,sans-serif"><text x="28" y="49" font-size="23" fill="#8bcdf3">PLASMA 6.8 / WAYLAND</text><text x="28" y="101" font-size="33" fill="#e9eef5">X11-Apps bleiben.</text><text x="28" y="145" font-size="33" fill="#e9eef5">Die Sitzung ändert sich.</text><rect x="28" y="204" width="266" height="164" rx="13" fill="#121b26" stroke="#8bcdf3" stroke-width="2"/><text x="46" y="251" font-size="28" fill="#e9eef5">Native App</text><text x="46" y="301" font-size="27" fill="#8bcdf3">Wayland</text><text x="46" y="344" font-size="20" fill="#a9b7c8">Direkter Weg</text><rect x="326" y="204" width="266" height="164" rx="13" fill="#121b26" stroke="#29394b" stroke-width="2"/><text x="345" y="251" font-size="28" fill="#e9eef5">Ältere App</text><text x="345" y="301" font-size="27" fill="#8bcdf3">X11</text><path d="M459 379v48" fill="none" stroke="#8bcdf3" stroke-width="3" marker-end="url(#arrow)"/><rect x="326" y="442" width="266" height="140" rx="13" fill="#121b26" stroke="#8bcdf3" stroke-width="2"/><text x="345" y="488" font-size="28" fill="#e9eef5">XWayland</text><text x="345" y="530" font-size="24" fill="#e9eef5">X-Server</text><text x="345" y="563" font-size="22" fill="#a9b7c8">Wayland-Client</text><path d="M160 380v253" fill="none" stroke="#8bcdf3" stroke-width="3" marker-end="url(#arrow)"/><path d="M459 594v39" fill="none" stroke="#8bcdf3" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="650" width="564" height="142" rx="13" fill="#121b26" stroke="#8bcdf3" stroke-width="2"/><text x="50" y="699" font-size="37" fill="#8bcdf3">KWin</text><text x="50" y="750" font-size="24" fill="#e9eef5">Wayland-Compositor + Fensterverwaltung</text><path d="M310 804v36" fill="none" stroke="#8bcdf3" stroke-width="3" marker-end="url(#arrow)"/><rect x="28" y="858" width="564" height="94" rx="13" fill="#121b26" stroke="#29394b" stroke-width="2"/><text x="50" y="915" font-size="27" fill="#e9eef5">Grafikstack → Bildschirme</text><text x="28" y="1006" font-size="20" fill="#a9b7c8">DENNISHILK.COM / SCHEMA</text></g></svg>
