<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">OpenSSH: Paketübergabe</title><desc id="desc">OpenSSH: Paketübergabe</desc><rect width="1200" height="720" rx="18" fill="#0b1017"/><g font-family="DejaVu Sans,sans-serif"><text x="44" y="54" font-size="19" fill="#a9b7c8" font-family="DejaVu Sans Mono,monospace">DENNIS HILK / LINUX NEWS</text><text x="44" y="118" font-size="43" fill="#e9eef5">OpenSSH: Paketübergabe</text><text x="44" y="165" font-size="25" fill="#a9b7c8">Ubuntu 26.10 · Beispiel: regulär → GSSAPI</text><rect x="44" y="211" width="495" height="223" rx="16" fill="#121b26" stroke="#29394b" stroke-width="2"/><rect x="661" y="211" width="495" height="223" rx="16" fill="#121b26" stroke="#29394b" stroke-width="2"/><text x="70" y="258" font-size="23" fill="#76d2fa" font-family="DejaVu Sans Mono,monospace">01 / VORHER</text><rect x="72" y="292" width="62" height="47" rx="16" fill="#101823" stroke="#93dfc1" stroke-width="2"/><text x="84" y="326" font-size="30" fill="#93dfc1" font-family="DejaVu Sans Mono,monospace">ii</text><text x="153" y="326" font-size="27" fill="#e9eef5" font-family="DejaVu Sans Mono,monospace">openssh-server</text><text x="72" y="392" font-size="23" fill="#a9b7c8">Reguläre Variante installiert</text><path d="M558 324h80m-15-12 15 12-15 12" stroke="#76d2fa" stroke-width="3" fill="none"/><text x="685" y="258" font-size="23" fill="#76d2fa" font-family="DejaVu Sans Mono,monospace">02 / NACH WECHSEL</text><rect x="686" y="285" width="62" height="47" rx="16" fill="#101823" stroke="#f2b36d" stroke-width="2"/><text x="698" y="319" font-size="30" fill="#f2b36d" font-family="DejaVu Sans Mono,monospace">rc</text><text x="766" y="319" font-size="25" fill="#e9eef5" font-family="DejaVu Sans Mono,monospace">openssh-server</text><rect x="686" y="352" width="62" height="47" rx="16" fill="#101823" stroke="#93dfc1" stroke-width="2"/><text x="698" y="386" font-size="30" fill="#93dfc1" font-family="DejaVu Sans Mono,monospace">ii</text><text x="766" y="386" font-size="25" fill="#e9eef5" font-family="DejaVu Sans Mono,monospace">openssh-server-gssapi</text><text x="44" y="484" font-size="27" fill="#a9b7c8">Der Wechsel entfernt das alte Paket; rc ist erwartet.</text><rect x="44" y="522" width="1112" height="136" rx="16" fill="#211c18" stroke="#73543c" stroke-width="2"/><text x="70" y="570" font-size="26" fill="#f2b36d" font-family="DejaVu Sans Mono,monospace">03 / UNSICHERES PURGEN DES ALTEN PAKETS</text><text x="70" y="618" font-size="28" fill="#e9eef5">Ohne Schutz: Konfiguration + Hostschlüssel können verschwinden.</text><text x="44" y="699" font-size="19" fill="#a9b7c8" font-family="DejaVu Sans Mono,monospace">EIGENE ERKLÄRGRAFIK · KEINE LIVE-STATUSANZEIGE</text></g></svg>
