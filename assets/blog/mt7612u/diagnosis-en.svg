<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">From USB port to Wi-Fi</title><desc id="desc">USB detected → Driver bound → Firmware loaded → Interface registered → Connection established</desc>
<rect width="1200" height="760" rx="22" fill="#0d1520"/>
<g font-family="DejaVu Sans, sans-serif">
<text x="36" y="49" fill="#76dbea" font-size="18">MT7612U / LINUX / DIAGNOSE</text>
<text x="36" y="91" fill="#edf5fc" font-size="36" font-weight="bold">From USB port to Wi-Fi</text>
<rect x="36" y="130" width="1128" height="92" rx="12" fill="#152636" stroke="#2b6077"/>
<text x="58" y="164" fill="#edf5fc" font-size="25" font-weight="bold">USB detected</text>
<text x="620" y="164" fill="#75deef" font-size="22" font-family="monospace">lsusb</text>
<text x="58" y="196" fill="#bccddc" font-size="20">Device ID present; Wi-Fi not established.</text>
<path d="M 600.0 222 v 20" stroke="#60cee2" stroke-width="2"/>
<rect x="36" y="242" width="1128" height="92" rx="12" fill="#152636" stroke="#2b6077"/>
<text x="58" y="276" fill="#edf5fc" font-size="25" font-weight="bold">Driver bound</text>
<text x="620" y="276" fill="#75deef" font-size="22" font-family="monospace">lsusb -t</text>
<text x="58" y="308" fill="#bccddc" font-size="20">Driver=mt76x2u on the correct port.</text>
<path d="M 600.0 334 v 20" stroke="#60cee2" stroke-width="2"/>
<rect x="36" y="354" width="1128" height="92" rx="12" fill="#152636" stroke="#2b6077"/>
<text x="58" y="388" fill="#edf5fc" font-size="25" font-weight="bold">Firmware loaded</text>
<text x="620" y="388" fill="#75deef" font-size="22" font-family="monospace">journalctl -k -b</text>
<text x="58" y="420" fill="#bccddc" font-size="20">Check requests and initialization.</text>
<path d="M 600.0 446 v 20" stroke="#60cee2" stroke-width="2"/>
<rect x="36" y="466" width="1128" height="92" rx="12" fill="#152636" stroke="#2b6077"/>
<text x="58" y="500" fill="#edf5fc" font-size="25" font-weight="bold">Interface registered</text>
<text x="620" y="500" fill="#75deef" font-size="22" font-family="monospace">iw dev</text>
<text x="58" y="532" fill="#bccddc" font-size="20">Wireless device exists; link still separate.</text>
<path d="M 600.0 558 v 20" stroke="#60cee2" stroke-width="2"/>
<rect x="36" y="578" width="1128" height="92" rx="12" fill="#152636" stroke="#2b6077"/>
<text x="58" y="612" fill="#edf5fc" font-size="25" font-weight="bold">Connection established</text>
<text x="620" y="612" fill="#75deef" font-size="22" font-family="monospace">iw dev INTERFACE link</text>
<text x="58" y="644" fill="#bccddc" font-size="20">Then check IP, routing and DNS.</text>
<text x="36" y="734" fill="#9cafc0" font-size="17">dennishilk.com · Source-based schematic, not a hardware test</text></g></svg>
