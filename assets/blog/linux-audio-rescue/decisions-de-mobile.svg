<svg xmlns="http://www.w3.org/2000/svg" width="420" height="960" viewBox="0 0 420 960" role="img" aria-labelledby="title desc"><title id="title">Der nächste Schritt folgt dem Befund</title><desc id="desc">Vereinfachte Karte · mehr Zweige im Assistenten</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#76d2fa"/></marker></defs><rect width="100%" height="100%" fill="#0b1017"/><g font-family="DejaVu Sans, sans-serif"><text x="28" y="40" fill="#76d2fa" font-size="11" text-anchor="start" font-weight="650">DENNIS HILK / LINUX AUDIO RESCUE</text><text x="28" y="80" fill="#e9eef5" font-size="23" text-anchor="start" font-weight="650">Der nächste Schritt folgt</text><text x="28" y="114" fill="#e9eef5" font-size="23" text-anchor="start" font-weight="650">dem Befund</text><rect x="28" y="160" width="364" height="100" rx="14" fill="#142332" stroke="#355068"/><text x="48" y="194" fill="#76d2fa" font-size="20" text-anchor="start" font-weight="650">Verbindet sich wpctl?</text><text x="48" y="222" fill="#acbfd1" font-size="19" text-anchor="start" font-weight="400">Nein → Benutzer / Socket /</text><text x="48" y="244" fill="#acbfd1" font-size="19" text-anchor="start" font-weight="400">Dienst</text><path d="M210,260 L210,297" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="28" y="302" width="364" height="100" rx="14" fill="#142332" stroke="#355068"/><text x="48" y="336" fill="#76d2fa" font-size="20" text-anchor="start" font-weight="650">Erwartete ALSA-Karte?</text><text x="48" y="364" fill="#acbfd1" font-size="19" text-anchor="start" font-weight="400">Nein → Bus / Treiber / Firmware</text><path d="M210,402 L210,439" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="28" y="444" width="364" height="100" rx="14" fill="#142332" stroke="#355068"/><text x="48" y="478" fill="#76d2fa" font-size="20" text-anchor="start" font-weight="650">Ausgang / Profil vorhanden?</text><text x="48" y="506" fill="#acbfd1" font-size="19" text-anchor="start" font-weight="400">Nein → Profil / Policy / Journal</text><path d="M210,544 L210,581" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="28" y="586" width="364" height="100" rx="14" fill="#142332" stroke="#355068"/><text x="48" y="620" fill="#76d2fa" font-size="20" text-anchor="start" font-weight="650">Route und Pegel richtig?</text><text x="48" y="648" fill="#acbfd1" font-size="19" text-anchor="start" font-weight="400">Nein → Zielwahl / Mute</text><path d="M210,686 L210,723" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="28" y="728" width="364" height="100" rx="14" fill="#142332" stroke="#355068"/><text x="48" y="762" fill="#76d2fa" font-size="20" text-anchor="start" font-weight="650">Ursache noch unklar?</text><text x="48" y="790" fill="#acbfd1" font-size="19" text-anchor="start" font-weight="400">Befunde sichern; nichts blind</text><text x="48" y="812" fill="#acbfd1" font-size="19" text-anchor="start" font-weight="400">ändern</text></g></svg>
