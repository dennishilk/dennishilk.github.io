<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" viewBox="0 0 1040 700" role="img" aria-labelledby="title desc"><title id="title">Die fehlerhafte Ebene finden</title><desc id="desc">Ein Befund ist ein Hinweis, kein Urteil.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#76d2fa"/></marker></defs><rect width="100%" height="100%" fill="#0b1017"/><g font-family="DejaVu Sans, sans-serif"><text x="48" y="44" fill="#76d2fa" font-size="13" text-anchor="start" font-weight="650">DENNIS HILK / LINUX AUDIO RESCUE</text><text x="48" y="98" fill="#e9eef5" font-size="32" text-anchor="start" font-weight="650">Die fehlerhafte Ebene finden</text><rect x="48" y="146" width="944" height="80" rx="14" fill="#142332" stroke="#355068"/><text x="68" y="180" fill="#76d2fa" font-size="23" text-anchor="start" font-weight="650">01  Anwendung</text><text x="68" y="208" fill="#acbfd1" font-size="16" text-anchor="start" font-weight="400">Mute, Freigabe, gewähltes Backend</text><path d="M520,226 L520,241" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="48" y="246" width="944" height="80" rx="14" fill="#142332" stroke="#355068"/><text x="68" y="280" fill="#76d2fa" font-size="23" text-anchor="start" font-weight="650">02  Serververbindung</text><text x="68" y="308" fill="#acbfd1" font-size="16" text-anchor="start" font-weight="400">Benutzer, Runtime, Socket, Brücke</text><path d="M520,326 L520,341" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="48" y="346" width="944" height="80" rx="14" fill="#142332" stroke="#355068"/><text x="68" y="380" fill="#76d2fa" font-size="23" text-anchor="start" font-weight="650">03  Policy und Routing</text><text x="68" y="408" fill="#acbfd1" font-size="16" text-anchor="start" font-weight="400">Profil, Port, Ziel, Stream</text><path d="M520,426 L520,441" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="48" y="446" width="944" height="80" rx="14" fill="#142332" stroke="#355068"/><text x="68" y="480" fill="#76d2fa" font-size="23" text-anchor="start" font-weight="650">04  ALSA / kernel</text><text x="68" y="508" fill="#acbfd1" font-size="16" text-anchor="start" font-weight="400">Karte, PCM, Firmware, Besitzer</text><path d="M520,526 L520,541" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="48" y="546" width="944" height="80" rx="14" fill="#142332" stroke="#355068"/><text x="68" y="580" fill="#76d2fa" font-size="23" text-anchor="start" font-weight="650">05  Verbindung / Empfänger</text><text x="68" y="608" fill="#acbfd1" font-size="16" text-anchor="start" font-weight="400">Kabel, Strom, Clock, Signallock</text><text x="48" y="682" fill="#acbfd1" font-size="15" text-anchor="start" font-weight="400">Nur nach Befund tiefer gehen.</text></g></svg>
