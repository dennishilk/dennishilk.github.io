<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" viewBox="0 0 1040 700" role="img" aria-labelledby="title desc"><title id="title">Der nächste Schritt folgt dem Befund</title><desc id="desc">Vereinfachte Karte · mehr Zweige im Assistenten</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#76d2fa"/></marker></defs><rect width="100%" height="100%" fill="#0b1017"/><g font-family="DejaVu Sans, sans-serif"><text x="48" y="44" fill="#76d2fa" font-size="13" text-anchor="start" font-weight="650">DENNIS HILK / LINUX AUDIO RESCUE</text><text x="48" y="98" fill="#e9eef5" font-size="32" text-anchor="start" font-weight="650">Der nächste Schritt folgt dem Befund</text><rect x="48" y="154" width="410" height="90" rx="14" fill="#142332" stroke="#355068"/><text x="68" y="188" fill="#76d2fa" font-size="22" text-anchor="start" font-weight="650">Verbindet sich wpctl?</text><text x="68" y="216" fill="#acbfd1" font-size="16" text-anchor="start" font-weight="400">Nein → Sitzung / Socket / Dienst</text><rect x="574" y="154" width="418" height="90" rx="14" fill="#142332" stroke="#355068"/><text x="594" y="188" fill="#76d2fa" font-size="22" text-anchor="start" font-weight="650">Erwartete ALSA-Karte?</text><text x="594" y="216" fill="#acbfd1" font-size="16" text-anchor="start" font-weight="400">Nein → Bus / Treiber / Firmware</text><path d="M458,199 L568,199" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><text x="486" y="184" fill="#93dfc1" font-size="15" text-anchor="start" font-weight="400">ja</text><rect x="574" y="308" width="418" height="90" rx="14" fill="#142332" stroke="#355068"/><text x="594" y="342" fill="#76d2fa" font-size="22" text-anchor="start" font-weight="650">Ausgang / Profil vorhanden?</text><text x="594" y="370" fill="#acbfd1" font-size="16" text-anchor="start" font-weight="400">Nein → Policy / Profil / Journal</text><path d="M783,244 L783,302" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><text x="798" y="278" fill="#93dfc1" font-size="15" text-anchor="start" font-weight="400">ja</text><rect x="48" y="308" width="410" height="90" rx="14" fill="#142332" stroke="#355068"/><text x="68" y="342" fill="#76d2fa" font-size="22" text-anchor="start" font-weight="650">Route und Pegel richtig?</text><text x="68" y="370" fill="#acbfd1" font-size="16" text-anchor="start" font-weight="400">Nein → Ziel / Mute / Mixer</text><path d="M574,353 L464,353" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><text x="486" y="338" fill="#93dfc1" font-size="15" text-anchor="start" font-weight="400">ja</text><rect x="48" y="483" width="944" height="106" rx="14" fill="#142332" stroke="#355068"/><text x="68" y="517" fill="#76d2fa" font-size="22" text-anchor="start" font-weight="650">Ursache noch unklar? Befunde sichern.</text><text x="68" y="545" fill="#acbfd1" font-size="16" text-anchor="start" font-weight="400">App, Transport, Timing und Resume vergleichen — eine Variable pro Test.</text><path d="M253,398 L253,477" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><text x="48" y="640" fill="#acbfd1" font-size="17" text-anchor="start" font-weight="400">Diese Karte ist eine Zusammenfassung, nicht der vollständige Fehlerfinder.</text></g></svg>
