<svg xmlns="http://www.w3.org/2000/svg" width="420" height="960" viewBox="0 0 420 960" role="img" aria-labelledby="title desc"><title id="title">How Linux audio fits together</title><desc id="desc">Solid = audio · dashed = policy</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#76d2fa"/></marker></defs><rect width="100%" height="100%" fill="#0b1017"/><g font-family="DejaVu Sans, sans-serif"><text x="28" y="40" fill="#76d2fa" font-size="11" text-anchor="start" font-weight="650">DENNIS HILK / LINUX AUDIO RESCUE</text><text x="28" y="80" fill="#e9eef5" font-size="23" text-anchor="start" font-weight="650">How Linux audio fits</text><text x="28" y="114" fill="#e9eef5" font-size="23" text-anchor="start" font-weight="650">together</text><rect x="28" y="160" width="364" height="75" rx="14" fill="#142332" stroke="#355068"/><text x="48" y="194" fill="#76d2fa" font-size="22" text-anchor="start" font-weight="650">Applications</text><text x="48" y="222" fill="#acbfd1" font-size="19" text-anchor="start" font-weight="400">Browser · game · recorder</text><path d="M210,235 L210,258" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="28" y="264" width="364" height="86" rx="14" fill="#142332" stroke="#355068"/><text x="48" y="298" fill="#76d2fa" font-size="22" text-anchor="start" font-weight="650">API / compatibility</text><text x="48" y="326" fill="#acbfd1" font-size="19" text-anchor="start" font-weight="400">Native · PulseAudio · ALSA ·</text><text x="48" y="348" fill="#acbfd1" font-size="19" text-anchor="start" font-weight="400">JACK</text><path d="M210,350 L210,372" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="28" y="378" width="364" height="75" rx="14" fill="#142332" stroke="#355068"/><text x="48" y="412" fill="#76d2fa" font-size="22" text-anchor="start" font-weight="650">PipeWire</text><text x="48" y="440" fill="#acbfd1" font-size="19" text-anchor="start" font-weight="400">Audio graph / stream processing</text><path d="M210,453 L210,482" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="28" y="488" width="364" height="78" rx="14" fill="#142332" stroke="#355068"/><text x="48" y="522" fill="#76d2fa" font-size="22" text-anchor="start" font-weight="650">ALSA / kernel</text><text x="48" y="550" fill="#acbfd1" font-size="19" text-anchor="start" font-weight="400">Local drivers and PCM interfaces</text><path d="M210,566 L210,590" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="28" y="596" width="364" height="78" rx="14" fill="#142332" stroke="#355068"/><text x="48" y="630" fill="#76d2fa" font-size="22" text-anchor="start" font-weight="650">Local audio hardware</text><text x="48" y="658" fill="#acbfd1" font-size="19" text-anchor="start" font-weight="400">DAC · speakers · microphone</text><rect x="28" y="704" width="364" height="90" rx="14" fill="#102921" stroke="#93dfc1"/><text x="48" y="738" fill="#93dfc1" font-size="22" text-anchor="start" font-weight="650">WirePlumber = policy</text><text x="48" y="768" fill="#acbfd1" font-size="17" text-anchor="start" font-weight="400">Controls devices, routes and links</text><path d="M380,704 L380,436" stroke="#93dfc1" stroke-width="2.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 6"/><text x="28" y="832" fill="#76d2fa" font-size="18" text-anchor="start" font-weight="400">Bluetooth: PipeWire → BlueZ</text><text x="28" y="862" fill="#acbfd1" font-size="18" text-anchor="start" font-weight="400">→ radio / headset (not ALSA)</text><text x="28" y="914" fill="#acbfd1" font-size="15" text-anchor="start" font-weight="400">Solid: audio · dashed: control</text></g></svg>
