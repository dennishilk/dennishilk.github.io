<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" viewBox="0 0 1040 700" role="img" aria-labelledby="title desc"><title id="title">The next check follows the evidence</title><desc id="desc">Simplified map · more branches in the assistant</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#76d2fa"/></marker></defs><rect width="100%" height="100%" fill="#0b1017"/><g font-family="DejaVu Sans, sans-serif"><text x="48" y="44" fill="#76d2fa" font-size="13" text-anchor="start" font-weight="650">DENNIS HILK / LINUX AUDIO RESCUE</text><text x="48" y="98" fill="#e9eef5" font-size="32" text-anchor="start" font-weight="650">The next check follows the evidence</text><rect x="48" y="154" width="410" height="90" rx="14" fill="#142332" stroke="#355068"/><text x="68" y="188" fill="#76d2fa" font-size="22" text-anchor="start" font-weight="650">Can wpctl connect?</text><text x="68" y="216" fill="#acbfd1" font-size="16" text-anchor="start" font-weight="400">No → session / socket / service</text><rect x="574" y="154" width="418" height="90" rx="14" fill="#142332" stroke="#355068"/><text x="594" y="188" fill="#76d2fa" font-size="22" text-anchor="start" font-weight="650">Expected ALSA card?</text><text x="594" y="216" fill="#acbfd1" font-size="16" text-anchor="start" font-weight="400">No → bus / driver / firmware</text><path d="M458,199 L568,199" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><text x="486" y="184" fill="#93dfc1" font-size="15" text-anchor="start" font-weight="400">yes</text><rect x="574" y="308" width="418" height="90" rx="14" fill="#142332" stroke="#355068"/><text x="594" y="342" fill="#76d2fa" font-size="22" text-anchor="start" font-weight="650">Expected sink / profile?</text><text x="594" y="370" fill="#acbfd1" font-size="16" text-anchor="start" font-weight="400">No → policy / profile / journal</text><path d="M783,244 L783,302" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><text x="798" y="278" fill="#93dfc1" font-size="15" text-anchor="start" font-weight="400">yes</text><rect x="48" y="308" width="410" height="90" rx="14" fill="#142332" stroke="#355068"/><text x="68" y="342" fill="#76d2fa" font-size="22" text-anchor="start" font-weight="650">Correct route and volume?</text><text x="68" y="370" fill="#acbfd1" font-size="16" text-anchor="start" font-weight="400">No → target / mute / mixer</text><path d="M574,353 L464,353" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><text x="486" y="338" fill="#93dfc1" font-size="15" text-anchor="start" font-weight="400">yes</text><rect x="48" y="483" width="944" height="106" rx="14" fill="#142332" stroke="#355068"/><text x="68" y="517" fill="#76d2fa" font-size="22" text-anchor="start" font-weight="650">Still no clear cause? Preserve the evidence.</text><text x="68" y="545" fill="#acbfd1" font-size="16" text-anchor="start" font-weight="400">Compare app, transport, timing and resume — one variable at a time.</text><path d="M253,398 L253,477" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><text x="48" y="640" fill="#acbfd1" font-size="17" text-anchor="start" font-weight="400">This map is a summary, not the complete interactive tree.</text></g></svg>
