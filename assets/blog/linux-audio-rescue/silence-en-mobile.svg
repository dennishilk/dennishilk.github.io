<svg xmlns="http://www.w3.org/2000/svg" width="420" height="960" viewBox="0 0 420 960" role="img" aria-labelledby="title desc"><title id="title">When the beginning disappears</title><desc id="desc">Illustrative sequence · no measured durations</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#76d2fa"/></marker></defs><rect width="100%" height="100%" fill="#0b1017"/><g font-family="DejaVu Sans, sans-serif"><text x="28" y="40" fill="#76d2fa" font-size="11" text-anchor="start" font-weight="650">DENNIS HILK / LINUX AUDIO RESCUE</text><text x="28" y="80" fill="#e9eef5" font-size="23" text-anchor="start" font-weight="650">When the beginning</text><text x="28" y="114" fill="#e9eef5" font-size="23" text-anchor="start" font-weight="650">disappears</text><rect x="28" y="160" width="364" height="100" rx="14" fill="#142332" stroke="#355068"/><text x="48" y="194" fill="#76d2fa" font-size="20" text-anchor="start" font-weight="650">Playback</text><text x="48" y="222" fill="#acbfd1" font-size="19" text-anchor="start" font-weight="400">Receiver already synchronized</text><path d="M210,260 L210,297" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="28" y="303" width="364" height="100" rx="14" fill="#142332" stroke="#355068"/><text x="48" y="337" fill="#76d2fa" font-size="20" text-anchor="start" font-weight="650">Pause / seek / silence</text><text x="48" y="365" fill="#acbfd1" font-size="19" text-anchor="start" font-weight="400">Stream may stop or disconnect</text><path d="M210,403 L210,440" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="28" y="446" width="364" height="100" rx="14" fill="#142332" stroke="#355068"/><text x="48" y="480" fill="#e5b47c" font-size="20" text-anchor="start" font-weight="650">Possible idle transition</text><text x="48" y="508" fill="#acbfd1" font-size="19" text-anchor="start" font-weight="400">Node suspend OR receiver mute</text><path d="M210,546 L210,583" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="28" y="589" width="364" height="100" rx="14" fill="#142332" stroke="#355068"/><text x="48" y="623" fill="#76d2fa" font-size="20" text-anchor="start" font-weight="650">Playback resumes</text><text x="48" y="651" fill="#acbfd1" font-size="19" text-anchor="start" font-weight="400">Device / receiver may need time</text><path d="M210,689 L210,726" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="28" y="732" width="364" height="100" rx="14" fill="#142332" stroke="#355068"/><text x="48" y="766" fill="#e5b47c" font-size="20" text-anchor="start" font-weight="650">Opening sound may be lost</text><text x="48" y="794" fill="#acbfd1" font-size="19" text-anchor="start" font-weight="400">Cause and duration vary by setup</text><text x="28" y="935" fill="#acbfd1" font-size="16" text-anchor="start" font-weight="400">Schematic only — not a recording.</text></g></svg>
