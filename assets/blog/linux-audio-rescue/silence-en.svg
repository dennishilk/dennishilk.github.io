<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" viewBox="0 0 1040 700" role="img" aria-labelledby="title desc"><title id="title">When the beginning disappears</title><desc id="desc">Illustrative sequence · no measured durations</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#76d2fa"/></marker></defs><rect width="100%" height="100%" fill="#0b1017"/><g font-family="DejaVu Sans, sans-serif"><text x="48" y="44" fill="#76d2fa" font-size="13" text-anchor="start" font-weight="650">DENNIS HILK / LINUX AUDIO RESCUE</text><text x="48" y="98" fill="#e9eef5" font-size="32" text-anchor="start" font-weight="650">When the beginning disappears</text><rect x="112" y="146" width="816" height="80" rx="14" fill="#142332" stroke="#355068"/><text x="132" y="180" fill="#76d2fa" font-size="23" text-anchor="start" font-weight="650">Playback</text><text x="132" y="208" fill="#acbfd1" font-size="16" text-anchor="start" font-weight="400">Receiver already synchronized</text><path d="M520,226 L520,242" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="112" y="247" width="816" height="80" rx="14" fill="#142332" stroke="#355068"/><text x="132" y="281" fill="#76d2fa" font-size="23" text-anchor="start" font-weight="650">Pause / seek / silence</text><text x="132" y="309" fill="#acbfd1" font-size="16" text-anchor="start" font-weight="400">Stream may stop or disconnect</text><path d="M520,327 L520,343" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="112" y="348" width="816" height="80" rx="14" fill="#142332" stroke="#355068"/><text x="132" y="382" fill="#e5b47c" font-size="23" text-anchor="start" font-weight="650">Possible idle transition</text><text x="132" y="410" fill="#acbfd1" font-size="16" text-anchor="start" font-weight="400">Node suspend OR receiver mute</text><path d="M520,428 L520,444" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="112" y="449" width="816" height="80" rx="14" fill="#142332" stroke="#355068"/><text x="132" y="483" fill="#76d2fa" font-size="23" text-anchor="start" font-weight="650">Playback resumes</text><text x="132" y="511" fill="#acbfd1" font-size="16" text-anchor="start" font-weight="400">Device / receiver may need time</text><path d="M520,529 L520,545" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="112" y="550" width="816" height="80" rx="14" fill="#142332" stroke="#355068"/><text x="132" y="584" fill="#e5b47c" font-size="23" text-anchor="start" font-weight="650">Opening sound may be lost</text><text x="132" y="612" fill="#acbfd1" font-size="16" text-anchor="start" font-weight="400">Cause and duration vary by setup</text><text x="112" y="680" fill="#acbfd1" font-size="16" text-anchor="start" font-weight="400">Schematic only — not a recording.</text></g></svg>
