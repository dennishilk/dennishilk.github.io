<svg xmlns="http://www.w3.org/2000/svg" width="420" height="960" viewBox="0 0 420 960" role="img" aria-labelledby="title desc"><title id="title">Die fehlerhafte Ebene finden</title><desc id="desc">Ein Befund ist ein Hinweis, kein Urteil.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#76d2fa"/></marker></defs><rect width="100%" height="100%" fill="#0b1017"/><g font-family="DejaVu Sans, sans-serif"><text x="28" y="40" fill="#76d2fa" font-size="11" text-anchor="start" font-weight="650">DENNIS HILK / LINUX AUDIO RESCUE</text><text x="28" y="80" fill="#e9eef5" font-size="23" text-anchor="start" font-weight="650">Die fehlerhafte Ebene</text><text x="28" y="114" fill="#e9eef5" font-size="23" text-anchor="start" font-weight="650">finden</text><rect x="28" y="160" width="364" height="100" rx="14" fill="#142332" stroke="#355068"/><text x="48" y="194" fill="#76d2fa" font-size="21" text-anchor="start" font-weight="650">01  Anwendung</text><text x="48" y="222" fill="#acbfd1" font-size="19" text-anchor="start" font-weight="400">Mute, Freigabe, gewähltes</text><text x="48" y="244" fill="#acbfd1" font-size="19" text-anchor="start" font-weight="400">Backend</text><path d="M210,260 L210,296" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="28" y="302" width="364" height="100" rx="14" fill="#142332" stroke="#355068"/><text x="48" y="336" fill="#76d2fa" font-size="21" text-anchor="start" font-weight="650">02  Serververbindung</text><text x="48" y="364" fill="#acbfd1" font-size="19" text-anchor="start" font-weight="400">Benutzer, Runtime, Socket,</text><text x="48" y="386" fill="#acbfd1" font-size="19" text-anchor="start" font-weight="400">Brücke</text><path d="M210,402 L210,438" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="28" y="444" width="364" height="100" rx="14" fill="#142332" stroke="#355068"/><text x="48" y="478" fill="#76d2fa" font-size="21" text-anchor="start" font-weight="650">03  Policy und Routing</text><text x="48" y="506" fill="#acbfd1" font-size="19" text-anchor="start" font-weight="400">Profil, Port, Ziel, Stream</text><path d="M210,544 L210,580" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="28" y="586" width="364" height="100" rx="14" fill="#142332" stroke="#355068"/><text x="48" y="620" fill="#76d2fa" font-size="21" text-anchor="start" font-weight="650">04  ALSA / kernel</text><text x="48" y="648" fill="#acbfd1" font-size="19" text-anchor="start" font-weight="400">Karte, PCM, Firmware, Besitzer</text><path d="M210,686 L210,722" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="28" y="728" width="364" height="100" rx="14" fill="#142332" stroke="#355068"/><text x="48" y="762" fill="#76d2fa" font-size="21" text-anchor="start" font-weight="650">05  Verbindung / Empfänger</text><text x="48" y="790" fill="#acbfd1" font-size="19" text-anchor="start" font-weight="400">Kabel, Strom, Clock, Signallock</text><text x="28" y="935" fill="#acbfd1" font-size="15" text-anchor="start" font-weight="400">Nur nach Befund tiefer gehen.</text></g></svg>
