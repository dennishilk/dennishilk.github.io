<svg xmlns="http://www.w3.org/2000/svg" width="420" height="960" viewBox="0 0 420 960" role="img" aria-labelledby="title desc"><title id="title">Find the failing layer</title><desc id="desc">An observation is a lead, not a verdict.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#76d2fa"/></marker></defs><rect width="100%" height="100%" fill="#0b1017"/><g font-family="DejaVu Sans, sans-serif"><text x="28" y="40" fill="#76d2fa" font-size="11" text-anchor="start" font-weight="650">DENNIS HILK / LINUX AUDIO RESCUE</text><text x="28" y="80" fill="#e9eef5" font-size="23" text-anchor="start" font-weight="650">Find the failing layer</text><rect x="28" y="160" width="364" height="100" rx="14" fill="#142332" stroke="#355068"/><text x="48" y="194" fill="#76d2fa" font-size="21" text-anchor="start" font-weight="650">01  Application</text><text x="48" y="222" fill="#acbfd1" font-size="19" text-anchor="start" font-weight="400">Mute, permission, selected</text><text x="48" y="244" fill="#acbfd1" font-size="19" text-anchor="start" font-weight="400">backend</text><path d="M210,260 L210,296" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="28" y="302" width="364" height="100" rx="14" fill="#142332" stroke="#355068"/><text x="48" y="336" fill="#76d2fa" font-size="21" text-anchor="start" font-weight="650">02  Server connection</text><text x="48" y="364" fill="#acbfd1" font-size="19" text-anchor="start" font-weight="400">User, runtime, socket, bridge</text><path d="M210,402 L210,438" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="28" y="444" width="364" height="100" rx="14" fill="#142332" stroke="#355068"/><text x="48" y="478" fill="#76d2fa" font-size="21" text-anchor="start" font-weight="650">03  Policy and routing</text><text x="48" y="506" fill="#acbfd1" font-size="19" text-anchor="start" font-weight="400">Profile, port, target, stream</text><path d="M210,544 L210,580" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="28" y="586" width="364" height="100" rx="14" fill="#142332" stroke="#355068"/><text x="48" y="620" fill="#76d2fa" font-size="21" text-anchor="start" font-weight="650">04  ALSA / kernel</text><text x="48" y="648" fill="#acbfd1" font-size="19" text-anchor="start" font-weight="400">Card, PCM, firmware, ownership</text><path d="M210,686 L210,722" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="28" y="728" width="364" height="100" rx="14" fill="#142332" stroke="#355068"/><text x="48" y="762" fill="#76d2fa" font-size="21" text-anchor="start" font-weight="650">05  Physical link / receiver</text><text x="48" y="790" fill="#acbfd1" font-size="19" text-anchor="start" font-weight="400">Cable, power, clock, signal lock</text><text x="28" y="935" fill="#acbfd1" font-size="15" text-anchor="start" font-weight="400">Go deeper only when evidence points there.</text></g></svg>
