<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="700" viewBox="0 0 1040 700" role="img" aria-labelledby="title desc"><title id="title">How Linux audio fits together</title><desc id="desc">Solid = audio · dashed = policy</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#76d2fa"/></marker></defs><rect width="100%" height="100%" fill="#0b1017"/><g font-family="DejaVu Sans, sans-serif"><text x="48" y="44" fill="#76d2fa" font-size="13" text-anchor="start" font-weight="650">DENNIS HILK / LINUX AUDIO RESCUE</text><text x="48" y="98" fill="#e9eef5" font-size="32" text-anchor="start" font-weight="650">How Linux audio fits together</text><rect x="48" y="146" width="570" height="82" rx="14" fill="#142332" stroke="#355068"/><text x="68" y="180" fill="#76d2fa" font-size="22" text-anchor="start" font-weight="650">Applications</text><text x="68" y="208" fill="#acbfd1" font-size="16" text-anchor="start" font-weight="400">Browser · game · recorder</text><path d="M330,228 L330,247" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="48" y="253" width="570" height="82" rx="14" fill="#142332" stroke="#355068"/><text x="68" y="287" fill="#76d2fa" font-size="22" text-anchor="start" font-weight="650">API / compatibility</text><text x="68" y="315" fill="#acbfd1" font-size="16" text-anchor="start" font-weight="400">Native · pipewire-pulse · ALSA plugin · JACK</text><path d="M330,335 L330,354" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="48" y="360" width="570" height="82" rx="14" fill="#142332" stroke="#355068"/><text x="68" y="394" fill="#76d2fa" font-size="22" text-anchor="start" font-weight="650">PipeWire</text><text x="68" y="422" fill="#acbfd1" font-size="16" text-anchor="start" font-weight="400">Audio graph and stream processing</text><path d="M330,442 L330,462" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="48" y="468" width="570" height="82" rx="14" fill="#142332" stroke="#355068"/><text x="68" y="502" fill="#76d2fa" font-size="22" text-anchor="start" font-weight="650">ALSA / kernel</text><text x="68" y="530" fill="#acbfd1" font-size="16" text-anchor="start" font-weight="400">Local drivers / PCM interfaces</text><path d="M330,550 L330,570" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="48" y="576" width="570" height="80" rx="14" fill="#142332" stroke="#355068"/><text x="68" y="610" fill="#76d2fa" font-size="22" text-anchor="start" font-weight="650">Local audio hardware</text><text x="68" y="638" fill="#acbfd1" font-size="16" text-anchor="start" font-weight="400">DAC · speakers · microphone</text><rect x="682" y="253" width="310" height="106" rx="14" fill="#142332" stroke="#355068"/><text x="702" y="287" fill="#93dfc1" font-size="22" text-anchor="start" font-weight="650">WirePlumber</text><text x="702" y="315" fill="#acbfd1" font-size="16" text-anchor="start" font-weight="400">Policy / device management</text><path d="M682,310 L618,395" stroke="#93dfc1" stroke-width="2.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 6"/><path d="M682,334 L618,502" stroke="#93dfc1" stroke-width="2.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="7 6"/><rect x="682" y="468" width="310" height="94" rx="14" fill="#142332" stroke="#355068"/><text x="702" y="502" fill="#76d2fa" font-size="22" text-anchor="start" font-weight="650">BlueZ / Bluetooth</text><text x="702" y="530" fill="#acbfd1" font-size="16" text-anchor="start" font-weight="400">Separate audio transport</text><path d="M618,402 L826,468" stroke="#76d2fa" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><text x="682" y="600" fill="#93dfc1" font-size="15" text-anchor="start" font-weight="400">Dashed links control the graph.</text><text x="682" y="625" fill="#acbfd1" font-size="15" text-anchor="start" font-weight="400">They do not carry audio here.</text></g></svg>
